name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  moteur:
    name: Moteur (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  navigateur:
    name: Navigateur (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # V8.25 : la version publiée (obfusquée, protégée) est construite puis jouée et attaquée
      - run: npm run build
      - run: npm run test:release
