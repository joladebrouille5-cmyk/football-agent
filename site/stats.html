<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Football Agent — Statistiques</title>
<style>
:root { --bg:#05080a; --card:#0d1418; --line:#1f2b31; --ink:#e8f0ec; --muted:#8fa29b; --bar:#c6f135; --bar-soft:#3b4a1a; --bad:#ff6b6b; }
@media (prefers-color-scheme: light) { :root { --bg:#eef2f0; --card:#ffffff; --line:#d5dfda; --ink:#0d1a14; --muted:#5b6d66; --bar:#4d7c0f; --bar-soft:#dbe7c6; --bad:#c62828; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
main { max-width:1100px; margin:0 auto; padding:16px; }
h1 { font-size:22px; margin:8px 0 2px; letter-spacing:.02em; }
.muted { color:var(--muted); font-size:13px; }
.bar-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
input, select, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
button { cursor:pointer; font-weight:700; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0; }
.card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 10px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:12px; }
.kpi b { display:block; font-size:28px; font-variant-numeric:tabular-nums; }
.row { display:grid; grid-template-columns:minmax(80px,38%) 1fr auto; gap:8px; align-items:center; font-size:13px; padding:3px 0; }
.row .lab { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track { height:10px; border-radius:0 4px 4px 0; background:transparent; }
.fill { height:10px; background:var(--bar); border-radius:0 4px 4px 0; min-width:2px; }
.num { font-variant-numeric:tabular-nums; color:var(--ink); }
.cols { display:flex; align-items:flex-end; gap:2px; height:140px; border-bottom:1px solid var(--line); }
.col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; position:relative; }
.col .a { background:var(--bar); border-radius:4px 4px 0 0; }
.col .n { background:var(--bar-soft); border-radius:4px 4px 0 0; margin-top:2px; }
.col:hover .a { outline:2px solid var(--ink); }
.axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
.err { color:var(--bad); font-size:13px; }
.report { border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
.report:first-of-type { border-top:0; }
.legend { display:flex; gap:12px; font-size:12px; color:var(--muted); margin-top:6px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:4px; }
#tip { position:fixed; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; display:none; z-index:5; }
</style>
</head>
<body>
<main>
<h1>📊 Football Agent — statistiques</h1>
<p class="muted">Données anonymes envoyées par le jeu depuis play.footagent.workers.dev (joueurs qui ont laissé « Statistiques anonymes » activé). Page privée : mot de passe défini dans le secret STATS_KEY.</p>
<div class="bar-row">
  <input id="key" type="password" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe">
  <select id="days" aria-label="Période"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="90">90 jours</option></select>
  <button id="go">Afficher</button>
  <span id="status" class="muted"></span>
</div>
<div id="out"></div>
</main>
<div id="tip" role="tooltip"></div>
<script src="report-summary.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  try { $('key').value = localStorage.getItem('fa_stats_key') || ''; } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { n = Math.round(+n || 0); return n.toLocaleString('fr-FR'); }
  var LABELS = { 'new': 'Nouveaux', nouveau: 'Nouveau joueur', meme_jour: 'Revenu le même jour', 'J+1': 'Revenu le lendemain', 'J+2-7': 'Revenu sous une semaine', 'J+8-30': 'Revenu sous un mois', 'J+30+': 'Revenu après un mois',
    mobile: 'Mobile', tablette: 'Tablette', ordi: 'Ordinateur', agent: 'Agent', president: 'Président à plein temps', 'agent+club': 'Agent avec un club', '': '(inconnu)' };
  function lab(k) { return LABELS[k] != null ? LABELS[k] : k; }
  function card(title, body) { return '<div class="card"><h2>' + esc(title) + '</h2>' + body + '</div>'; }
  function bars(rows, opts) {
    opts = opts || {};
    if (!rows) return '<p class="muted">Aucune donnée.</p>';
    if (rows.error) return '<p class="err">Requête impossible : ' + esc(rows.error) + '</p>';
    if (!rows.length) return '<p class="muted">Aucune donnée sur la période.</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return +r.n || 0; })) || 1;
    return rows.map(function (r) {
      var k = opts.key ? opts.key(r) : lab(r.k);
      return '<div class="row" data-tip="' + esc(k + ' : ' + fmt(r.n)) + '"><span class="lab" title="' + esc(k) + '">' + esc(k) + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.max(1, (+r.n / max) * 100) + '%"></span></span><span class="num">' + fmt(r.n) + '</span></div>';
    }).join('');
  }
  function daily(rows) {
    if (!rows || rows.error) return '<p class="err">' + esc(rows && rows.error || 'Aucune donnée.') + '</p>';
    if (!rows.length) return '<p class="muted">Aucune session sur la période.</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return +r.sessions || 0; })) || 1;
    var cols = rows.map(function (r) {
      var s = +r.sessions || 0, n = Math.min(s, +r.newcomers || 0);
      return '<div class="col" data-tip="' + esc(r.day + ' · ' + fmt(s) + ' sessions, dont ' + fmt(n) + ' nouveaux') + '"><div class="a" style="height:' + ((s - n) / max) * 100 + '%"></div><div class="n" style="height:' + (n / max) * 100 + '%"></div></div>';
    }).join('');
    return '<div class="cols">' + cols + '</div><div class="axis"><span>' + esc(rows[0].day) + '</span><span>' + esc(rows[rows.length - 1].day) + '</span></div>' +
      '<div class="legend"><span><span class="sw" style="background:var(--bar)"></span>Joueurs qui reviennent</span><span><span class="sw" style="background:var(--bar-soft)"></span>Nouveaux joueurs</span></div>';
  }
  var lastReports = [], lastDays = 30;
  // Synthèse : thèmes classés du plus signalé au moins signalé, problèmes répétés regroupés (report-summary.js)
  function summaryHTML(rep, days) {
    if (!rep || rep.error || !rep.length || !window.FAReports) return '';
    var sum = FAReports.summarize(rep), max = sum.themes.length ? sum.themes[0].count : 1;
    var rows = sum.themes.map(function (t, i) {
      var vers = Object.keys(t.versions).sort().reverse().slice(0, 3).map(function (v) { return 'v' + v; }).join(', ');
      var probs = t.problems.slice(0, 5).map(function (p) {
        return '<div class="report"><b class="num">' + p.count + '×</b>' + (p.players > 1 ? ' <span class="muted">(' + p.players + ' joueurs)</span>' : '') + ' — ' + esc(p.examples[0]) +
          (p.examples.length > 1 ? '<div class="muted">aussi : « ' + p.examples.slice(1).map(esc).join(' » · « ') + ' »</div>' : '') +
          '<div class="muted">réf. ' + esc(p.refs.slice(0, 6).join(', ')) + (p.refs.length > 6 ? '…' : '') + ' · dernier : ' + esc(String(p.last).slice(0, 16)) + '</div></div>';
      }).join('');
      return '<details' + (i < 3 ? ' open' : '') + ' style="margin:8px 0"><summary style="cursor:pointer" data-tip="' + esc(t.label + ' : ' + t.count + ' signalement(s)') + '"><b>' + (i + 1) + '. ' + esc(t.label) + '</b> <span class="num muted">· ' + t.count + ' signalement' + (t.count > 1 ? 's' : '') + '</span>' +
        '<span style="display:block;margin:4px 0 0 18px"><span class="fill" style="display:block;width:' + Math.max(2, t.count / max * 100) + '%"></span></span></summary>' +
        '<div class="muted" style="margin:4px 0">' + t.playerCount + ' joueur(s) · ' + (t.repeated ? t.repeated + ' problème(s) signalé(s) plusieurs fois · ' : '') + (t.saves ? t.saves + ' partie(s) jointe(s) · ' : '') + (vers ? vers : '') + '</div>' + probs + '</details>';
    }).join('');
    return '<div class="card" style="margin-top:12px" id="summary"><h2>Synthèse des signalements (' + sum.total + ' sur ' + days + ' jours)</h2>' +
      '<p class="muted" style="margin:0 0 8px">Thèmes classés du plus signalé au moins signalé ; les messages qui décrivent le même problème sont regroupés (« 3× »). Touchez un thème pour le détail.</p>' + rows +
      '<div class="bar-row"><button id="copyReports">📋 Copier tous les signalements pour Claude</button><span id="copyStatus" class="muted"></span></div></div>';
  }
  function render(res) {
    var d = res.data || {};
    var sessions = (d.daily && d.daily.length) ? d.daily.reduce(function (a, r) { return a + (+r.sessions || 0); }, 0) : 0;
    var newcomers = (d.daily && d.daily.length) ? d.daily.reduce(function (a, r) { return a + (+r.newcomers || 0); }, 0) : 0;
    var players = d.players && d.players[0] ? d.players[0].players : null;
    var dur = d.duration && d.duration[0] ? d.duration[0] : null;
    var html = '<div class="kpis">' +
      '<div class="card kpi"><h2>Joueurs</h2><b>' + (players != null ? fmt(players) : '—') + '</b><span class="muted">navigateurs différents</span></div>' +
      '<div class="card kpi"><h2>Sessions</h2><b>' + fmt(sessions) + '</b><span class="muted">sur ' + res.days + ' jours</span></div>' +
      '<div class="card kpi"><h2>Nouveaux</h2><b>' + fmt(newcomers) + '</b><span class="muted">premières parties</span></div>' +
      '<div class="card kpi"><h2>Durée moyenne</h2><b>' + (dur ? fmt(dur.minutes) + ' min' : '—') + '</b><span class="muted">' + (dur ? fmt(dur.months) + ' mois de jeu par session' : '') + '</span></div></div>';
    html += '<div class="card" style="margin-bottom:12px"><h2>Sessions par jour</h2>' + daily(d.daily) + '</div>';
    html += '<div class="grid">' +
      card('Fidélité (sessions)', bars(d.returning)) +
      card('Pays', bars(d.countries)) +
      card('Appareils', bars(d.devices)) +
      card('Langues', bars(d.langs)) +
      card('Versions', bars(d.versions)) +
      card('Modes de jeu', bars(d.modes)) +
      card('Scénarios', bars(d.scenarios)) +
      card('Taille du monde (joueurs)', bars(Array.isArray(d.worlds) ? d.worlds.map(x => Object.assign({}, x, { k: ({ complet: 'Complet', europe: 'Europe +', leger: 'Léger' })[x.k] || 'Avant la 8.56' })) : d.worlds)) +
      card('Écrans les plus vus', bars(d.screens)) +
      card('Fonctions utilisées', bars(d.features)) +
      card('Saisons atteintes', bars(d.seasons, { key: function (r) { return 'Saison ' + r.k; } })) +
      card('Moments clés', bars(d.moments)) +
      card('Erreurs les plus fréquentes', bars(d.errors, { key: function (r) { return r.k + ' (v' + r.v + ')'; } })) +
      '</div>';
    var rep = d.reports;
    html += summaryHTML(rep, res.days);
    var shown = rep && !rep.error ? rep.slice(0, 30) : rep;
    html += '<div class="card" style="margin-top:12px"><h2>Signalements' + (rep && rep.length > 30 ? ' (30 plus récents sur ' + rep.length + ')' : '') + '</h2>' + (!rep || rep.error ? '<p class="err">' + esc(rep && rep.error || 'Aucun.') + '</p>' : !rep.length ? '<p class="muted">Aucun signalement sur la période.</p>' :
      shown.map(function (r) {
        var ref = String(r.ref || ''), code = ref.slice(0, 6), withSave = /\+save$/.test(ref);
        return '<div class="report"><div class="muted">' + esc(r.timestamp || r.at) + ' · réf. ' + esc(code) + ' · v' + esc(r.v) + ' · ' + esc(lab(r.dev)) + ' · ' + esc(r.country) + ' · ' + esc((window.FAReports ? FAReports.themeOf(r.text).label : '')) + '</div>' + esc(r.text) +
          (withSave ? '<div style="margin-top:6px"><button class="dl" data-ref="' + esc(code) + '">⬇️ Télécharger la partie (' + esc(code) + '.fasave)</button></div>' : /save_locale/.test(ref) ? '<div class="muted">Partie gardée par le joueur (envoi impossible)</div>' : '') + '</div>';
      }).join('')) + '</div>';
    lastReports = rep && !rep.error ? rep : []; lastDays = res.days;
    $('out').innerHTML = html;
  }
  function load() {
    var key = $('key').value.trim();
    if (!key) { $('status').textContent = 'Entrez le mot de passe.'; return; }
    try { localStorage.setItem('fa_stats_key', key); } catch (e) {}
    $('status').textContent = 'Chargement…';
    fetch('/api/stats?days=' + $('days').value, { headers: { 'x-stats-key': key }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.s === 401) { $('status').textContent = 'Mot de passe incorrect.'; return; }
        if (x.j.error === 'token') { $('status').textContent = 'Cloudflare refuse le jeton CF_API_TOKEN (' + x.j.length + ' caractères reçus ; un jeton fait environ 40 caractères). Recréez un jeton personnalisé avec la permission Compte > Account Analytics > Lecture, copiez-le avec le bouton « Copier » juste après sa création, remplacez le secret CF_API_TOKEN (Rotate) puis appuyez sur Déployer.'; return; }
        if (x.j.error === 'setup') { $('status').textContent = 'Configuration incomplète : le site ne voit pas ' + x.j.missing + '. Dans Cloudflare (Workers & Pages > play > Paramètres > Variables et secrets), ajoutez-le avec le type « Secret » (pas dans les paramètres de build), puis appuyez sur Déployer.'; return; }
        if (x.s !== 200) { $('status').textContent = 'Erreur ' + x.s; return; }
        $('status').textContent = ''; render(x.j);
      }).catch(function () { $('status').textContent = 'Impossible de joindre le serveur.'; });
  }
  $('go').addEventListener('click', load);
  // texte prêt à coller dans une conversation avec Claude, pour une analyse plus fine
  $('out').addEventListener('click', function (e) {
    if (!(e.target && e.target.id === 'copyReports')) return;
    var txt = FAReports.toText(lastReports, lastDays);
    var done = function () { $('copyStatus').textContent = 'Copié : collez-le dans votre conversation avec Claude.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallback(txt); });
    else fallback(txt);
    function fallback(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (err) { $('copyStatus').textContent = 'Copie impossible.'; } ta.remove(); }
  });
  // téléchargement d'une partie jointe à un signalement (V8.52)
  $('out').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button.dl'); if (!b) return;
    var ref = b.getAttribute('data-ref'); b.disabled = true; b.textContent = 'Téléchargement…';
    fetch('/api/save?ref=' + encodeURIComponent(ref), { headers: { 'x-stats-key': $('key').value.trim() }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status === 404 ? 'Partie introuvable (plus de 60 jours ?)' : 'Erreur ' + r.status); return r.blob(); })
      .then(function (blob) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'football-agent-' + ref + '.fasave'; document.body.appendChild(a); a.click(); a.remove(); b.textContent = '✅ Téléchargée — Paramètres > Importer dans le jeu'; })
      .catch(function (err) { b.disabled = false; b.textContent = '⚠️ ' + err.message; });
  });
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  var tip = $('tip');
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
  if ($('key').value) load();
})();
</script>
</body>
</html>
