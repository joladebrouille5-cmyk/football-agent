      <div class="row-between small"><span>Entretien du stade</span><span class="num">-${fmtMoneyShort(inc.maintenanceCost)}</span></div>` : ''}
    </div>
  `;
}
function clubFixturesHTML(c) {
  const lg = G.leagues[c.league];
  if (!lg) return '<p class="small">—</p>';
  const order = SEASON_MONTH_ORDER;
  const items = lg.fixtures.map((f, idx) => ({ f, idx })).filter(x => x.f.home === c.id || x.f.away === c.id);
  items.sort((a, b) => order.indexOf(a.f.month) - order.indexOf(b.f.month));
  if (!items.length) return '<p class="small">Calendrier pas encore généré.</p>';
  return items.map(({ f, idx }) => {
    const isHome = f.home === c.id;
    const opp = G.clubs[isHome ? f.away : f.home];
    const monthShort = (MONTH_NAMES[f.month] || '').slice(0, 3);
    if (!f.played) {
      return `<div class="list-row" style="cursor:default"><div class="small num" style="width:34px">${monthShort}</div>${clubBadgeHTML(opp, 'sm')}<div style="flex:1"><div class="name" style="font-size:13px">${esc(opp ? opp.name : '?')}</div><div class="sub">${isHome ? 'Domicile' : 'Extérieur'}</div></div><div class="right small">à venir</div></div>`;
    }
    const gf = isHome ? f.scoreHome : f.scoreAway, ga = isHome ? f.scoreAway : f.scoreHome;
    const resColor = gf > ga ? 'var(--emerald)' : (gf === ga ? 'var(--ink-faint)' : 'var(--red)');
    const hasDetail = !!f.motm || (f.scorersHome && f.scorersHome.length) || (f.scorersAway && f.scorersAway.length);
    const clickAttr = hasDetail ? ` onclick="openMatchDetail('${lg.id}',${idx})"` : ' style="cursor:default"';
    return `<div class="list-row"${clickAttr}><div class="small num" style="width:34px">${monthShort}</div>${clubBadgeHTML(opp, 'sm')}<div style="flex:1"><div class="name" style="font-size:13px">${esc(opp ? opp.name : '?')}</div><div class="sub">${isHome ? 'Domicile' : 'Extérieur'}</div></div><div class="right"><b class="num" style="color:${resColor}">${gf}-${ga}</b></div></div>`;
  }).join('');
}
function openMatchDetail(leagueId, idx) {
  const lg = G.leagues[leagueId];
  const f = lg && lg.fixtures[idx];
  if (!f || !f.played) return;
  const home = G.clubs[f.home], away = G.clubs[f.away];
  const scorerLine = s => `<div class="small" style="cursor:pointer" onclick="closeModal();openPlayerDetail('${s.id}','world')">⚽ ${esc(s.name)}${s.assistName ? ` <span class="small">(passe : ${esc(s.assistName)})</span>` : ''} <span class="num">${s.min}'</span></div>`;
  const cardsHTML = [
    ...(f.cardsY || []).map(c => `<div class="small">🟨 ${esc(c.name)}</div>`),
    ...(f.cardsR || []).map(c => `<div class="small">🟥 ${esc(c.name)}</div>`),
  ].join('');
  renderModal(`
    <div class="modal-head"><h3>Résultat</h3><button class="modal-close" onclick="closeModal()">${icon('close',16)}</button></div>
    <div class="row-between" style="align-items:center">
      <div style="text-align:center;flex:1">${clubBadgeHTML(home)}<div class="small" style="margin-top:5px">${esc(home.short)}</div></div>
      <b class="num" style="font-size:26px;padding:0 10px">${f.scoreHome} - ${f.scoreAway}</b>
      <div style="text-align:center;flex:1">${clubBadgeHTML(away)}<div class="small" style="margin-top:5px">${esc(away.short)}</div></div>
    </div>
    <div class="sep"></div>
    <div class="grid-2">
      <div><div class="card-title">Buteurs ${esc(home.short)}</div>${(f.scorersHome || []).map(scorerLine).join('') || '<div class="small">—</div>'}</div>
      <div><div class="card-title">Buteurs ${esc(away.short)}</div>${(f.scorersAway || []).map(scorerLine).join('') || '<div class="small">—</div>'}</div>
    </div>
    ${cardsHTML ? `<div class="sep"></div><div class="card-title">Cartons</div>${cardsHTML}` : ''}
    ${f.motm ? `<div class="sep"></div><div class="card-title">Homme du match</div><div class="small" style="cursor:pointer" onclick="closeModal();openPlayerDetail('${f.motm.id}','world')">⭐ ${esc(f.motm.name)} — note ${f.motm.rating}</div>` : ''}
  `);
}

  `;
}

/* ---------- Négociations ---------- */
function renderNegotiationsHub() {
  const offers = (G.incomingOffers || []).map(o => ({ ...o, player: G.players[o.playerId], club: G.clubs[o.clubId] })).filter(o => o.player && o.club);
  const mine = G.agent.portfolio.map(id => G.players[id]).filter(p => p && !p.retired);
  const expiring = mine.filter(p => p.contractUntil && p.contractUntil - seasonStartYear(G) <= 1);

const NEG_VAL_DISPLAY = {

function updateNeg(key, val) {
  if (['salary', 'years', 'commissionPct', 'signingBonus', 'sellOnPct', 'releaseClause'].indexOf(key) >= 0) val = Number(val);
  ui.negotiation[key] = val;
  if (key === 'targetClubId') {
    // l'indemnité entre clubs est recalculée automatiquement selon le club visé — l'agent ne la fixe pas lui-même
    const p = G.players[ui.negotiation.playerId];
    ui.negotiation.fee = val ? estimateTransferFee(p, G.clubs[val]) : 0;
    renderModal(negotiationModalHTML());
    return;
  }
  const disp = NEG_VAL_DISPLAY[key];
  if (disp) { const el = document.getElementById(disp[0]); if (el) el.textContent = disp[1](val); }
  const resultEl = document.getElementById('negResult');
  if (resultEl) resultEl.innerHTML = negResultHTML();
}
function announceAchievements(list) {
  (list || []).forEach((a, i) => setTimeout(() => toast(`🏅 Haut fait : ${a.label}`), i * 1100));
}
function submitNegotiation() {
  const neg = ui.negotiation;
  const p = G.players[neg.playerId];
  const offer = { playerId: neg.playerId, salary: neg.salary, years: neg.years, roleProm: neg.roleProm, commissionPct: neg.commissionPct, targetClubId: neg.targetClubId || null, fee: neg.fee, signingBonus: neg.signingBonus, sellOnPct: neg.sellOnPct, releaseClause: neg.releaseClause };
  const news = [];
  const gateCheck = evaluateNegotiationGate(G, p, offer);
  if (!gateCheck.ok) {
    registerRejectedOffer(G, p, offer);
    toast(gateCheck.reason);
    pushNews(G, news);
    saveGame();
    closeModal();
    renderPage();
    return;
  }
  const ev = evaluateOffer(G, p, offer);
  if (ev.accept) { applyAcceptedOffer(G, p, offer, news); toast('Accord trouvé !'); pushNews(G, news); saveGame(); closeModal(); renderPage(); announceAchievements(checkAchievements(G)); return; }
  if (ev.score >= 30) {
    const counter = generateCounterOffer(G, p, offer);
    if (counter) { ui.counterOffer = { original: offer, candidate: counter.offer, ev: counter.ev }; renderModal(counterOfferModalHTML()); return; }
  }
  registerRejectedOffer(G, p, offer);
  toast('Le joueur (ou le club) refuse cette proposition.');
  pushNews(G, news);
  saveGame();
  closeModal();
  renderPage();
}
function counterOfferModalHTML() {
  const { original, candidate, ev } = ui.counterOffer;
  const p = G.players[candidate.playerId];

  if (candidate.salary !== original.salary) diffs.push(`Salaire : ${fmtMoneyShort(original.salary)} → <b>${fmtMoneyShort(candidate.salary)}</b>`);
  if (candidate.years !== original.years) diffs.push(`Durée : ${original.years} an(s) → <b>${candidate.years} an(s)</b>`);
  if (candidate.roleProm !== original.roleProm) diffs.push(`Rôle : ${ROLE_LABELS[original.roleProm] || original.roleProm} → <b>${ROLE_LABELS[candidate.roleProm] || candidate.roleProm}</b>`);
  if (candidate.commissionPct !== original.commissionPct) diffs.push(`Votre commission : ${original.commissionPct}% → <b>${candidate.commissionPct}%</b>`);
  return `
    <div class="modal-head"><h3>Contre-proposition</h3><button class="modal-close" onclick="closeModal()">${icon('close',16)}</button></div>
    <p class="small">${esc(p.name)} (ou le club) refuse votre offre telle quelle, mais reviendrait volontiers sur ces conditions :</p>

    <button class="btn btn-danger btn-block" style="margin-top:8px" onclick="declineCounterOffer()">Refuser et abandonner</button>
  `;

function acceptCounterOffer() {

/* ---------- Actualités ---------- */
// Téléphone (V9.2, suite) : première brique du hub complet — regroupe par joueur l'historique déjà
// enregistré (tag 'message'), plutôt qu'un flux plat noyé dans les Actus. Les contacts clubs / dirigeants /
// recruteurs / agents rivaux et les réponses différées restent à construire par-dessus cette base.
function renderPhone() {
  const byPlayer = {};
  const order = [];
  const byRival = {};
  const rivalOrder = [];
  for (const n of (G.news || [])) {
    if (n.tag !== 'message') continue;
    if (n.playerId) {
      if (!byPlayer[n.playerId]) { byPlayer[n.playerId] = []; order.push(n.playerId); }
      byPlayer[n.playerId].push(n);
    } else if (n.rivalId) {
      if (!byRival[n.rivalId]) { byRival[n.rivalId] = []; rivalOrder.push(n.rivalId); }
      byRival[n.rivalId].push(n);
    }
  }
  const contacts = order.map(pid => ({ p: G.players[pid], msgs: byPlayer[pid] })).filter(c => c.p);
  const rivalContacts = rivalOrder.map(rid => ({ r: (G.rivalAgents || []).find(x => x.id === rid), msgs: byRival[rid] })).filter(c => c.r);
  return `<div class="page-title">${icon('chat',18)} Téléphone</div>
    ${contacts.length ? contacts.map(c => `
      <div class="card">
        <div class="row-between" style="cursor:pointer" onclick="openPlayerDetail('${c.p.id}','dashboard')">
          <div class="card-title" style="margin:0">${flagFor(c.p.nat)} ${esc(c.p.name)}</div>
          <span class="small">${c.msgs.length} message${c.msgs.length > 1 ? 's' : ''}</span>
        </div>
        ${c.msgs.map(newsItemHTML).join('')}
      </div>`).join('') : ''}
    ${rivalContacts.length ? `<div class="page-title" style="font-size:15px;margin-top:14px">Agents rivaux</div>${rivalContacts.map(c => `
      <div class="card">
        <div class="row-between"><div class="card-title" style="margin:0">${icon('swap',15)} ${esc(c.r.name)}</div><span class="small">${c.msgs.length} message${c.msgs.length > 1 ? 's' : ''}</span></div>
        ${c.msgs.map(newsItemHTML).join('')}
      </div>`).join('')}` : ''}
    ${(!contacts.length && !rivalContacts.length) ? `<div class="card"><p class="small">Aucune conversation pour l'instant. Elles apparaîtront ici au fil des événements avec vos joueurs et vos rivaux.</p></div>` : ''}
  `;
}
function renderNews() {
  const items = G.news || [];
  return `<div class="page-title">Actualités</div><div class="card">${items.length ? items.map(newsItemHTML).join('') : '<p class="small">Rien pour le moment.</p>'}</div>`;
}

/* ---------- Passage de mois ---------- */
// Résumé mensuel intelligent (V9.3, plan « passage au mois suivant ») : jusqu'ici, le résumé montrait les 12
// premières news dans leur ordre d'arrivée — souvent des lignes de forme routinières avant l'essentiel. Ici, on
// classe par importance réelle (monde > piste exclusive > mercato > blessure > message personnel > agence >
// reste) et on ne garde que 5 à 8 faits, avec un bonus pour tout ce qui touche un joueur représenté.
function rankMonthlyHighlights(state, news) {
  const TAG_WEIGHT = { mercato: 70, blessure: 60, message: 55, agence: 40, haut_fait: 65, perf: 20, media: 15 };
  const scored = news.map(n => {
    let score = TAG_WEIGHT[n.tag] ?? 10;
    if (n.breaking) score += 100;
    if (n.referral) score += 90;
    if (n.playerId && state.agent.portfolio.includes(n.playerId)) score += 25;
    return { n, score };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8).map(s => s.n);
}
// Instantané avant le passage de mois (V9.4, audit « le mois doit devenir le cœur du jeu ») : sans lui, le
// résumé ne pouvait que lister des news ; avec, il dit ce que le mois a réellement changé pour l'agence et
// pour chaque client (matchs, note, buts, niveau, valeur, club).
function snapshotForRecap(state) {
  const a = state.agent;
  const players = {};
  for (const id of a.portfolio) {
    const p = state.players[id]; if (!p) continue;
    const st = p.seasonStats || {};
    players[id] = { name: p.name, ovr: p.ovr, value: p.value, club: p.club, apps: st.apps || 0, goals: st.goals || 0, assists: st.assists || 0, ratingSum: st.ratingSum || 0, injured: !!(p.injuredUntil && p.injuredUntil > state.date.absMonth) };
  }
  return { cash: a.cash, rep: a.reputation, commissions: (a.careerStats && a.careerStats.totalCommissions) || 0, players, label: `${MONTH_NAMES[calMonth(state)]} ${calYear(state)}` };
}
function doAdvanceMonth() {
  if (G.pendingEvent) { showEventModal(); return; }
  const before = snapshotForRecap(G);
  const { news, seasonSummary } = advanceMonth(G);
  saveGame();
  showRecap(news, seasonSummary, before);
}
function closeRecapAndContinue() {
  closeModal();
  renderPage();
  if (G.pendingEvent) showEventModal();
}
// Après le résumé du mois : enchaîne sur le bilan de saison s'il y en a un en attente, sinon reprend la main
// directement — un seul et même bouton "Continuer" pour les deux cas, pas de branche à retenir pour l'utilisateur.
function continueFromRecap() {
  if (ui.pendingSeasonReport && ui.pendingSeasonReport.portfolioReport && ui.pendingSeasonReport.portfolioReport.length) {
    showSeasonReport();
  } else {
    ui.pendingSeasonReport = null;
    closeRecapAndContinue();
  }
}
function recapDelta(v, fmt) {
  if (!v) return `<span class="small" style="color:var(--ink-faint)">=</span>`;
  const col = v > 0 ? 'var(--emerald)' : 'var(--red)';
  return `<span class="small" style="color:${col};font-weight:700">${v > 0 ? '+' : ''}${fmt(v)}</span>`;
}
function recapPlayersHTML(before, seasonSummary) {
  const rows = [];
  const ids = new Set([...Object.keys(before.players), ...G.agent.portfolio]);
  for (const id of ids) {
    const b = before.players[id], p = G.players[id];
    if (!b && p) { rows.push(`<div class="recap-player"><b>${esc(p.name)}</b> <span class="small">rejoint votre agence</span></div>`); continue; }
    if (b && (!p || !G.agent.portfolio.includes(id))) { rows.push(`<div class="recap-player"><b>${esc(b.name)}</b> <span class="small" style="color:var(--red)">ne fait plus partie de votre agence</span></div>`); continue; }
    const st = p.seasonStats || {};
    // à la bascule de saison les stats repartent de zéro : le bilan de saison prend le relais pour les chiffres
    const newSeason = !!seasonSummary || (st.apps || 0) < b.apps;
    const apps = newSeason ? 0 : (st.apps || 0) - b.apps;
    const goals = newSeason ? 0 : (st.goals || 0) - b.goals;
    const assists = newSeason ? 0 : (st.assists || 0) - b.assists;
    const rating = apps ? ((st.ratingSum || 0) - b.ratingSum) / apps : null;
    const bits = [];
    if (apps) bits.push(`${apps} match${apps > 1 ? 's' : ''}`);
    if (rating) bits.push(`note ${rating.toFixed(1)}`);
    if (goals) bits.push(`${goals} but${goals > 1 ? 's' : ''}`);
    if (assists) bits.push(`${assists} passe${assists > 1 ? 's' : ''} déc.`);
    const injuredNow = !!(p.injuredUntil && p.injuredUntil > G.date.absMonth);
    if (injuredNow && !b.injured) bits.push(`<span style="color:var(--red)">blessé</span>`);
    if (p.club !== b.club) bits.push(`<span style="color:var(--gold-soft)">nouveau club : ${esc(p.club && G.clubs[p.club] ? G.clubs[p.club].name : 'libre')}</span>`);
    const ratingCol = rating == null ? '' : rating >= 7.2 ? 'var(--emerald)' : rating < 5.8 ? 'var(--red)' : '';
    rows.push(`<div class="recap-player" style="cursor:pointer" onclick="closeModal();openPlayerDetail('${id}','dashboard')">
      <div class="row-between"><b>${esc(p.name)}</b><span>${recapDelta(p.ovr - b.ovr, v => v + ' OVR')} ${recapDelta(p.value - b.value, fmtMoneyShort)}</span></div>
      <div class="small" ${ratingCol ? `style="color:${ratingCol}"` : ''}>${bits.length ? bits.join(' · ') : (newSeason ? 'Nouvelle saison' : 'N\u2019a pas joué ce mois-ci')}</div>
    </div>`);
  }
  return rows.length ? rows.join('') : '<p class="small">Aucun joueur sous contrat avec l\u2019agence.</p>';
}
function showRecap(news, seasonSummary, before) {
  const a = G.agent;
  const highlights = rankMonthlyHighlights(G, news);
  if (seasonSummary) highlights.push({ tag: 'carriere', text: `${seasonSummary.retiredCount} joueurs prennent leur retraite, ${seasonSummary.newYouth} jeunes entrent dans le monde professionnel.` });
  const hlHTML = it => `<div class="recap-item"><div class="news-ico">${icon(NEWS_ICO[it.tag] || 'star', 16)}</div><div class="news-text">${esc(it.text)}</div></div>`;
  const shown = highlights.slice(0, 3), rest = highlights.slice(3);
  const agencyHTML = before ? `<div class="grid-3" style="margin-bottom:12px">
      <div class="kpi"><b class="num">${fmtMoneyShort(a.cash)}</b><span>Trésorerie ${recapDelta(Math.round(a.cash - before.cash), fmtMoneyShort)}</span></div>
      <div class="kpi"><b class="num">${Math.round(a.reputation)}</b><span>Réputation ${recapDelta(Math.round((a.reputation - before.rep) * 10) / 10, v => v)}</span></div>
      <div class="kpi"><b class="num">${fmtMoneyShort(((a.careerStats && a.careerStats.totalCommissions) || 0) - before.commissions)}</b><span>Commissions</span></div>
    </div>` : '';
  ui.pendingSeasonReport = seasonSummary || null;
  renderModal(`
    <div class="modal-head"><div><div class="small" style="text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--accent)">Bilan du mois</div><h3>${before ? esc(before.label) : `${MONTH_NAMES[calMonth(G)]} ${calYear(G)}`}</h3></div><button class="modal-close" onclick="continueFromRecap()">${icon('close',16)}</button></div>
    ${agencyHTML}
    ${before ? `<div class="card-title" style="margin-top:4px">Vos joueurs</div><div style="margin-bottom:10px">${recapPlayersHTML(before, seasonSummary)}</div>` : ''}
    <div class="card-title">À retenir</div>
    ${shown.length ? shown.map(hlHTML).join('') : '<p class="small">Un mois calme dans le monde du football.</p>'}
    ${rest.length ? `<details class="recap-more"><summary class="small">Voir ${rest.length} autre${rest.length > 1 ? 's' : ''} fait${rest.length > 1 ? 's' : ''}</summary>${rest.map(hlHTML).join('')}</details>` : ''}
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="continueFromRecap()">Continuer</button>
  `);
}

// ---------- Bilan de fin de saison (V9.0, immersion) : ce que sont devenus les joueurs de l'agence cette
// saison — plutôt que de le laisser noyé dans le même résumé générique que n'importe quel mois calme.
function seasonReportHTML(summary) {
  const report = summary.portfolioReport || [];
  const played = report.filter(r => r.entry && r.entry.apps > 0);
  const standout = played.slice().sort((a, b) => b.entry.avgRating - a.entry.avgRating)[0] || null;
  const rows = report.map(r => {
    const club = r.club ? G.clubs[r.club] : null;
    const isGK = r.posLine === 'GK';
    const e = r.entry;
    const statLine = !e ? 'Aucun match cette saison'
      : (isGK ? `${e.apps} matchs · ${e.cs || 0} clean sheets · note ${e.avgRating}`
              : `${e.apps} matchs · ${e.goals || 0} B · ${e.assists || 0} PD · note ${e.avgRating}`);
    const delta = r.ovrAfter - r.ovrBefore;
    const deltaHTML = delta === 0 ? `<span style="color:var(--ink-faint)">${r.ovrAfter}</span>`
      : delta > 0 ? `<span style="color:var(--emerald-soft)">▲${r.ovrAfter} (+${delta})</span>`
      : `<span style="color:var(--red-soft)">▼${r.ovrAfter} (${delta})</span>`;
    const titleNote = (e && e.titles && e.titles.length) ? `<div class="small" style="color:var(--gold-soft);margin-top:2px">${icon('trophy',12)} ${e.titles.map(esc).join(', ')}</div>` : '';
    const retiredNote = r.retired ? `<div class="small" style="color:var(--ink-faint);margin-top:2px">Prend sa retraite à l'issue de cette saison.</div>` : '';
    return `<div class="list-row" onclick="closeModal();openPlayerDetail('${r.playerId}','dashboard')">
      ${portraitHTML(r.playerId, 34)}
      <div><div class="name">${esc(r.name)}${standout && r.playerId === standout.playerId ? ' ' + icon('star', 13) : ''}</div>
      <div class="sub">${club ? esc(club.short) : 'Libre'} · ${statLine}</div>${titleNote}${retiredNote}</div>
      <div class="right num">${deltaHTML}</div>
    </div>`;
  }).join('') || '<p class="small">Vous ne représentiez personne cette saison.</p>';
  return `
    <div class="modal-head"><h3>Bilan de la saison — ${esc(summary.label)}</h3><button class="modal-close" onclick="closeRecapAndContinue()">${icon('close',16)}</button></div>
    <div class="grid-2" style="margin-bottom:10px">
      <div class="kpi"><b class="num">${summary.seasonTransfers || 0}</b><span>Transferts conclus</span></div>
      <div class="kpi"><b class="num">${fmtMoneyShort(summary.seasonCommissions || 0)}</b><span>Commissions cette saison</span></div>
    </div>
    ${standout ? `<p class="small" style="color:var(--gold-soft);font-weight:700">${icon('star',14)} Joueur de la saison chez vous : ${esc(standout.name)} — note moyenne ${standout.entry.avgRating}</p>` : ''}
    <div class="sep"></div>
    ${rows}
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="closeRecapAndContinue()">Continuer</button>
  `;
}
function showSeasonReport() {
  const summary = ui.pendingSeasonReport;
  ui.pendingSeasonReport = null;
  renderModal(seasonReportHTML(summary));
}

/* ---------- Sauvegarde / export / import / reset ---------- */
function openSettingsModal() {
  renderModal(`
    <div class="modal-head"><h3>Sauvegarde</h3><button class="modal-close" onclick="closeModal()">${icon('close',16)}</button></div>
    <p class="small">Votre partie est sauvegardée automatiquement à chaque mois dans ce navigateur.</p>
    <button class="btn btn-block" style="margin-bottom:8px" onclick="handleExport()">⬇️ Exporter la sauvegarde (.json)</button>
    <label class="btn btn-block" style="margin-bottom:8px; display:flex;">⬆️ Importer une sauvegarde
      <input type="file" accept="application/json" style="display:none" onchange="handleImport(event)">
    </label>
    <button class="btn btn-danger btn-block" onclick="confirmReset()">Nouvelle partie (efface tout)</button>
  `);
}
function handleExport() {
  const blob = new Blob([serializeState(G)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `football-agent-${seasonLabel(G)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImport(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = deserializeState(reader.result);
      if (!parsed.clubs || !parsed.players || !parsed.agent) throw new Error('format invalide');
      migrateOldSave(parsed);
      G = parsed;
      closeModal(); renderApp();
      // le succès n'est annoncé que si la partie a vraiment pu être enregistrée dans ce navigateur
      saveGame().then(ok => toast(ok ? 'Sauvegarde importée.' : 'Partie importée, mais impossible de l\u2019enregistrer dans ce navigateur : gardez votre fichier.'));
    } catch (e) { toast('Fichier de sauvegarde invalide.'); }
  };
  reader.readAsText(file);
}
// Rompre un contrat d'agent (demande explicite) : même schéma de confirmation que "Nouvelle partie", pour une
// décision qui mérite elle aussi un aller-retour avant d'être définitive.
function confirmDropClient(playerId) {
  const p = G.players[playerId];
  if (!p) return;
  renderModal(`
    <div class="modal-head"><h3>Mettre fin au contrat ?</h3><button class="modal-close" onclick="closeModal()">${icon('close',16)}</button></div>
    <p>${esc(p.name)} quittera votre portefeuille et pourra être représenté par un autre agent (ou de nouveau par vous, plus tard).</p>
    <button class="btn btn-danger btn-block" onclick="doDropClient('${playerId}')">Oui, mettre fin au contrat</button>
    <button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">Annuler</button>
  `);
}
function doDropClient(playerId) {
  const r = resolveDropClient(G, playerId);
  closeModal();
  if (r.ok) { toast('Contrat rompu.'); saveGame(); renderPage(); }
}
function confirmReset() {
  renderModal(`
    <div class="modal-head"><h3>Tout effacer ?</h3><button class="modal-close" onclick="closeModal()">${icon('close',16)}</button></div>
    <p>Cette action supprime définitivement votre partie en cours. Pensez à exporter votre sauvegarde avant si besoin.</p>
    <button class="btn btn-danger btn-block" onclick="doReset()">Oui, recommencer à zéro</button>
    <button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">Annuler</button>
  `);
}
function doReset() { deleteLocalStorageSave(); setSaveWarning(false); G = null; closeModal(); renderOnboarding(); }

document.addEventListener('DOMContentLoaded', boot);
</script>
