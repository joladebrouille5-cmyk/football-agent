<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Football Agent — Jeu de gestion d'agent de football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FOOTBALL AGENT — direction artistique « Nuit de match » (V8.3)
   Un stade sous les projecteurs : fond vert-nuit presque noir strié comme
   une pelouse tondue, halos de projecteurs, lignes de craie. Une seule
   couleur signature, le « volt » (jaune électrique des maillots et
   chasubles), réservée à l'action et au joueur-agent. Émeraude = positif,
   rouge = alerte, bleu = information, or = prestige (titres, records,
   paliers). Titres en capitales condensées façon panneau de stade,
   chiffres tabulaires façon tableau d'affichage.
   ============================================================ */

:root{
  --bg:#05080a; --bg-1:#0b1114; --bg-2:#10181c; --bg-3:#172227; --bg-4:#1e2b31;
  --line:#1d2a30; --line-soft:#131d21; --line-strong:#2a3a41;
  --ink:#f1f5f2; --ink-dim:#9aaba7; --ink-faint:#5f716d;
  --accent:#d7ff3c; --accent-soft:#ecff9e; --accent-dim:#5b6d10; --accent-ink:#0b1300;
  --gold:#e4b43f; --gold-soft:#f6d982; --gold-dim:#7d611c;
  --emerald:#1fbf7a; --emerald-soft:#7ce7b3;
  --red:#ef4b47; --red-soft:#ff8e86;
  --blue:#3f7cff; --blue-soft:#9dbdff; --blue-dim:#1b3268;
  --violet:#9a86f7; --violet-soft:#c5b9fb;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
  --sh-1:0 2px 10px rgba(0,0,0,.45);
  --sh-2:0 18px 50px rgba(0,0,0,.6);
  --glow:0 0 0 1px rgba(215,255,60,.35), 0 8px 28px rgba(215,255,60,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Roboto Mono",Consolas,monospace;
  --font-display:'Oswald',"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --topbar-h:60px; --fab-h:58px; --bottombar-h:66px; --sidenav-w:252px;
}
*{box-sizing:border-box;}
svg{vertical-align:middle; flex-shrink:0;}
html,body{height:100%;}
body{
  margin:0; color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 8% -8%, rgba(215,255,60,.07) 0%, transparent 60%),
    radial-gradient(900px 600px at 105% -5%, rgba(120,190,255,.07) 0%, transparent 60%),
    radial-gradient(1400px 900px at 50% 120%, rgba(31,191,122,.06) 0%, transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 90px, transparent 90px 180px),
    var(--bg);
  background-attachment:fixed;
}
#app{min-height:100%;}
h1,h2,h3,h4{margin:0 0 4px; font-family:var(--font-display); font-weight:600; letter-spacing:.01em; text-transform:uppercase;}
p{margin:0 0 8px; color:var(--ink-dim); line-height:1.55;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent); color:var(--accent-ink);}
.num{font-family:var(--font-display); font-weight:600; letter-spacing:.3px; font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#223137;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- Écran de création : entrée dans le stade ---------- */
.onboard{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; position:relative; overflow:hidden;
  background:
    radial-gradient(700px 420px at 20% 0%, rgba(255,255,230,.10) 0%, transparent 65%),
    radial-gradient(700px 420px at 80% 0%, rgba(255,255,230,.08) 0%, transparent 65%),
    repeating-linear-gradient(180deg, rgba(31,191,122,.045) 0 70px, rgba(31,191,122,.015) 70px 140px),
    linear-gradient(180deg, #050a09, #06110d 60%, #040806);
}
.onboard::before{ /* lignes de craie du terrain */
  content:''; position:absolute; left:50%; top:50%; width:760px; height:760px; transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.05); border-radius:50%; pointer-events:none;
  box-shadow:0 0 0 180px transparent, inset 0 0 0 1px rgba(255,255,255,.02);
}
.onboard::after{
  content:''; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(255,255,255,.05); pointer-events:none;
}
.onboard-card{
  width:100%; max-width:480px; position:relative; z-index:1; overflow:hidden;
  background:linear-gradient(170deg, rgba(23,34,39,.92), rgba(9,14,16,.96) 70%);
  border:1px solid var(--line-strong); border-radius:24px; padding:30px 24px 26px;
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(8px);
}
.onboard-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--accent), var(--emerald) 60%, transparent);
}
.onboard-crest{
  width:58px; height:66px; margin-bottom:16px;
  background:linear-gradient(160deg, var(--accent) 0 50%, #a8d11c 50% 100%);
  clip-path:polygon(50% 0%,100% 15%,100% 66%,50% 100%,0% 66%,0% 15%);
  display:flex; align-items:center; justify-content:center; font-size:26px; filter:drop-shadow(0 8px 18px rgba(215,255,60,.25));
}
.onboard-kicker{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.32em; font-size:12px; color:var(--accent); font-weight:600; margin-bottom:4px;
}
.onboard-title{font-family:var(--font-display); text-transform:uppercase; font-weight:700; font-size:38px; line-height:1; margin-bottom:8px; letter-spacing:.005em;}
.onboard-sub{font-size:13.5px; margin-bottom:22px; color:var(--ink-dim);}
.field{margin-bottom:16px;}
.field label{display:block; font-family:var(--font-display); font-size:12px; color:var(--ink-dim); margin-bottom:7px; text-transform:uppercase; letter-spacing:.14em;}
.field input[type=text], .field select{
  width:100%; padding:13px 14px; background:rgba(5,8,10,.6); border:1px solid var(--line-strong); color:var(--ink);
  border-radius:var(--r-sm); font-size:15px; transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(215,255,60,.15);}
.spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.spec-card{
  border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:11px 12px; cursor:pointer; background:rgba(5,8,10,.5);
  transition:border-color .15s, background .15s, transform .1s; position:relative;
}
.spec-card:hover{border-color:var(--accent-dim);}
.spec-card.sel{border-color:var(--accent); background:linear-gradient(160deg, rgba(215,255,60,.12), rgba(215,255,60,.02)); box-shadow:inset 0 0 0 1px rgba(215,255,60,.25);}
.spec-card.sel::after{content:''; position:absolute; top:10px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
.spec-card b{font-family:var(--font-display); font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:14px; display:block; margin-bottom:3px;}
.spec-card span{font-size:11.5px; color:var(--ink-faint);}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:42px;
  padding:10px 16px; border-radius:var(--r-sm); border:1px solid var(--line-strong);
  background:linear-gradient(180deg, var(--bg-4), var(--bg-3)); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
  transition:transform .1s, border-color .15s, background .15s, box-shadow .15s;
}
.btn:hover{border-color:#3a4c54;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary{
  background:linear-gradient(180deg, var(--accent-soft) -40%, var(--accent) 60%); color:var(--accent-ink); border-color:var(--accent);
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em; font-weight:600; font-size:15px;
  box-shadow:0 6px 20px rgba(215,255,60,.14);
}
.btn-primary:hover{box-shadow:var(--glow); border-color:var(--accent);}
.btn-emerald{background:linear-gradient(180deg,var(--emerald-soft) -30%,var(--emerald)); color:#03170d; border-color:var(--emerald);}
.btn-danger{background:rgba(239,75,71,.06); border-color:rgba(239,75,71,.6); color:var(--red-soft);}
.btn-danger:hover{background:rgba(239,75,71,.12); border-color:var(--red);}
.btn-ghost{background:transparent;}
.btn-block{width:100%;}
.btn-sm{min-height:34px; padding:6px 12px; font-size:12.5px;}
.btn-primary.btn-sm{font-size:13px;}

/* ---------- Structure : barre du haut, navigation, bouton de mois ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:30;
  background:linear-gradient(180deg, rgba(5,8,10,.96), rgba(5,8,10,.82)); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 14px; gap:12px;
}
.topbar::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg, transparent, rgba(215,255,60,.35), transparent);}
.topbar-brand{display:none;}
.topbar-date{font-family:var(--font-display); text-transform:uppercase; font-weight:600; font-size:17px; letter-spacing:.04em; white-space:nowrap; line-height:1.05;}
.topbar-date .num{font-size:17px; color:var(--accent);}
.topbar-date .season{display:block; font-family:var(--font); text-transform:none; font-size:10.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em;}
.topbar-stats{margin-left:auto; display:flex; gap:6px;}
.chip{
  display:flex; align-items:center; gap:6px; background:rgba(23,34,39,.8); border:1px solid var(--line-strong);
  border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; white-space:nowrap;
}
.chip .ico{display:inline-flex; align-items:center;}
.chip.cash{color:var(--ink);} .chip.cash .ico{color:var(--accent);}
.chip.cash.neg{color:var(--red-soft); border-color:#5a2522; background:rgba(239,75,71,.08);}
.chip.rep{color:var(--gold-soft);} .chip.rep .ico{color:var(--gold);}

.sidenav{
  position:fixed; top:0; left:0; bottom:0; width:var(--sidenav-w); z-index:40; transform:translateX(-100%); transition:transform .22s ease;
  padding:18px 12px; overflow-y:auto;
  background:linear-gradient(180deg, #0a1013, #070b0d); border-right:1px solid var(--line);
}
.sidenav-brand{display:flex; align-items:center; gap:11px; padding:6px 8px 18px; border-bottom:1px solid var(--line-soft); margin-bottom:12px;}
.sidenav-brand .crest{
  width:38px; height:43px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--accent-ink);
  background:linear-gradient(160deg, var(--accent) 0 50%, #a8d11c 50% 100%);
  clip-path:polygon(50% 0%,100% 15%,100% 66%,50% 100%,0% 66%,0% 15%);
}
.sidenav-brand b{display:block; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.04em; font-weight:600; font-size:16px; line-height:1.1;}
.sidenav-brand span{font-size:11px; color:var(--ink-faint);}
.nav-item{
  position:relative; display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:var(--r-sm); cursor:pointer;
  color:var(--ink-dim); font-size:14px; font-weight:600; margin-bottom:2px; transition:background .15s, color .15s;
}
.nav-item .ico{width:20px; display:inline-flex; align-items:center; justify-content:center;}
.nav-item:hover{background:var(--bg-2); color:var(--ink);}
.nav-item.active{background:linear-gradient(90deg, rgba(215,255,60,.13), rgba(215,255,60,0) 85%); color:var(--accent);}
.nav-item.active::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); box-shadow:0 0 12px var(--accent);}

.content{padding:calc(var(--topbar-h) + 16px) 14px calc(var(--fab-h) + var(--bottombar-h) + 36px); max-width:820px; margin:0 auto;}
.page-title{
  font-family:var(--font-display); text-transform:uppercase; font-weight:600; font-size:26px; letter-spacing:.02em; line-height:1.05;
  margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.page-title small{font-family:var(--font); text-transform:none; font-size:12px; color:var(--ink-faint); font-weight:600; letter-spacing:0;}

.fab-advance{
  position:fixed; left:14px; right:14px; bottom:calc(var(--bottombar-h) + 12px); z-index:25; height:var(--fab-h);
  border-radius:var(--r-md); border:1px solid var(--accent); cursor:pointer; overflow:hidden;
  background:linear-gradient(180deg, var(--accent-soft) -50%, var(--accent) 55%, #b9e21f); color:var(--accent-ink);
  font-family:var(--font-display); text-transform:uppercase; font-weight:600; font-size:17px; letter-spacing:.08em;
  box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 30px rgba(215,255,60,.18);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.fab-advance::after{ /* reflet qui balaie le bouton : l'action centrale du jeu */
  content:''; position:absolute; top:0; bottom:0; left:-40%; width:30%; transform:skewX(-20deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation:fabSheen 4.5s ease-in-out infinite;
}
@keyframes fabSheen{0%,70%{left:-40%;} 100%{left:130%;}}
.fab-advance:hover{box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 44px rgba(215,255,60,.32);}
.fab-advance:active{transform:scale(.985);}
.fab-advance:disabled{opacity:1; background:var(--bg-3); color:var(--gold-soft); border-color:var(--gold-dim); box-shadow:var(--sh-1); font-size:14px;}
.fab-advance:disabled::after{display:none;}

.bottombar{
  position:fixed; left:0; right:0; bottom:0; height:var(--bottombar-h); z-index:30; display:flex;
  background:linear-gradient(180deg, rgba(8,12,14,.9), rgba(5,8,10,.98)); backdrop-filter:blur(14px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-item{
  position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:none; border:none; color:var(--ink-faint); font-family:inherit; cursor:pointer; padding:6px 2px; transition:color .15s;
}
.tab-item .ico{display:inline-flex; align-items:center; justify-content:center;}
.tab-item .lbl{font-size:10px; font-weight:700; letter-spacing:.02em;}
.tab-item.active{color:var(--accent);}
.tab-item.active::before{content:''; position:absolute; top:0; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background:var(--accent); box-shadow:0 0 12px var(--accent);}

@media (min-width:900px){
  .sidenav{transform:translateX(0);}
  .topbar{left:var(--sidenav-w); padding:0 26px;}
  .topbar-brand{display:block; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em; font-weight:500; font-size:13px; color:var(--ink-faint); padding-right:14px; margin-right:2px; border-right:1px solid var(--line);}
  .content{margin-left:var(--sidenav-w); max-width:960px; padding-left:30px; padding-right:30px; padding-bottom:calc(var(--fab-h) + 44px);}
  .fab-advance{left:calc(var(--sidenav-w) + 30px); right:auto; width:min(900px, calc(100vw - var(--sidenav-w) - 60px)); bottom:18px;}
  .bottombar{display:none;}
  .page-title{font-size:30px;}
}

/* ---------- Cartes, grilles, KPI ---------- */
.card{
  position:relative; margin-bottom:12px; padding:16px;
  background:linear-gradient(180deg, rgba(20,30,34,.92), rgba(11,17,20,.95));
  border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035), var(--sh-1);
}
.card-title{
  display:flex; align-items:center; gap:7px; margin-bottom:12px;
  font-family:var(--font-display); font-size:13px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-dim); font-weight:500;
}
.card-title::before{content:''; width:10px; height:2px; background:var(--accent); border-radius:2px; flex-shrink:0;}
.card-title svg{color:var(--accent);}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.grid-2, .grid-3{margin-bottom:12px;}
.card .grid-2, .card .grid-3{margin-bottom:0;}
.kpi{
  position:relative; overflow:hidden; background:linear-gradient(160deg, var(--bg-3), var(--bg-2)); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:11px 12px; transition:border-color .15s;
}
.kpi::after{content:''; position:absolute; right:-18px; top:-18px; width:52px; height:52px; border-radius:50%; background:radial-gradient(circle, rgba(215,255,60,.08), transparent 70%);}
.kpi b{display:block; font-size:20px; line-height:1.15; font-family:var(--font-display); font-weight:600; overflow-wrap:anywhere;}
.kpi span{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; font-weight:600;}

/* blason de club en CSS pur (aucune image / logo réel) — écu à reflet */
.badge{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  width:30px; height:34px; color:#fff; font-weight:800; font-size:9.5px; letter-spacing:.01em; font-family:var(--font-display);
  background:linear-gradient(155deg,var(--c1) 0%,var(--c1) 52%,var(--c2) 52%,var(--c2) 100%);
  clip-path:polygon(50% 0%,100% 15%,100% 68%,50% 100%,0% 68%,0% 15%);
  text-shadow:0 1px 3px rgba(0,0,0,.7); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.25);
}
.badge.lg{width:60px; height:68px; font-size:17px;}
.badge.sm{width:22px; height:25px; font-size:7px;}

.list-row{
  display:flex; align-items:center; gap:11px; padding:11px 8px; border-radius:var(--r-sm); cursor:pointer;
  border-bottom:1px solid var(--line-soft); transition:background .12s;
}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:rgba(30,43,49,.55);}
.list-row:active{background:var(--bg-3);}
.list-row .name{font-weight:700; font-size:14px;}
.list-row .sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.list-row .right{margin-left:auto; text-align:right;}
.list-row .ovr{
  font-family:var(--font-display); font-weight:600; font-size:15px; width:34px; height:34px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; background:var(--bg-3); border:1px solid var(--line-strong); margin-left:auto;
}
.list-row .right .ovr{margin:0 0 3px auto;}
.list-row .ovr.bronze{background:linear-gradient(160deg,#3b2a1c,#20170f); border-color:#6b4a2c; color:#e9b98a;}
.list-row .ovr.silver{background:linear-gradient(160deg,#343d44,#1c2227); border-color:#5b6770; color:#e4ebef;}
.list-row .ovr.gold{background:linear-gradient(160deg,#4a3a10,#241b06); border-color:var(--gold); color:var(--gold-soft); box-shadow:0 0 12px rgba(228,180,63,.18);}

/* ---------- Cartes joueur : vraies cartes à collectionner (bronze / argent / or) ---------- */
.player-card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(138px,1fr)); gap:12px;}
.player-card{
  --m1:#3a4750; --m2:#1a2227; --mt:#e4ebef; --mline:rgba(255,255,255,.12);
  position:relative; overflow:hidden; border-radius:16px 16px 22px 22px; padding:11px 10px 12px; text-align:center; cursor:pointer;
  background:
    radial-gradient(120px 90px at 50% 36%, rgba(255,255,255,.10), transparent 70%),
    linear-gradient(165deg, var(--m1), var(--m2) 70%);
  border:1px solid var(--mline); color:var(--mt);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 10px 24px rgba(0,0,0,.45);
  transition:transform .15s, box-shadow .15s;
}
.player-card::before{ /* reflet métallique */
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.14) 42%, transparent 54%);
}
.player-card:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 16px 30px rgba(0,0,0,.55);}
.player-card:active{transform:scale(.97);}
.player-card.bronze{--m1:#6a4a2e; --m2:#23180f; --mt:#f6dcc0; --mline:rgba(233,185,138,.35);}
.player-card.silver{--m1:#56636d; --m2:#1b2328; --mt:#f1f5f7; --mline:rgba(220,230,236,.3);}
.player-card.gold{--m1:#8c6b17; --m2:#2a1f05; --mt:#fff1c9; --mline:rgba(246,217,130,.5); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 10px 26px rgba(0,0,0,.5), 0 0 22px rgba(228,180,63,.14);}
.player-card-top{position:relative; display:flex; justify-content:space-between; align-items:flex-start;}
.player-card-ovr{font-family:var(--font-display); font-weight:700; font-size:28px; line-height:.95; color:var(--mt);}
.player-card-pos{font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.06em; opacity:.85; margin-top:1px;}
.player-card-flag{font-size:16px;}
.player-card-portrait{
  width:44px; height:44px; margin:2px auto; border-radius:12px; display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.1); position:relative;
}
.player-card .player-card-portrait{width:58px !important; height:58px !important; margin:-4px auto 2px; border-radius:50% !important; background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.18), rgba(0,0,0,.25)) !important; border-color:var(--mline);}
.player-card .player-card-silhouette{color:var(--mt); opacity:.55;}
.player-card-portrait.pt-0{background:linear-gradient(155deg,#1e3a44,#0f1d22);}
.player-card-portrait.pt-1{background:linear-gradient(155deg,#2a3339,#161c20);}
.player-card-portrait.pt-2{background:linear-gradient(155deg,#1d3d2f,#0f2019);}
.player-card-portrait.pt-3{background:linear-gradient(155deg,#2f2a46,#181528);}
.player-card-portrait.pt-4{background:linear-gradient(155deg,#3a2b1f,#1d1510);}
.player-card-portrait.pt-5{background:linear-gradient(155deg,#233546,#121b26);}
.player-card-silhouette{display:block; color:var(--ink-faint); opacity:.75;}
.player-card-name{position:relative; font-family:var(--font-display); text-transform:uppercase; font-weight:600; letter-spacing:.03em; font-size:14px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.player-card-club{position:relative; display:flex; align-items:center; justify-content:center; gap:5px; margin-top:4px; font-size:10.5px; opacity:.8; white-space:nowrap; overflow:hidden;}
.player-card-stats{position:relative; display:flex; justify-content:space-around; margin-top:9px; padding-top:8px; border-top:1px solid var(--mline);}
.player-card-stats div{display:flex; flex-direction:column; align-items:center; gap:2px;}
.player-card-stats b{font-family:var(--font-display); font-size:16px; font-weight:600; line-height:1;}
.player-card-stats span{font-size:9px; opacity:.7; text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
.player-card-rating{position:relative; margin-top:7px; font-size:10.5px; opacity:.8; text-align:center;}
.player-card-rating b{font-family:var(--font-display); font-size:13px;}
.player-card-rating.small-muted{opacity:.5; font-style:italic;}
.pos-tag{font-family:var(--font-display); font-size:10.5px; font-weight:600; letter-spacing:.04em; padding:2px 6px; border-radius:5px; background:var(--bg-4); color:var(--ink-dim);}
.pos-tag.FW{color:#ff9f8f; background:rgba(239,75,71,.12);}
.pos-tag.MF{color:var(--emerald-soft); background:rgba(31,191,122,.12);}
.pos-tag.DF{color:var(--blue-soft); background:rgba(63,124,255,.14);}
.pos-tag.GK{color:var(--violet-soft); background:rgba(154,134,247,.14);}

/* ---------- En-tête de fiche joueur : bannière sous les projecteurs ---------- */
.pd-hero{
  overflow:hidden;
  background:
    radial-gradient(420px 220px at 85% -10%, color-mix(in srgb, var(--club-c1, #1fbf7a) 45%, transparent), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 40px, transparent 40px 80px),
    linear-gradient(180deg, rgba(20,30,34,.95), rgba(9,14,16,.98));
}
.pd-header-top{display:flex; align-items:center; gap:14px;}
.pd-header-id{flex:1; min-width:0;}
.pd-header-id h2{font-size:22px; line-height:1.05; margin-bottom:6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word;}
@media (min-width:640px){ .pd-header-id h2{font-size:28px;} }
.pd-status{display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.3); border:1px solid var(--line-strong);}
.ovr-ring{
  --v:70; --c:var(--accent);
  width:74px; height:74px; border-radius:50%; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(closest-side, var(--bg-1) 78%, transparent 80% 100%), conic-gradient(var(--c) calc(var(--v) * 1%), rgba(255,255,255,.07) 0);
}
.ovr-ring b{font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1;}
.ovr-ring span{font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:700;}

/* ---------- Bannière carrière du tableau de bord ---------- */
.career-hero{
  overflow:hidden; padding:18px;
  background:
    radial-gradient(360px 200px at 100% 0%, rgba(215,255,60,.12), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 46px, transparent 46px 92px),
    linear-gradient(180deg, rgba(20,30,34,.95), rgba(9,14,16,.98));
}
.career-hero.prestige{border-color:var(--gold-dim); background:
    radial-gradient(360px 200px at 100% 0%, rgba(228,180,63,.18), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 46px, transparent 46px 92px),
    linear-gradient(180deg, rgba(34,28,14,.95), rgba(12,11,8,.98));}
.career-hero .tier{font-family:var(--font-display); text-transform:uppercase; font-weight:700; font-size:30px; line-height:1; letter-spacing:.01em;}
.career-hero.prestige .tier{color:var(--gold-soft);}
.career-hero .spec{font-size:12px; color:var(--ink-faint); margin-top:4px; text-transform:uppercase; letter-spacing:.1em; font-weight:600;}
.career-hero-row{display:flex; align-items:center; gap:16px;}
.career-hero-row > div:first-child{flex:1; min-width:0;}

/* ---------- Barres de progression ---------- */
.meter{height:6px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden; margin-top:5px;}
.meter > i{display:block; height:100%; border-radius:6px; box-shadow:0 0 10px currentColor; animation:meterFill .8s cubic-bezier(.3,0,.2,1);}
@keyframes meterFill{from{width:0;}}
.meter-row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-top:10px; font-weight:500;}

/* ---------- Micro-interactions ---------- */
.page-fade{animation:pageFadeIn .3s ease-out;}
@keyframes pageFadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.btn, .region-card, .list-row, .tab-btn{transition:background .15s, border-color .15s, transform .1s, color .15s;}
.save-warning{position:fixed; top:calc(var(--topbar-h) + 8px); left:12px; right:12px; z-index:80; background:#2d1210; border:1px solid var(--red); color:var(--red-soft); border-radius:var(--r-md); padding:10px 12px; font-size:13px; font-weight:600; display:flex; gap:10px; align-items:center; justify-content:space-between; box-shadow:var(--sh-2);}
@media (min-width:900px){ .save-warning{left:calc(var(--sidenav-w) + 30px); max-width:900px;} }

/* ---------- Lignes d'attribut ---------- */
.attr-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13px; color:var(--ink-dim);}
.attr-row:last-child{border-bottom:none;}
.attr-row .attr-val{background:var(--bg-3); color:var(--ink); font-family:var(--font-display); font-weight:600; font-size:13px; padding:3px 10px; border-radius:6px; min-width:16px; text-align:center;}
.attr-row .attr-val.accent{background:var(--accent); color:var(--accent-ink);}

/* ---------- Onglets ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:4px; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0; padding:9px 15px; border-radius:999px; border:1px solid var(--line-strong); background:rgba(16,24,28,.8);
  color:var(--ink-dim); font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.tab-btn:hover{color:var(--ink); border-color:#3a4c54;}
.tab-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}

/* ---------- Tableaux ---------- */
.tbl{width:100%; border-collapse:collapse; font-size:13px;}
.tbl th{text-align:left; color:var(--ink-faint); font-family:var(--font-display); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; padding:7px 5px; border-bottom:1px solid var(--line-strong);}
.tbl td{padding:9px 5px; border-bottom:1px solid var(--line-soft); font-family:var(--font-display); font-weight:500; font-size:14px;}
.tbl td.name-cell{font-family:var(--font); font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px;}
.tbl tbody tr:nth-child(even){background:rgba(255,255,255,.012);}
.tbl tr:hover{background:rgba(30,43,49,.55);}
.tbl .rk{color:var(--ink-faint); width:20px;}
.tbl tbody tr:nth-child(-n+3) .rk{color:var(--accent);}
.tbl tr.me{background:linear-gradient(90deg, rgba(215,255,60,.14), rgba(215,255,60,.02)); box-shadow:inset 3px 0 0 var(--accent);}

/* ---------- Actualités ---------- */
.recap-player{padding:9px 4px; border-bottom:1px solid var(--line-soft);}
.recap-player:last-child{border-bottom:none;}
.recap-more summary{cursor:pointer; padding:8px 4px; color:var(--accent); font-weight:600;}
.news-item{display:flex; gap:11px; padding:12px 4px; border-bottom:1px solid var(--line-soft);}
.news-item[onclick]:hover{background:rgba(30,43,49,.5); border-radius:var(--r-sm);}
.news-item:last-child{border-bottom:none;}
.news-ico{width:32px; height:32px; border-radius:10px; background:var(--bg-3); border:1px solid var(--line-strong); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;}
.news-text{font-size:13.5px; line-height:1.45;}
.news-meta{font-size:11px; color:var(--ink-faint); margin-top:3px;}
.news-message{padding:12px 4px; border-bottom:1px solid var(--line-soft);}
.news-message:last-child{border-bottom:none;}
.news-message[onclick]{cursor:pointer;}
.news-message[onclick]:hover{background:rgba(30,43,49,.5); border-radius:var(--r-sm);}
.news-message-head{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
.news-message-head .name{font-size:13px; font-weight:700;}
.news-msg-bubble{max-width:88%; padding:9px 12px; border-radius:14px; font-size:13px; line-height:1.4; margin-bottom:5px;}
.news-msg-bubble.incoming{background:var(--bg-3); border:1px solid var(--line-strong); border-bottom-left-radius:4px;}
.news-msg-bubble.outgoing{background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; font-weight:600; margin-left:auto;}
.news-message-outcome{font-size:12.5px; color:var(--ink-dim); margin-top:4px; padding-left:2px;}
.news-breaking{display:flex; gap:11px; padding:12px 6px 12px 12px; border-left:3px solid var(--gold); border-bottom:1px solid var(--line-soft); background:linear-gradient(90deg, rgba(228,180,63,.09), transparent 55%); border-radius:0 var(--r-sm) var(--r-sm) 0;}
.news-breaking:last-child{border-bottom:none;}
.news-breaking .news-ico{color:var(--gold); border-color:rgba(228,180,63,.35);}
.news-breaking[onclick]:hover{background:linear-gradient(90deg, rgba(228,180,63,.15), transparent 55%);}
.news-breaking-tag{display:inline-flex; align-items:center; gap:4px; font-family:var(--font-display); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--gold-soft); margin-bottom:3px;}
.news-referral{display:flex; gap:11px; padding:12px 6px 12px 12px; border-left:3px solid var(--accent); border-bottom:1px solid var(--line-soft); background:linear-gradient(90deg, rgba(215,255,60,.08), transparent 55%); cursor:pointer; border-radius:0 var(--r-sm) var(--r-sm) 0;}
.news-referral:last-child{border-bottom:none;}
.news-referral .news-ico{color:var(--accent); border-color:rgba(215,255,60,.35);}
.news-referral:hover{background:linear-gradient(90deg, rgba(215,255,60,.14), transparent 55%);}
.news-referral-tag{display:inline-flex; align-items:center; gap:4px; font-family:var(--font-display); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); margin-bottom:3px;}

/* ---------- « À vous de jouer » : actions à trancher ---------- */
.action-item{display:flex; align-items:center; gap:11px; padding:11px 10px 11px 12px; margin-bottom:6px; border-radius:var(--r-sm); background:rgba(5,8,10,.35); border:1px solid var(--line-soft); border-left:3px solid var(--tone, var(--blue));}
.action-item:last-child{margin-bottom:0;}
.action-item[onclick]{cursor:pointer;}
.action-item[onclick]:hover{background:rgba(30,43,49,.55);}
.action-item .news-ico{color:var(--tone, var(--blue)); border-color:color-mix(in srgb, var(--tone, var(--blue)) 40%, transparent);}

/* ---------- Événements : conversation sur le téléphone de l'agent ---------- */
.event-banner{border:1px solid var(--gold-dim); background:linear-gradient(135deg,#221c0c,#181410); border-radius:var(--r-md); padding:14px; margin-bottom:14px;}
.event-banner .kicker{color:var(--gold-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:800; margin-bottom:6px;}
.event-banner p{color:var(--ink); font-size:14px; margin-bottom:12px;}
.event-choices{display:flex; flex-direction:column; gap:8px;}
.event-overlay{background:rgba(2,4,4,.84);}
.event-modal{
  border:1px solid var(--line-strong); background:linear-gradient(180deg, #0f171a, #080d0f);
  box-shadow:0 0 0 1px rgba(215,255,60,.08), var(--sh-2);
}
.event-modal-kicker{color:var(--gold-soft); font-size:11px; text-transform:uppercase; letter-spacing:.14em; font-weight:800; margin-bottom:12px;}
.event-modal-text{font-size:17px; line-height:1.5; margin-bottom:20px; font-weight:600;}
.chat-header{display:flex; align-items:center; gap:11px; margin:-4px -2px 14px; padding:0 2px 12px; border-bottom:1px solid var(--line);}
.chat-avatar{width:44px; height:44px; border-radius:50%; background:linear-gradient(160deg, var(--accent), #9fc71a); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); font-size:16px; flex-shrink:0; box-shadow:0 0 0 3px rgba(215,255,60,.15);}
.chat-name{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.04em; font-weight:600; font-size:17px;}
.chat-sub{font-size:11px; color:var(--emerald-soft); display:flex; align-items:center; gap:5px;}
.chat-sub::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--emerald); box-shadow:0 0 8px var(--emerald);}
.chat-body{display:flex; flex-direction:column; gap:9px; margin-bottom:16px; padding:12px; border-radius:var(--r-md); background:repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 12px, transparent 12px 24px), rgba(0,0,0,.25);}
.chat-bubble{max-width:86%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.45; opacity:0; animation:fadein .3s ease forwards;}
.chat-bubble.incoming{align-self:flex-start; background:var(--bg-3); border:1px solid var(--line-strong); border-bottom-left-radius:4px;}
.chat-bubble.outgoing{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; font-weight:600;}
.chat-replies{display:flex; flex-direction:column; gap:8px;}
.chat-reply-btn{
  background:rgba(23,34,39,.7); border:1px solid var(--line-strong); color:var(--ink); border-radius:14px; padding:12px 14px;
  font-size:14px; font-weight:600; text-align:left; cursor:pointer; transition:background .15s, border-color .15s, transform .1s;
  display:flex; align-items:center; gap:10px;
}
.chat-reply-btn::before{content:'↳'; color:var(--accent); font-weight:800;}
.chat-reply-btn:hover{background:var(--bg-4); border-color:var(--accent);}
.chat-reply-btn:active{transform:scale(.98);}

/* ---------- Modales (feuille glissante sur mobile, carte au centre sur grand écran) ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(2,4,5,.74); z-index:60; display:flex; align-items:flex-end;
  justify-content:center; backdrop-filter:blur(4px);
}
.modal{
  position:relative; width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
  background:linear-gradient(180deg, #111a1e, #0a1013 40%); border:1px solid var(--line-strong);
  border-top-left-radius:24px; border-top-right-radius:24px; padding:26px 18px 26px; box-shadow:var(--sh-2);
  animation:slideup .25s cubic-bezier(.2,.9,.3,1);
}
.modal::before{content:''; position:absolute; top:9px; left:50%; width:40px; height:4px; margin-left:-20px; border-radius:4px; background:var(--line-strong);}
@keyframes slideup{from{transform:translateY(30px); opacity:.3;} to{transform:translateY(0); opacity:1;}}
@media (min-width:640px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:var(--r-lg); padding-top:22px;}
  .modal::before{display:none;}
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:22px; line-height:1.1;}
.modal-close{width:36px; height:36px; border-radius:50%; background:var(--bg-3); border:1px solid var(--line-strong); color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.modal-close:hover{color:var(--ink); border-color:#3a4c54;}
.modal-section{margin-bottom:18px;}
.modal-section label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-dim); margin-bottom:8px; font-weight:600;}
.modal-section label .num{color:var(--accent); font-size:15px;}
.modal-section select{width:100%; padding:11px 12px; background:var(--bg-2); border:1px solid var(--line-strong); color:var(--ink); border-radius:var(--r-sm); font-size:14px;}
input[type=range]{width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:6px; background:linear-gradient(90deg, var(--accent-dim), var(--bg-4)); outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--bg-1); box-shadow:0 0 0 1px var(--accent), 0 0 14px rgba(215,255,60,.45); cursor:pointer;}
input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid var(--bg-1); box-shadow:0 0 0 1px var(--accent); cursor:pointer;}
.reaction{font-size:12.5px; color:var(--red-soft); margin-top:7px; padding-left:10px; border-left:2px solid rgba(239,75,71,.5);}
.reaction.ok{color:var(--emerald-soft); border-left-color:var(--emerald);}

/* ---------- Résumé du mois ---------- */
.recap-hero{display:flex; align-items:baseline; gap:10px;}
.recap-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft); opacity:0; animation:fadein .35s ease forwards;}
.recap-item:nth-child(2){animation-delay:.06s;} .recap-item:nth-child(3){animation-delay:.12s;}
.recap-item:last-child{border-bottom:none;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Divers ---------- */
.empty-state{text-align:center; padding:44px 16px; color:var(--ink-dim); font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em; font-size:16px;}
.empty-state .small{font-family:var(--font); text-transform:none; letter-spacing:0; display:inline-block; margin-top:6px;}
.empty-state .emoji{display:flex; justify-content:center; margin:0 auto 12px; width:62px; height:62px; align-items:center; border-radius:50%; background:rgba(215,255,60,.07); border:1px dashed var(--accent-dim); color:var(--accent);}
.flag{font-size:15px;}
.sep{height:1px; background:var(--line); margin:14px 0;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.small{font-size:12px; color:var(--ink-faint);}
.toast{
  position:fixed; bottom:calc(var(--fab-h) + var(--bottombar-h) + 26px); left:50%; transform:translateX(-50%); max-width:calc(100vw - 32px);
  display:flex; align-items:center; gap:9px;
  background:rgba(23,34,39,.96); border:1px solid var(--line-strong); color:var(--ink); padding:11px 18px;
  border-radius:999px; font-size:13.5px; font-weight:600; z-index:90; box-shadow:var(--sh-2); backdrop-filter:blur(10px);
  animation:toastin .25s ease;
}
.toast::before{content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); flex-shrink:0;}
@media (min-width:900px){ .toast{bottom:calc(var(--fab-h) + 34px); left:calc(50% + var(--sidenav-w) / 2);} }
@keyframes toastin{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}

.region-card.active{border-color:var(--accent); background:linear-gradient(160deg, rgba(215,255,60,.18), rgba(215,255,60,.04)); color:var(--accent);}
.region-card.active .small{color:var(--accent-soft);}
.region-card .flag{font-size:24px; display:block; margin-bottom:5px;}
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{animation:none !important; transition:none !important;} }

// ---------- Utils ----------
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
function weightedChoice(items, weightFn) {
  const total = items.reduce((s, it) => s + weightFn(it), 0);
  let r = Math.random() * total;
  for (const it of items) { r -= weightFn(it); if (r <= 0) return it; }
  return items[items.length - 1];
}
function poissonSample(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}
function fmtMoneyShort(v) {
  const sign = v < 0 ? '-' : '';
  v = Math.abs(v);
  if (v >= 1000000) return sign + (v / 1000000).toFixed(v >= 10000000 ? 0 : 1) + 'M€';
  if (v >= 1000) return sign + Math.round(v / 1000) + 'k€';
  return sign + Math.round(v) + '€';
}
// montant exact avec séparateur de milliers : fmtMoneyShort arrondit 4 500 en « 5k€ », trompeur quand le chiffre
// affiché est une LIMITE à ne pas dépasser (plafond salarial annoncé par un club).
function fmtMoneyFull(v){ return Math.round(v).toLocaleString('fr-FR') + ' €'; }
function nextId(state, prefix) { state.nextId = (state.nextId || 1) + 1; return prefix + state.nextId; }

// ---------- Calendrier ----------
function calMonth(state) { return SEASON_MONTH_ORDER[state.date.absMonth % 12]; }
function seasonIdx(state) { return Math.floor(state.date.absMonth / 12); }
function seasonStartYear(state) { return state.startYear + seasonIdx(state); }
function calYear(state) { const m = calMonth(state); return seasonStartYear(state) + (m < 8 ? 1 : 0); }
function seasonLabel(state) { const y = seasonStartYear(state); return `${y}-${String((y + 1) % 100).padStart(2, '0')}`; }
function monthsUntilNextMercato(state) {
  const cur = state.date.absMonth % 12; // index dans SEASON_MONTH_ORDER : 5 = mercato d'hiver, 11 = mercato d'été
  let best = 12;
  for (const t of [5, 11]) best = Math.min(best, (t - cur + 12) % 12);
  return best;
}
// Prochaines échéances (addictivité) : rassemble, sans nouvel état à maintenir, tout ce qui mérite un coup d'œil
// prochainement — contrats qui arrivent à échéance, prêts qui se terminent, promesses à tenir, objectif de saison
// tout proche — pour donner une vraie raison concrète de revenir avancer d'un mois plutôt que de refermer l'appli.
function computeUpcomingDeadlines(state) {
  const items = [];
  const curAbs = state.date.absMonth;
  const curCalYear = seasonStartYear(state);
  const mercatoIn = monthsUntilNextMercato(state);
  if (mercatoIn <= 2) items.push({ months: mercatoIn, icon: 'calendar', text: mercatoIn === 0 ? 'Le mercato est ouvert ce mois-ci.' : `Le mercato ouvre dans ${mercatoIn} mois.` });
  for (const pid of state.agent.portfolio) {
    const p = state.players[pid];
    if (!p || p.retired) continue;
    if (p.contractUntil) {
      const seasonsLeft = p.contractUntil - curCalYear;
      if (seasonsLeft <= 1) {
        const monthsLeft = Math.max(0, 12 - (curAbs % 12));
        items.push({ months: monthsLeft, icon: 'pen', text: `Le contrat de ${p.name} arrive à échéance.`, playerId: p.id });
      }
    }
    if (p.parentClub && p.loanUntil) {
      const monthsLeft = p.loanUntil - curAbs;
      if (monthsLeft <= 2) items.push({ months: Math.max(0, monthsLeft), icon: 'refresh', text: monthsLeft <= 0 ? `Le prêt de ${p.name} se termine ce mois-ci.` : `Le prêt de ${p.name} se termine dans ${monthsLeft} mois.`, playerId: p.id });
    }
    if (p.rolePromise) {
      const monthsLeft = p.rolePromise.checkAt - curAbs;
      if (monthsLeft <= 2) items.push({ months: Math.max(0, monthsLeft), icon: 'chat', text: `Promesse à ${p.name} vérifiée dans ${Math.max(0, monthsLeft)} mois.`, playerId: p.id });
    }
  }
  for (const g of (state.seasonGoals || [])) {
    const cur = state.agent.careerStats[g.metric] || 0;
    const prog = clamp(Math.round(((cur - g.startVal) / g.amount) * 100), 0, 100);
    if (prog >= 70 && prog < 100) items.push({ months: 0, icon: 'target', text: `Objectif "${g.label}" à ${prog}%.` });
  }
  items.sort((a, b) => a.months - b.months);
  return items.slice(0, 4);
}
function advanceDate(state) { state.date.absMonth++; }

function pickNationalityForClub(club) {
  const league = LEAGUES.find(l => l.id === club.league);
  const homeNat = league ? league.nat : 'FR';
  if (Math.random() < 0.65 && NAME_POOLS[homeNat]) return homeNat;
  return choice(NAT_CODES);
}
function genName(nat) {
  const pool = NAME_POOLS[nat] || NAME_POOLS.FR;
  return { first: choice(pool.first), last: choice(pool.last) };
}
function baseOvrForTier(tier) {
  const table = { 5: [78, 90], 4: [74, 86], 3: [68, 80], 2: [62, 75], 1: [55, 70] };
  return table[tier] || table[3];
}
function estimateValue(ovr, pot, age, tier) {
  const base = Math.pow(1.155, ovr - 50) * 100000;
  const potBonus = 1 + Math.max(0, (pot - ovr)) * 0.035;
  let ageFactor = 1;
  if (age <= 21) ageFactor = 1.15;
  else if (age >= 31) ageFactor = Math.max(0.2, 1 - (age - 30) * 0.13);
  const tierFactor = 0.8 + (tier || 2) * 0.08;
  const val = base * potBonus * ageFactor * tierFactor;
  return Math.max(50000, Math.round(val / 5000) * 5000);
}
function computeWage(value, tier) {
  const annual = value * 0.15 * (0.7 + (tier || 2) * 0.08);
  return Math.max(1500, Math.round(annual / 12 / 500) * 500);
}

function estimatePlayingTimeOutlook(state, club, player) {

    const adultOvr = randInt(lo, hi);

    ego: Math.round(((Math.random() + Math.random() + Math.random()) / 3) * 100),
    greed: Math.round(((Math.random() + Math.random() + Math.random()) / 3) * 100),
    personality: choice(PERSONALITIES),

    dreamCountry: pickDreamCountry(nat),

    careerGoals: 0, careerAssists: 0, careerCS: 0, careerSaves: 0, careerApps: 0,
    collectiveTitles: 0, individualAwards: 0, seasonsPlayed: 0,
    career: [], trophies: [], sellOnClause: null,
    retired: false, injuredUntil: 0,

    careerMinutes: 0, fatigue: 0, peakValue: value, injuryType: null, recentInjuryType: null,
    suspendedMatches: 0, parentClub: null, loanUntil: null, releaseClause: null,
    // club formateur (V7) : fixé une fois pour toutes à la génération, ne bouge jamais même après un transfert —

    courtship: null, lastRenewalMonth: null,

    lastTransferMonth: null,

    agentTrust: 50,
    // si ce joueur est le fruit d'une recommandation reçue d'un client, la fenêtre pendant laquelle il reste

    referralUntil: null, referredByName: null,

    lastReferralMonth: null,

// pendant l'init du monde, `state.date` n'existe pas encore -> fallback
function seasonStartYearFromScratch(state) { return state.date ? seasonStartYear(state) : (state.startYear || 2026); }

// ---------- Monde : ligues, clubs, effectifs initiaux ----------
function emptyTableRow() { return { pts: 0, mj: 0, v: 0, n: 0, d: 0, bp: 0, bc: 0 }; }
function tierBudget(tier) { return [0, 2000000, 6000000, 15000000, 40000000, 120000000][tier]; }
function tierWageBudget(tier) { return [0, 150000, 400000, 900000, 2000000, 5000000][tier]; }
// ---------- Réputation & économie des clubs (V7) ----------
// La réputation est une couche vivante distincte du tier (qui reste un simple gabarit de génération initiale) :
// elle dérive des performances sportives, de la valeur d'effectif et des parcours européens, et pilote en retour
// l'attractivité du club sur le marché et ses revenus. Un stade et son niveau d'infrastructure la complètent.
function stadiumBaseCapacity(tier) { return [4000, 12000, 22000, 38000, 62000][clamp(tier, 1, 5) - 1]; }
function ticketPriceForTier(tier) { return [12, 18, 28, 42, 65][clamp(tier, 1, 5) - 1]; }
function initClubEconomy(club) {
  // idempotent : ne touche jamais un champ déjà présent, pour rester sûr aussi bien à la création
  // qu'en migration d'une sauvegarde plus ancienne qui ne connaît pas encore ces champs.
  if (club.reputation === undefined) club.reputation = clamp(Math.round(18 + club.tier * 16 + rand(-4, 4)), 5, 95);
  if (club.stadiumCapacity === undefined) club.stadiumCapacity = Math.round(stadiumBaseCapacity(club.tier) * (0.8 + Math.random() * 0.4));
  if (club.stadiumLevel === undefined) club.stadiumLevel = clamp(club.tier, 1, 5);
  if (!club.history) club.history = [];
}
function recomputeLeagueReputation(state, lg) {
  const clubs = lg.clubIds.map(id => state.clubs[id]).filter(Boolean);
  if (!clubs.length) { lg.reputation = 30; return; }
  // pondéré vers le haut du tableau (comme un coefficient UEFA) : les meilleurs clubs pèsent plus que la lanterne rouge
  const sorted = [...clubs].sort((a, b) => b.reputation - a.reputation);
  const top = sorted.slice(0, Math.max(1, Math.round(sorted.length * 0.6)));
  const w = top.reduce((s, c) => s + c.reputation, 0) / top.length;
  lg.reputation = clamp(Math.round(w * 10) / 10, 4, 99);
}

// Composition type d'un effectif (23 joueurs) : sert à la création du monde ET, depuis la V8.3 (audit P0-5), à
// choisir le poste des jeunes qui arrivent chaque saison — ils étaient tirés au hasard, si bien que les gardiens
// (10 % des tirages pour 13 % des besoins) disparaissaient peu à peu : 29 clubs sans aucun gardien après 20 saisons.
const SQUAD_PLAN = [['GK', 3], ['DC', 3], ['DL', 2], ['DR', 2], ['MDC', 2], ['MC', 3], ['MOC', 2], ['AG', 2], ['AD', 2], ['BU', 2]];

  let best = [], bestGap = -Infinity;
  for (const [pos, want] of SQUAD_PLAN) {
    const gap = (want - (counts[pos] || 0)) / want; // manque relatif : 1 gardien sur 3 pèse plus que 2 DC sur 3
    if (gap > bestGap) { bestGap = gap; best = [pos]; } else if (gap === bestGap) best.push(pos);
  }

}
function initWorld(state) {
  state.leagues = {}; state.clubs = {}; state.players = {};
  for (const lg of LEAGUES) state.leagues[lg.id] = { id: lg.id, name: lg.name, country: lg.country, clubIds: [], fixtures: [] };
  for (const [lgId, arr] of Object.entries(CLUB_RAW)) {
    for (const [id, name, short, city, c1, c2, tier] of arr) {
      const club = {
        id, name, short, city, league: lgId, c1, c2, tier,
        budget: tierBudget(tier), wageBudget: tierWageBudget(tier),
        squad: [], table: emptyTableRow(), titlesWon: 0,
      };
      initClubEconomy(club);
      state.clubs[id] = club;
      state.leagues[lgId].clubIds.push(id);
      for (const [posCode, count] of SQUAD_PLAN) {
        for (let i = 0; i < count; i++) {
          const p = generatePlayer(state, { club, forcedPos: posCode, ageMin: 18, ageMax: 33 });
          state.players[p.id] = p;

// ---------- Calendrier de championnat (round-robin double, méthode du cercle) ----------
function generateRoundRobin(clubIds) {
  const teams = [...clubIds];
  if (teams.length % 2 !== 0) teams.push(null);
  const n = teams.length, half = n / 2;
  let arr = teams.slice();
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const roundPairs = [];
    for (let i = 0; i < half; i++) {
      const home = arr[i], away = arr[n - 1 - i];
      if (home !== null && away !== null) {
        if (r % 2 === 0) roundPairs.push([home, away]); else roundPairs.push([away, home]);
      }
    }
    rounds.push(roundPairs);
    const fixed = arr[0], rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  const secondLeg = rounds.map(round => round.map(([h, a]) => [a, h]));
  return rounds.concat(secondLeg);
}
function assignMatchdaysToMonths(matchdayCount) {
  const months = MATCH_MONTHS;
  const perMonthBase = Math.floor(matchdayCount / months.length);
  let remainder = matchdayCount - perMonthBase * months.length;
  const plan = [];
  for (let m = 0; m < months.length; m++) {
    let count = perMonthBase + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
    for (let k = 0; k < count; k++) plan.push(months[m]);
  }
  return plan;
}
function generateSeasonFixtures(clubIds) {
  const rounds = generateRoundRobin(clubIds);
  const monthPlan = assignMatchdaysToMonths(rounds.length);
  const fixtures = [];
  rounds.forEach((round, i) => {
    const month = monthPlan[i];
    round.forEach(([home, away]) => fixtures.push({ month, home, away, played: false }));
  });
  return fixtures;
}

// ---------- Simulation de match ----------
function avgBy(arr, fn) { return arr.length ? arr.reduce((s, x) => s + fn(x), 0) / arr.length : 55; }
// seuil de série au banc (V9.4) : à 3 matchs, les messages banc/titulaire faisaient presque la moitié des
// événements sur 10 saisons testées en navigateur — trois matchs sur le banc, c'est banal pour un remplaçant.
const STATUS_BENCH_STREAK = 5;
const STATUS_MSG_COOLDOWN = 6; // mois minimum entre deux messages de statut pour un même joueur
// Composition par poste (V8.3, audit P0-5) : le onze était formé des onze meilleurs scores tous postes confondus —
// mesuré sur 4 320 compositions, 13 % n'alignaient aucun gardien et 46 % en alignaient plusieurs. Désormais un
// 4-3-3 : 1 gardien, 4 défenseurs, 3 milieux, 3 attaquants, avec les deux créneaux de rotation d'avant (joueurs
// peu utilisés, jeunes à potentiel d'abord) placés dans les lignes où le banc est le plus fourni. Une ligne
// incomplète est complétée par les meilleurs joueurs de champ restants ; sans aucun gardien disponible, un joueur
// de champ dépanne dans les buts.
const LINEUP_SHAPE = { GK: 1, DF: 4, MF: 3, FW: 3 };
function pickLineup(players) {
  const scored = players.map(p => ({ p, score: p.ovr * 0.7 + p.form * 0.2 + p.morale * 0.1 - (p.fatigue || 0) * 0.08 + rand(0, 14) }));
  scored.sort((a, b) => b.score - a.score);
  const byLine = { GK: [], DF: [], MF: [], FW: [] };
  for (const s of scored) (byLine[s.p.posLine] || byLine.MF).push(s.p);
  const picked = {};
  for (const [line, n] of Object.entries(LINEUP_SHAPE)) picked[line] = byLine[line].slice(0, n);
  // créneaux de rotation : sans eux, les joueurs à faible niveau ne jouent jamais et ne progressent jamais
  const ROTATION_SLOTS = 2;
  const benchOf = line => byLine[line].slice(LINEUP_SHAPE[line]);
  const rotationLines = ['DF', 'MF', 'FW'].filter(l => benchOf(l).length && picked[l].length === LINEUP_SHAPE[l])
    .sort((a, b) => benchOf(b).length - benchOf(a).length).slice(0, ROTATION_SLOTS);
  for (const line of rotationLines) {
    const best = benchOf(line).map(p => {
      const youthBonus = (p.age <= 21 && (p.pot - p.ovr) > 8) ? 15 : 0;
      return { p, rscore: -(p.seasonStats.apps || 0) * 3 + youthBonus + rand(0, 10) };
    }).sort((a, b) => b.rscore - a.rscore)[0];
    picked[line][picked[line].length - 1] = best.p; // remplace le moins bien classé des titulaires de la ligne
  }
  const xi = [].concat(picked.GK, picked.DF, picked.MF, picked.FW);
  // lignes incomplètes (effectif décimé) : on complète avec les meilleurs restants, gardien en dernier recours
  const rest = scored.map(s => s.p).filter(p => !xi.includes(p));
  const restOutfield = rest.filter(p => p.posLine !== 'GK');
  const restGK = rest.filter(p => p.posLine === 'GK');
  if (!picked.GK.length && restOutfield.length) xi.unshift(restOutfield.shift());
  while (xi.length < 11 && (restOutfield.length || restGK.length)) xi.push(restOutfield.length ? restOutfield.shift() : restGK.shift());
  return xi;
}
function squadStrength(state, club, statusReactionCandidates) {
  const monthNow = state.date.absMonth;
  const allSquad = club.squad.map(id => state.players[id]).filter(p => p && !p.retired);
  // indisponibles : blessés ou suspendus (un joueur indisponible ne doit jamais être sélectionné)
  const players = allSquad.filter(p => (!p.injuredUntil || p.injuredUntil <= monthNow) && !(p.suspendedMatches > 0));
  // les joueurs suspendus purgent un match à chaque fois que leur équipe joue
  allSquad.forEach(p => { if (p.suspendedMatches > 0) p.suspendedMatches--; });
  const xi = pickLineup(players);
  // Changement de statut (V9.3, suite) : un suivi léger (deux compteurs par joueur représenté) suffit à repérer
  // une vraie bascule — trois matchs de suite au banc, ou trois titularisations d'affilée juste après une telle
  // série — plutôt que de réagir au moindre choix de composition, qui varie chaque semaine sans rien signifier.
  if (statusReactionCandidates) {
    for (const p of players) {
      if (!state.agent.portfolio.includes(p.id)) continue;
      if (xi.includes(p)) {
        if ((p.benchStreak || 0) >= STATUS_BENCH_STREAK && !p.justBrokeIn) { p.justBrokeIn = true; statusReactionCandidates.push({ playerId: p.id, playerName: p.name, kind: 'breakthrough' }); }
        p.benchStreak = 0;

      } else {
        p.startStreak = 0; p.justBrokeIn = false;
        p.benchStreak = (p.benchStreak || 0) + 1;
        if (p.benchStreak === STATUS_BENCH_STREAK) statusReactionCandidates.push({ playerId: p.id, playerName: p.name, kind: 'benched' });
      }

function checkRecord(state, key, player, value, extra = {}) {
  const r = state.records[key];
  if (!r || value > r.value) {
    state.records[key] = { value, name: player.name, nat: player.nat, club: player.club, season: seasonLabel(state), agentWasMine: player.agentId === 'player', ...extra };
  }
}
function weightedPickOne(list, weightFn) { return list.length ? weightedChoice(list, weightFn) : null; }

  return res;
}
function applyMatchResult(state, club, xi, goalsFor, goalsAgainst) {
  const t = club.table;

  else if (goalsFor === goalsAgainst) { t.n++; t.pts += 1; }
  else t.d++;

  if (club.form5.length > 5) club.form5.shift();

  const ratingBase = {};
  for (const p of xi) {
    p.seasonStats.apps++; p.careerApps++;
    const mins = Math.random() < 0.12 ? randInt(15, 75) : randInt(80, 90);
    p.seasonStats.minutes = (p.seasonStats.minutes || 0) + mins;
    p.careerMinutes = (p.careerMinutes || 0) + mins;
    p.monthsSinceLastMatch = 0;
    p.fatigue = clamp((p.fatigue || 0) + 8, 0, 100);
    // note de base : découle du résultat collectif, de la forme et du temps de jeu — bruit réduit, ajusté ensuite par les actions individuelles
    ratingBase[p.id] = 6.1 + (goalsFor - goalsAgainst) * 0.1 + (p.form - 50) / 160 + (mins - 75) / 220 + (Math.random() - 0.5) * 0.5;
    const proProneness = 1 - (p.consistency - 0.5) * 0.4; // les pros écopent un peu moins de cartons
    if (Math.random() < 0.012 * proProneness) {

      p.suspendedMatches = (p.suspendedMatches || 0) + 1;

      p.seasonStats.cardY = (p.seasonStats.cardY || 0) + 1; log.cardsY.push({ id: p.id, name: p.name });
      if (p.seasonStats.cardY % 5 === 0) p.suspendedMatches = (p.suspendedMatches || 0) + 1; // cumul de cartons jaunes = suspension, comme en vrai
      ratingBase[p.id] -= 0.3;

    for (const scorer of scorers) {

      scorer.careerGoals++;

      ratingBase[scorer.id] += 0.9; // la note reflète la contribution réelle, pas seulement le hasard
      const entry = { id: scorer.id, name: scorer.name, min: randInt(1, 90) };
      const passers = outfield.filter(p => p !== scorer);
      const passer = weightedPickOne(passers, p => (p.posLine === 'MF' ? 2 : p.posLine === 'FW' ? 1.2 : 0.5) * (p.ovr / 70));
      if (passer && Math.random() < 0.72) {
        passer.seasonStats.assists = (passer.seasonStats.assists || 0) + 1;
        passer.careerAssists++;
        checkRecord(state, 'topAssists', passer, passer.careerAssists);
        ratingBase[passer.id] += 0.5;
        entry.assistId = passer.id; entry.assistName = passer.name;
      }
      log.scorers.push(entry);
    }
  }
  if (gk) {
    gk.seasonStats.saves = (gk.seasonStats.saves || 0) + Math.max(0, Math.round(goalsAgainst * 1.3 + rand(0, 3)));
    gk.seasonStats.ga = (gk.seasonStats.ga || 0) + goalsAgainst;
    if (goalsAgainst === 0) {
      gk.seasonStats.cs = (gk.seasonStats.cs || 0) + 1;
      gk.careerCS = (gk.careerCS || 0) + 1;
      checkRecord(state, 'topCleanSheets', gk, gk.careerCS);
      ratingBase[gk.id] += 0.6;
    }
  }
  for (const p of xi) {
    const rating = clamp(ratingBase[p.id], 3, 10);
    p.seasonStats.ratingSum += rating;
    log.ratings.push({ id: p.id, name: p.name, rating: Math.round(rating * 10) / 10 });
  }

}
function simulateMatch(state, homeClub, awayClub, statusReactionCandidates) {
  const H = squadStrength(state, homeClub, statusReactionCandidates), A = squadStrength(state, awayClub, statusReactionCandidates);
  const homeAdv = 4;
  const xgHome = clamp(1.25 + (H.attack - A.defense) / 16 + homeAdv / 28, 0.15, 4.2);
  const xgAway = clamp(1.15 + (A.attack - H.defense) / 16 - homeAdv / 34, 0.1, 4.0);
  const goalsHome = poissonSample(xgHome), goalsAway = poissonSample(xgAway);
  const logHome = applyMatchResult(state, homeClub, H.xi, goalsHome, goalsAway);
  const logAway = applyMatchResult(state, awayClub, A.xi, goalsAway, goalsHome);
  const allRatings = [...logHome.ratings, ...logAway.ratings].sort((a, b) => b.rating - a.rating);
  return {
    goalsHome, goalsAway, scorersHome: logHome.scorers, scorersAway: logAway.scorers,
    cardsY: [...logHome.cardsY, ...logAway.cardsY], cardsR: [...logHome.cardsR, ...logAway.cardsR],
    motm: allRatings[0] || null,
    ratingsHome: logHome.ratings, ratingsAway: logAway.ratings,

}

function clubName(state, p) { const c = p.club ? state.clubs[p.club] : null; return c ? c.name : 'agent libre'; }
function isNewsworthy(state, p) {

// ---------- Paliers de carrière (V9.4, audit « carrière de l'agent ») ----------
// Calés sur les seuils de réputation qui ouvraient déjà l'agrandissement de l'agence (15/30/45/60) : chaque palier

const CAREER_TIERS = [
  { min: 0,  label: 'Agent local',          unlock: 'Vos débuts : un petit bureau et trois joueurs au maximum.' },
  { min: 15, label: 'Agent reconnu',        unlock: 'Débloque l\u2019Agence nationale (6 joueurs).' },
  { min: 30, label: 'Agent national',       unlock: 'Débloque l\u2019Agence européenne (11 joueurs).' },
  { min: 45, label: 'Agent international',  unlock: 'Débloque l\u2019Agence internationale (18 joueurs).' },
  { min: 60, label: 'Super-agent',          unlock: 'Débloque l\u2019Empire mondial (30 joueurs).' },

function checkCareerTier(state, news) {

  } else if (state.agent.careerTier === undefined) state.agent.careerTier = prev;

// ---------- Investissements de l'agence (V9.4, audit « agence et staff ») ----------
// La simulation d'un agent actif finissait avec 400 à 550 M€ sans rien à acheter : l'argent ne décidait plus rien.
// Quatre gros choix structurants plutôt qu'un arbre de compétences, chacun débloqué par un palier de carrière, avec
// un coût d'achat, un coût mensuel qui pèse vraiment en fin de partie, et un effet qu'on ressent en jouant.
const AGENCY_INVESTMENTS = [
  { id: 'medical', label: 'Pôle médical', tier: 2, cost: 1500000, upkeep: 60000, effect: 'Les blessures de vos clients durent 35 % moins longtemps.' },
  { id: 'recrutement', label: 'Cellule de recrutement', tier: 3, cost: 5000000, upkeep: 200000, effect: '+10 d\u2019intérêt des joueurs pour votre agence ; les rivaux vous disputent vos prospects deux fois moins souvent.' },
  { id: 'academie', label: 'Académie de l\u2019agence', tier: 4, cost: 20000000, upkeep: 700000, effect: 'Chaque fin de saison, deux jeunes prometteurs formés par l\u2019agence rejoignent votre portefeuille.' },
  { id: 'fondation', label: 'Fondation de l\u2019agence', tier: 5, cost: 50000000, upkeep: 2000000, effect: 'Vos clients résistent bien mieux au débauchage, et votre réputation progresse doucement chaque mois.' },
];
function hasInvestment(state, id) { return !!(state.agent.investments && state.agent.investments[id]); }
function investmentsUpkeep(state) { return AGENCY_INVESTMENTS.filter(i => hasInvestment(state, i.id)).reduce((a, i) => a + i.upkeep, 0); }
function buyInvestment(state, id) {
  const inv = AGENCY_INVESTMENTS.find(i => i.id === id);
  if (!inv || hasInvestment(state, id)) return { ok: false, reason: 'Déjà en place.' };
  if ((state.agent.careerTier || 0) < inv.tier) return { ok: false, reason: `Réservé aux agents de rang « ${CAREER_TIERS[inv.tier].label} ».` };
  if (state.agent.cash < inv.cost) return { ok: false, reason: 'Trésorerie insuffisante.' };
  state.agent.cash -= inv.cost;

function closeInvestment(state, id) {

function clientInjuryDuration(state, p, dur) {

// Académie : deux jeunes de 15-17 ans au vrai potentiel, placés dans des clubs (un contrat de formation) et déjà

    p.pot = clamp(Math.max(p.pot, randInt(76, 90)), p.ovr, 94); // de vraies pépites (un premier réglage donnait des potentiels de 68)
    p.value = estimateValue(p.ovr, p.pot, p.age, club.tier);
    p.agentId = 'player';
    state.players[p.id] = p; club.squad.push(p.id); state.agent.portfolio.push(p.id);

// ---------- Économie / transferts ----------
function agentCommissionRate(state) {
  let base = 0.10;
  if ((state.agent.careerTier || 0) >= 5) base += 0.01; // Légende du métier
  if (state.agent.specialty === 'negociateur') base += 0.02;
  base += (state.agent.officeLevel - 1) * 0.005;
  base += (state.agent.staff.negociateurs || 0) * 0.004;

// Rendement décroissant (V9.4, simulation d'un agent actif sur 15 saisons) : chaque gain était plat, si bien qu'un
// agent efficace atteignait 100 de réputation et l'agence maximale en 4 à 6 saisons — il ne restait plus rien à
// conquérir pour une carrière longue. Le prestige se gagne vite au début, de plus en plus difficilement au sommet ;
// les pertes, elles, restent entières.
const REP_DIMINISH_EXP = 1.6;
function gainReputation(state, amount) {
  const mult = state.agent.specialty === 'mediatique' ? 1.25 : 1;
  const diminish = amount > 0 ? Math.pow(clamp(1 - state.agent.reputation / 110, 0.02, 1), REP_DIMINISH_EXP) : 1;
  state.agent.reputation = clamp(state.agent.reputation + amount * mult * diminish, 0, 100);
  state.agent.careerStats.peakReputation = Math.max(state.agent.careerStats.peakReputation, state.agent.reputation);

// Amortit un revenu ponctuel (vente, prime de coupe...) une fois qu'un club a accumulé bien plus que ce que son
// tier justifie — au-delà de ce plafond structurel, l'essentiel du gain s'évapore (réinvesti en dépenses
// somptuaires, dettes diverses, etc.) plutôt que de s'accumuler indéfiniment. Complète le plafond déjà appliqué
// aux revenus mensuels ordinaires (monthlyClubFinances), qui ne couvrait que cette seule source de revenus.
function dampedClubIncome(club, amount) {
  if (amount <= 0) return amount;
  const cap = tierBudget(club.tier) * 10 * (0.6 + (club.reputation || 50) / 100);
  if (club.budget >= cap) return Math.round(amount * 0.12);
  const factor = clamp(1 - club.budget / cap, 0.12, 1);
  return Math.round(amount * factor);
}
function executeTransfer(state, player, buyerClub, fee, news, opts = {}) {
  // clause de pourcentage à la revente négociée lors d'une vente précédente
  if (player.sellOnClause && player.sellOnClause.pct > 0) {
    const payout = Math.round(fee * player.sellOnClause.pct / 100);
    if (player.sellOnClause.holderId === 'player') {
      state.agent.cash += payout;
      state.agent.careerStats.totalCommissions += payout;
      if (news) news.push({ text: `Clause de revente : ${fmtMoneyShort(payout)} tombent grâce à un ancien deal sur ${player.name}.`, tag: 'business', playerId: player.id });
    } else {
      const ra = state.rivalAgents.find(a => a.id === player.sellOnClause.holderId);
      if (ra) ra.cash += payout;
    }
    player.sellOnClause = null;
  }
  const sellerClub = player.club ? state.clubs[player.club] : null;
  // les gains ponctuels (ventes, primes) s'amortissent une fois qu'un club a bien plus d'argent que son tier ne le
  // justifie (V8, robustesse longue durée) : sans ça, un club dominant qui vend régulièrement finit par accumuler
  // une richesse sans limite alors que les valeurs de joueurs, elles, restent bornées — un "club invincible"
  // financièrement, exactement ce que l'on cherche à éviter sur des parties de centaines de saisons.
  if (sellerClub) { sellerClub.budget += dampedClubIncome(sellerClub, fee); sellerClub.squad = sellerClub.squad.filter(id => id !== player.id); }
  buyerClub.budget -= fee;
  player.club = buyerClub.id;
  player.contractUntil = seasonStartYear(state) + randInt(2, 5);
  player.parentClub = null; player.loanUntil = null; // un transfert ferme met fin à un éventuel prêt en cours
  player.lastTransferMonth = state.date.absMonth; // V8.2, chasse aux exploits : voir evaluateTransferCooldown
  buyerClub.squad.push(player.id);
  state.transferListed = (state.transferListed || []).filter(id => id !== player.id);
  checkRecord(state, 'biggestTransfer', player, fee, { fromClub: sellerClub ? sellerClub.name : 'Libre', toClub: buyerClub.name });
  if (player.agentId === 'player') {
    // joueur libre (V8.3, audit P0-2) : pas d'indemnité donc pas de pourcentage dessus — l'agent touche à la place
    // des frais d'agent versés par le club qui recrute, proportionnels à un an de salaire, comme en vrai.
    let commission;
    if (sellerClub) commission = Math.round(fee * agentCommissionRate(state));
    else {
      commission = Math.round((player.wage || 0) * 12 * agentCommissionRate(state));
      buyerClub.budget -= commission;
    }
    state.agent.cash += commission;
    state.agent.careerStats.totalCommissions += commission;
    state.agent.careerStats.transfersDone = (state.agent.careerStats.transfersDone || 0) + 1;
    state.agent.careerStats.biggestFeeDone = Math.max(state.agent.careerStats.biggestFeeDone || 0, fee);
    gainReputation(state, 1.2);
  } else if (player.agentId) {
    const ra = state.rivalAgents.find(a => a.id === player.agentId);
    if (ra) { ra.cash += Math.round(fee * 0.09); ra.reputation = clamp(ra.reputation + 1, 0, 100); }
  }
  if (!opts.silent && isNewsworthy(state, player)) {
    news.push({ text: `Transfert : ${player.name} rejoint ${buyerClub.name} (${sellerClub ? fmtMoneyShort(fee) : 'libre'}).`, tag: 'transfert', playerId: player.id, breaking: true });
  }
}
function weakestLine(state, club) {
  // V8.3 (audit P0-5) : les gardiens étaient exclus de ce calcul, donc jamais recrutés par l'IA
  const gkCount = club.squad.filter(id => state.players[id] && state.players[id].posLine === 'GK').length;
  if (gkCount < 2) return 'GK';
  const lines = { DF: [], MF: [], FW: [] };
  for (const id of club.squad) { const p = state.players[id]; if (p && lines[p.posLine]) lines[p.posLine].push(p.ovr); }
  const scored = Object.entries(lines).map(([k, v]) => [k, avgBy(v.map(x => ({ x })), o => o.x)]);
  scored.sort((a, b) => a[1] - b[1]);

}
function runAIClubTransfers(state, news, isMercato) {
  const attempts = isMercato ? 14 : 2;
  for (let i = 0; i < attempts; i++) {
    const buyer = choice(Object.values(state.clubs));
    if (buyer.budget < 300000) continue;
    const line = weakestLine(state, buyer);
    const candidates = (state.transferListed || [])
      .map(id => state.players[id])
      .filter(p => p && !p.retired && p.club !== buyer.id && p.posLine === line && p.agentId !== 'player' && p.value <= buyer.budget);
    if (!candidates.length) continue;
    // le niveau reste le critère dominant, mais à niveau proche, un club recrute un peu plus volontiers un joueur
    // culturellement familier à son championnat (comme le ferait un vrai recruteur)
    const buyerLgNat = (LEAGUES.find(l => l.id === buyer.league) || {}).nat;
    candidates.sort((a, b) => (b.ovr + countryAffinity(b.nat, buyerLgNat) / 30) - (a.ovr + countryAffinity(a.nat, buyerLgNat) / 30));
    const target = candidates[0];
    executeTransfer(state, target, buyer, target.value, news, { silent: false });
  }
}
// Un talent libre (souvent un jeune tout juste scouté) ne doit pas attendre indéfiniment l'agence du joueur :
// des clubs signent aussi de leur propre initiative — ça crée une vraie urgence à représenter une pépite repérée
// avant qu'un club ne le fasse à sa place, exactement l'histoire qu'un monde vivant doit pouvoir raconter.
function runAIClubFreeAgentSignings(state, news, isMercato) {
  // V8.3 (audit P0-4) : depuis que les fins de contrat libèrent vraiment les joueurs, le vivier des libres se
  // remplit à chaque été. Pendant le mercato, chaque club en sous-effectif tente donc de se renforcer parmi eux
  // (au lieu de six tentatives au hasard pour tout le monde), en visant un niveau cohérent avec le sien ; hors
  // mercato, quelques signatures ponctuelles comme avant.
  let pool = (state.freeAgents || []).map(id => state.players[id]).filter(p => p && !p.retired && !p.club && p.agentId !== 'player');
  if (!pool.length) return;
  const clubs = Object.values(state.clubs);
  const buyers = isMercato
    ? clubs.filter(c => c.squad.length < 23).sort(() => Math.random() - 0.5)
    : [choice(clubs), choice(clubs)];
  for (const buyer of buyers) {
    if (!pool.length) break;
    if (buyer.squad.length >= 25 || buyer.budget < 50000) continue;
    const line = weakestLine(state, buyer);
    // un jeune reste un pari que tout club peut faire ; un joueur formé doit correspondre au standing du club
    const candidates = pool.filter(p => p.posLine === line && (p.age <= 21 || Math.abs(idealTierForOvr(p.ovr) - buyer.tier) <= 1));
    if (!candidates.length) continue;
    const buyerLgNat = (LEAGUES.find(l => l.id === buyer.league) || {}).nat;
    const worth = p => (p.age <= 21 ? (p.ovr + p.pot) / 2 : p.ovr) + countryAffinity(p.nat, buyerLgNat) / 30;
    candidates.sort((a, b) => worth(b) - worth(a));
    const target = candidates[0];
    target.club = buyer.id;
    target.contractUntil = seasonStartYear(state) + randInt(2, 4);
    target.wage = computeWage(target.value, buyer.tier);
    buyer.squad.push(target.id);
    pool = pool.filter(p => p !== target);
    state.freeAgents = (state.freeAgents || []).filter(id => id !== target.id);
    if (news && (isNewsworthy(state, target) || Math.random() < 0.1)) {
      news.push({ text: (target.seasonsPlayed || 0) > 0
        ? `${target.name}, libre, s'engage avec ${buyer.name}.`
        : `${target.name} signe son premier contrat professionnel avec ${buyer.name}.`, tag: 'transfert', playerId: target.id });
    }
  }
}

function checkRolePromises(state, news) {
  const EXPECTED_MINUTES = { titulaire: 900, rotation: 400, reserve: 0 };
  for (const p of Object.values(state.players)) {
    if (!p.rolePromise || p.retired) continue;

    const promise = p.rolePromise;
    p.rolePromise = null;
    if (p.club !== promise.clubId) continue; // parti entretemps : la promesse ne s'applique plus à sa situation actuelle
    const gained = (p.careerMinutes || 0) - promise.startMinutes;

    if (gained >= expected) {

      nudgeClubRelation(state, promise.clubId, 2, `Promesse de temps de jeu tenue pour ${p.name}`);

      p.loyalty = clamp((p.loyalty || 50) - 6, 0, 100);
      if (p.agentId === 'player') p.agentTrust = clamp((p.agentTrust ?? 50) - 8, 0, 100);
      nudgeClubRelation(state, promise.clubId, -5, `Promesse de temps de jeu non tenue pour ${p.name}`);

  }

function runAIClubSquadManagement(state, news, isMercato) {

const INJURY_TYPES = [
  { label: 'Blessure musculaire', minDur: 1, maxDur: 2, formHit: 8, relapse: 0.08 },

function updateFormMoraleInjuries(state, news, injuryReactionCandidates, recoveryReactionCandidates) {
  const monthNow = state.date.absMonth;

      const fatigueFactor = 1 + (p.fatigue || 0) / 140; // la fatigue accumulée augmente le risque de blessure
      const injRoll = Math.random();

        p.injuredUntil = monthNow + dur; p.injuryType = type.label;

        if (injuryReactionCandidates && state.agent.portfolio.includes(p.id)) injuryReactionCandidates.push({ playerId: p.id, playerName: p.name, injuryType: type.label, duration: dur });
      } else if (injRoll < 0.045 * proneness * fatigueFactor) {

        p.injuredUntil = monthNow + dur; p.injuryType = type.label;

      }

    // joueur qui ne joue plus depuis plusieurs mois voit sa cible de moral baisser en conséquence — jusqu'à -24
    // au bout de 4 mois sans la moindre minute, borné pour rester crédible plutôt que punitif. Un gros ego
    // supporte moins bien le banc qu'un joueur humble : la même absence de temps de jeu lui pèse davantage (V8).
    const egoMultiplier = 0.6 + (p.ego || 50) / 100; // 0.6 (ego bas) à 1.6 (ego très haut)

function monthlyClubFinances(state) {

    // le plafond suit légèrement la réputation : un club prestigieux peut viser un peu plus haut qu'un tier brut ne le suggère,

    // ça garde exactement la même propriété de stabilité à long terme, juste avec une composition plus riche et plus lisible.
    const cap = tierBudget(c.tier) * 6 * (0.6 + c.reputation / 100);

        const nm = genName(nat);

      p.agentId = ra.id; ra.portfolio.push(p.id);

// ---------- Offres entrantes pour les joueurs représentés ----------
function idealTierForOvr(ovr) {

  if (ovr >= 70) return 3;

function generateIncomingOffers(state, news) {
  state.incomingOffers = state.incomingOffers || [];

    for (const pid of state.agent.portfolio) {
      const p = state.players[pid];
      if (!p || p.retired) continue;
      if (Math.random() > (!p.club ? 0.22 : 0.12)) continue;
      const maxOffers = p.ovr >= 75 ? 2 : 1; // les joueurs très courtisés peuvent recevoir plusieurs offres à la fois
      if (state.incomingOffers.filter(o => o.playerId === pid).length >= maxOffers) continue;

      const takenClubs = state.incomingOffers.filter(o => o.playerId === pid).map(o => o.clubId);
      const candidates = Object.values(state.clubs).filter(c => c.id !== p.club && Math.abs(c.tier - idealTier) <= 1 && !takenClubs.includes(c.id));
      if (!candidates.length) continue;
      const buyer = choice(candidates);
      // joueur libre = aucune indemnité entre clubs (V8.3, audit P0-2) : il n'y a pas de club vendeur à dédommager
      const fee = p.club ? Math.max(50000, Math.round(p.value * (0.85 + Math.random() * 0.5) / 5000) * 5000) : 0;
      if (fee > buyer.budget * 1.3) continue;

      state.incomingOffers.push({ id: nextId(state, 'off'), playerId: pid, clubId: buyer.id, fee, wage, expires: state.date.absMonth + 2 });

  const cd = evaluateTransferCooldown(state, p);
  if (!cd.ok) { state.incomingOffers.splice(idx, 1); return { ok: false, reason: cd.reason }; }

  state.incomingOffers.splice(idx, 1);

function clubRelation(state, clubId) {

}
