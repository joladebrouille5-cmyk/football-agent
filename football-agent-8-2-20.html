// pour que l'avis affiché ici et le résultat d'une négociation réelle racontent la même histoire.
function computeInterestedClubs(state, player) {
  if (player.retired || !player.club) return [];
  const curClub = state.clubs[player.club];
  const candidates = [];
  for (const club of Object.values(state.clubs)) {
    if (club.id === player.club) continue;
    const tierGap = club.tier - curClub.tier;
    if (tierGap < -1 || tierGap > 2) continue; // reste plausible : ni un club sans rapport, ni une chute libre
    const outlook = estimatePlayingTimeOutlook(state, club, player);
    const affordable = clamp(1 - player.value / Math.max(club.budget, 1), -1, 1);
    const rel = clubRelation(state, club.id);
    const repEdge = (club.reputation || 50) - (curClub.reputation || 50);
    const score = Math.round(outlook * 34 + affordable * 22 + (rel - 50) / 2 + clamp(repEdge, -20, 20) * 0.4 + tierGap * 6);
    if (score <= 15) continue;
    const reasons = [];
    if (outlook > 0.6) reasons.push('Peu de concurrence à son poste dans cet effectif');
    if (affordable > 0.3) reasons.push('Le budget suit largement');
    if (rel > 65) reasons.push('Bonne relation avec votre agence');
    if (repEdge > 12) reasons.push('Un vrai pas en avant dans sa carrière');
    if (!reasons.length) reasons.push('Un profil qui correspond à leurs besoins');

  }

  const fee = p.club ? Math.max(50000, Math.round(p.value * (0.85 + Math.random() * 0.5) / 5000) * 5000) : 0;
  if (fee > club.budget * 1.3) return { ok: false, reason: `${club.name} botte en touche : le budget ne suit pas pour l'instant.` };
  const wage = Math.max(1500, Math.round(p.wage * (0.85 + Math.random() * 0.6) / 500) * 500);
  state.incomingOffers = state.incomingOffers || [];
  const offer = { id: nextId(state, 'off'), playerId: p.id, clubId: club.id, fee, wage, expires: state.date.absMonth + 2 };

  const last = (p.pitchLog || {})[clubId];

  const st = pitchStatus(state, p, clubId);

  if (!ic) return { ok: false, reason: `${club.name} n'a pas l'intention de recruter ${p.name}.` };

  if (player.lastRenewalMonth == null) return { ok: true };

function contractWageCeiling(state, club, player) {

  }

  }

  if (bonus > 0 && bonus > Math.max(0, club.budget) * 0.1) {

  }

    const newEnd = seasonStartYear(state) + (offer.years || 1);

function evaluateOffer(state, player, offer) {

  else if (offer.roleProm === 'reserve' && player.ambition > 55) { score -= 10 * egoFactor; reactions.push(`${player.name} veut plus de temps de jeu que ce rôle ne promet.`); }

    const curClub = player.club ? state.clubs[player.club] : null;
    const newClub = state.clubs[offer.targetClubId];
    const stepUp = curClub ? (newClub.tier - curClub.tier) : 1;
    if (offer.targetClubId === player.club) {
      // prolongation (bug V9.4 trouvé au diagnostic des renouvellements) : la loyauté pénalisait aussi une offre
      // venant du club ACTUEL — un joueur fidèle refusait de rester « parce qu'il reste attaché à son club ».
      // Pour une prolongation, c'est l'inverse : la fidélité aide.
      const loyaltyBonus = ((player.loyalty || 50) / 100) * 8;
      score += loyaltyBonus;
      if (loyaltyBonus > 5) reactions.push(`${player.name} tient à rester dans son club.`);
    } else {
      const loyaltyPenalty = ((player.loyalty || 50) / 100) * 14 * (stepUp <= 0 ? 1 : 0.3);
      score -= loyaltyPenalty;
      if (loyaltyPenalty > 6) reactions.push(`${player.name} reste attaché à son club actuel.`);
    }
    const rel = clubRelation(state, offer.targetClubId);
    score += (rel - 50) / 8;
    if (rel < 30) reactions.push(`Vos relations tendues avec ce club compliquent la négociation.`);
    else if (rel > 75) reactions.push(`Votre bonne relation avec ce club facilite les choses.`);
    // un joueur ambitieux se laisse davantage séduire par un club nettement plus prestigieux que le sien
    const repDelta = (newClub.reputation || 50) - (curClub ? (curClub.reputation || 50) : 50);
    score += clamp(repDelta / 8, -6, 10) * ((player.ambition || 50) / 70);
    if (repDelta > 15) reactions.push(`${player.name} est séduit par la réputation de ce club.`);
    // affinité culturelle (langue/histoire/proximité/climat) : un championnat familier rassure, un championnat
    // lointain freine un peu — jamais rédhibitoire seul, mais ça compte dans la balance globale
    const affinity = countryAffinity(player.nat, (LEAGUES.find(l => l.id === newClub.league) || {}).nat);
    score += (affinity - 40) / 12;
    if (affinity >= 65) reactions.push(`${player.name} se sent culturellement proche de ce championnat.`);
    else if (affinity <= 22) reactions.push(`${player.name} est peu familier avec la culture de ce championnat.`);
    // un joueur très attaché à ses racines (loyauté forte, ambition mesurée) peut refuser net une destination

      reactions.push(`${player.name} refuse catégoriquement : ce championnat est trop loin de ses racines.`);
    }
    // opportunités de temps de jeu : pèse surtout pour les jeunes et les ambitieux
    const outlook = estimatePlayingTimeOutlook(state, newClub, player);
    const outlookWeight = (0.5 + (player.ambition || 50) / 100) * (player.age <= 23 ? 1.4 : (player.age <= 28 ? 1.0 : 0.6));
    score += (outlook - 0.5) * 16 * outlookWeight;
    if (outlook < 0.3 && player.age <= 25) reactions.push(`${player.name} craint de manquer de temps de jeu dans cet effectif.`);
    else if (outlook > 0.75 && (player.ambition || 50) > 55) reactions.push(`${player.name} y voit une vraie opportunité de temps de jeu.`);
  }
  if (offer.commissionPct > 12) { score -= (offer.commissionPct - 12) * 1.5; reactions.push(`Le club juge votre commission excessive.`); }
  if ((offer.sellOnPct || 0) > 15) { score -= (offer.sellOnPct - 15) * 0.8; reactions.push(`Le pourcentage à la revente demandé fait hésiter le club acheteur.`); }

function applyAcceptedOffer(state, player, offer, news) {

  player.contractUntil = seasonStartYear(state) + offer.years;
  player.morale = clamp(player.morale + 10, 0, 100);
  const relClubId = offer.targetClubId || player.club;
  const relevantClub = relClubId ? state.clubs[relClubId] : null;
  if (relevantClub && offer.signingBonus) relevantClub.budget -= offer.signingBonus;
  const isTransfer = offer.targetClubId && offer.targetClubId !== player.club;
  if (isTransfer) {
    executeTransfer(state, player, state.clubs[offer.targetClubId], offer.fee || 0, news, { silent: false });

    if (isNewsworthy(state, player)) news.push({ text: `${player.name} prolonge à ${clubName(state, player)}.`, tag: 'contrat', playerId: player.id });
  }
  if (offer.releaseClause !== undefined) player.releaseClause = offer.releaseClause > 0 ? offer.releaseClause : null;

  // avec de vraies conséquences si elle n'est pas tenue — voir checkRolePromises().
  if (offer.roleProm && relClubId) {
    player.rolePromise = { type: offer.roleProm, clubId: relClubId, startMinutes: player.careerMinutes || 0, checkAt: state.date.absMonth + 4 };
  }
  if (player.agentId === 'player') {
    const commission = Math.round(offer.salary * offer.years * (offer.commissionPct / 100) * 0.3);

function registerRejectedOffer(state, player, offer) {

// croissants (salaire d'abord léger puis plus franc, durée, rôle, commission), le premier ajustement crédible
// qui ferait franchir le seuil d'acceptation. Rien n'est accepté d'office : seule une offre proche (score ≥ 30,
// zone « risqué » plutôt que « très improbable ») déclenche une recherche de contre-offre.
const ROLE_LABELS = { titulaire: 'Titulaire indiscutable', rotation: 'Rotation', reserve: 'Réserve / développement' };
function generateCounterOffer(state, player, offer) {
  const tries = [];

    for (const ss of [0, 0.08, 0.15, 0.25, 0.35, 0.5]) {
      for (const role of ['titulaire', 'rotation', 'reserve']) {
        const salary = Math.round((offer.salary * (1 + ss)) / 500) * 500;
        const commissionPct = ss > 0 ? Math.max(5, offer.commissionPct - 2) : offer.commissionPct;
        tries.push({
          candidate: { ...offer, salary, years: clamp((offer.years || 1) + ys, 1, 5), roleProm: role, commissionPct },
          cost: ss * 3 + ys + (role !== offer.roleProm ? 0.3 : 0),

  }
  tries.sort((a, b) => a.cost - b.cost);
  for (const t of tries) {
    const ev = evaluateOffer(state, player, t.candidate);
    if (ev.score >= 58 && evaluateNegotiationGate(state, player, t.candidate).ok) return { offer: t.candidate, ev };

// l'indemnité de transfert se règle entre les deux clubs, l'agent n'a pas la main dessus (il gère le contrat du joueur)
function estimateTransferFee(player, buyerClub) {
  if (!player || !player.club || !buyerClub) return 0; // joueur libre = aucune indemnité entre clubs
  return Math.max(30000, Math.round(player.value * (0.95 + rand(0, 0.25)) / 5000) * 5000);

// ---------- Recherche de clubs intéressés (selon le pays rêvé par le joueur) ----------
// Score d'attractivité d'un club pour un joueur donné : combine niveau (proximité de tier), réputation,
// affinité culturelle (langue/histoire/proximité/climat condensés dans COUNTRY_AFFINITY) et opportunités de
// temps de jeu — les 6 dimensions demandées (langue, culture, climat, proximité, réputation, niveau,
// opportunités) sans dupliquer la logique entre transfert et prêt : une seule fonction, deux appelants.
function scoreClubForPlayer(state, p, c, idealTier, opts) {
  opts = opts || {};
  const lgNat = (LEAGUES.find(l => l.id === c.league) || {}).nat;
  const affinity = countryAffinity(p.nat, lgNat);
  const ambitionWeight = (p.ambition || 50) / 100;
  const outlook = estimatePlayingTimeOutlook(state, c, p);
  return -Math.abs(c.tier - idealTier) * 2
    + (affinity / 100) * 3.5
    + ((c.reputation || 50) / 40) * ambitionWeight
    + outlook * (opts.outlookWeight === undefined ? 2 : opts.outlookWeight)

function pickInterestedClubs(state, p, idealTier, n, opts) {
  const eligible = Object.values(state.clubs).filter(c => c.id !== p.club && Math.abs(c.tier - idealTier) <= 1);
  return eligible
    .map(c => ({ c, s: scoreClubForPlayer(state, p, c, idealTier, opts) }))
    .sort((a, b) => b.s - a.s)
    .slice(0, n)
    .map(x => x.c);
}
function findInterestedClubs(state, playerId) {
  const p = state.players[playerId];
  if (!p) return [];
  const idealTier = idealTierForOvr(p.ovr);
  const clubs = pickInterestedClubs(state, p, idealTier, 4);
  const repBonus = 1 + state.agent.reputation / 500;
  const offers = [];
  for (const c of clubs) {
    const fee = p.club ? Math.max(30000, Math.round(p.value * (0.75 + Math.random() * 0.6) * repBonus / 5000) * 5000) : 0;
    if (fee > c.budget * 1.5) continue;
    const wage = Math.max(1500, Math.round(p.wage * (0.85 + Math.random() * 0.6) / 500) * 500);
    offers.push({ clubId: c.id, fee, wage });
  }
  return offers;
}

// ---------- Prêts ----------
function findLoanClubs(state, playerId) {
  const p = state.players[playerId];
  if (!p || !p.club) return [];
  const idealTier = clamp(idealTierForOvr(p.ovr) - 1, 1, 5); // un prêt vise en général un cran plus bas, pour du temps de jeu garanti
  // pour un prêt, le temps de jeu garanti est LE critère (davantage que pour un transfert définitif)
  const clubs = pickInterestedClubs(state, p, idealTier, 4, { outlookWeight: 4 });
  return clubs.map(c => ({ clubId: c.id, durationMonths: choice([6, 11]) }));
}
function executeLoan(state, playerId, clubId, durationMonths, news) {
  const p = state.players[playerId];
  const dest = state.clubs[clubId];
  if (!p || !dest) return { ok: false };
  if (!p.club) return { ok: false, reason: 'Ce joueur est libre : passez par un transfert classique.' };
  if (p.parentClub) return { ok: false, reason: 'Ce joueur est déjà en prêt.' };
  // même garde-fou anti-spam que pour les transferts (V8.2, chasse aux exploits) : sans ça, un joueur tout
  // juste transféré pouvait être immédiatement reprêté ailleurs pour encaisser une deuxième commission.
  const cd = evaluateTransferCooldown(state, p);
  if (!cd.ok) return { ok: false, reason: cd.reason };
  const parentClubId = p.club;
  const parent = state.clubs[parentClubId];
  const loanFee = Math.max(5000, Math.round(p.value * 0.03 / 1000) * 1000);
  // le prêt est un vrai transfert d'argent entre clubs désormais, pas une création monétaire gratuite (V8, chasse
  // aux exploits) : un club qui n'a pas les moyens de la payer, même symboliquement, ne peut pas signer le prêt.
  if (dest.budget < loanFee) return { ok: false, reason: `${dest.name} n'a pas les moyens de financer ce prêt.` };
  if (parent) parent.squad = parent.squad.filter(id => id !== p.id);
  p.parentClub = parentClubId;
  p.club = clubId;
  p.loanUntil = state.date.absMonth + durationMonths;
  p.loanStartMinutes = p.careerMinutes || 0; // référence pour juger la réussite du prêt à son terme (V8)
  p.lastTransferMonth = state.date.absMonth; // V8.2, chasse aux exploits : voir evaluateTransferCooldown
  dest.squad.push(p.id);
  dest.budget -= loanFee;
  if (parent) parent.budget += dampedClubIncome(parent, loanFee);
  if (p.agentId === 'player') {
    const commission = Math.round(loanFee * 0.15 + p.wage * 0.5);
    state.agent.cash += commission;
    state.agent.careerStats.totalCommissions += commission;
  }
  if (news) news.push({ text: `${p.name} est prêté à ${dest.name} pour ${durationMonths >= 10 ? 'la saison' : durationMonths + ' mois'}.`, tag: 'mercato', playerId: p.id });
  return { ok: true };
}
function checkLoanReturns(state, news) {
  for (const p of Object.values(state.players)) {
    if (p.retired || !p.parentClub || !p.loanUntil) continue;
    if (p.loanUntil <= state.date.absMonth) {
      const loanClub = p.club ? state.clubs[p.club] : null;
      const parent = state.clubs[p.parentClub];
      // évalue comment le prêt s'est vraiment passé, à partir des minutes obtenues chez le club d'accueil (V8,
      // "prêts beaucoup plus vivants") : ça donne un vrai sens à "réussite du prêt = impact sur valeur/réputation"
      // plutôt qu'un retour silencieux qui ne change jamais rien.
      const gained = (p.careerMinutes || 0) - (p.loanStartMinutes || 0);
      const verdict = gained >= 500 ? 'réussi' : (gained < 150 ? 'raté' : 'mitigé');
      let offerNews = false;
      if (verdict === 'réussi') {
        p.value = Math.round(p.value * 1.06);
        p.morale = clamp(p.morale + 6, 0, 100);
        if (p.agentId === 'player') gainReputation(state, 1);
        // séduit par le prêt, le club d'accueil peut vouloir le conserver pour de bon — passe par le circuit
        // normal des offres entrantes, comme n'importe quelle autre proposition de transfert.
        if (loanClub && p.agentId === 'player' && Math.random() < 0.45) {
          const fee = Math.max(50000, Math.round(p.value * (0.8 + Math.random() * 0.4) / 5000) * 5000);
          if (fee <= loanClub.budget * 1.3) {
            state.incomingOffers = state.incomingOffers || [];
            state.incomingOffers.push({ id: nextId(state, 'off'), playerId: p.id, clubId: loanClub.id, fee, wage: p.wage, expires: state.date.absMonth + 3 });
            news.push({ text: `Séduit par son prêt réussi, ${loanClub.name} propose de conserver ${p.name} définitivement.`, tag: 'mercato', playerId: p.id });
            offerNews = true;
          }
        }
      } else if (verdict === 'raté') {
        p.morale = clamp(p.morale - 6, 0, 100);
      }
      if (loanClub) loanClub.squad = loanClub.squad.filter(id => id !== p.id);
      p.club = p.parentClub;
      p.parentClub = null;
      p.loanUntil = null;
      p.loanStartMinutes = null;
      if (parent) parent.squad.push(p.id);
      if (!offerNews && isNewsworthy(state, p)) news.push({ text: `${p.name} termine son prêt (${verdict}) et retourne à ${parent ? parent.name : 'son club'}.`, tag: 'mercato', playerId: p.id });
    }
  }
}
function runAIClubLoans(state, news, isMercato) {
  if (!isMercato) return;
  let attempts = 8;
  for (const club of Object.values(state.clubs)) {
    if (attempts <= 0) break;
    if (club.squad.length < 20) continue; // seulement les effectifs bien fournis prêtent des joueurs
    const surplus = club.squad.map(id => state.players[id]).filter(p => p && !p.parentClub && p.age <= 21 && (p.seasonStats.apps || 0) < 5 && p.agentId !== 'player');
    if (!surplus.length) continue;
    const p = choice(surplus);
    const candidates = Object.values(state.clubs).filter(c => c.id !== club.id && c.tier <= Math.max(1, club.tier - 1));
    if (!candidates.length) continue;
    const dest = choice(candidates);
    executeLoan(state, p.id, dest.id, choice([6, 11]), attempts <= 2 ? news : null); // limite le bruit dans les actualités
    attempts--;
  }
}

// ---------- Agence ----------
const STAFF_TYPES = [
  { id: 'scouts', label: 'Recruteurs', cost: 40000, effect: 'Scouting plus précis et plus rapide' },
  { id: 'avocats', label: 'Avocats', cost: 60000, effect: 'Sécurise les négociations complexes' },
  { id: 'negociateurs', label: 'Négociateurs', cost: 70000, effect: 'Améliore le taux de réussite en négociation' },
  { id: 'analystes', label: 'Analystes', cost: 50000, effect: 'Repère les jeunes à fort potentiel' },
  { id: 'communicants', label: 'Communicants', cost: 45000, effect: 'Accélère le gain de réputation' },
];
const OFFICE_LEVELS = [
  // loyer mensuel (V9.4) : sans lui, la trésorerie ne faisait que monter (343 k€ → 4,7 M€ en 10 saisons testées)
  // et rien ne pesait sur la décision d'agrandir l'agence. Calé pour qu'un palier se rembourse avec un portefeuille
  // à sa mesure, pas avec trois joueurs.
  { level: 1, label: 'Petit bureau', cost: 0, cap: 3, rent: 2000 },
  { level: 2, label: 'Agence nationale', cost: 300000, cap: 6, rent: 8000 },
  { level: 3, label: 'Agence européenne', cost: 1200000, cap: 11, rent: 25000 },
  { level: 4, label: 'Agence internationale', cost: 5000000, cap: 18, rent: 70000 },
  { level: 5, label: 'Empire mondial', cost: 20000000, cap: 30, rent: 200000 },
];
function hireStaff(state, staffId) {
  const meta = STAFF_TYPES.find(s => s.id === staffId);
  if (!meta) return { ok: false };
  const totalStaff = Object.values(state.agent.staff).reduce((a, b) => a + b, 0);
  const cap = state.agent.officeLevel * 4;
  if (totalStaff >= cap) return { ok: false, reason: 'Capacité de bureau atteinte, agrandissez votre agence.' };
  if (state.agent.cash < meta.cost) return { ok: false, reason: 'Budget insuffisant.' };
  state.agent.cash -= meta.cost;
  state.agent.staff[staffId] = (state.agent.staff[staffId] || 0) + 1;
  return { ok: true };
}
function upgradeOffice(state) {
  const next = OFFICE_LEVELS[state.agent.officeLevel];
  if (!next) return { ok: false, reason: 'Niveau maximum atteint.' };

// Progression annuelle (V9.4, audit « trajectoire » + test de 10 saisons) : mesuré en navigateur, le niveau du

// que la vraie progression s'arrêtait à 23 ans et qu'un jeune sans 15 matchs ne progressait plus qu'au tiers — or
// un gamin de 16 ans joue rarement en équipe première : les jeunes générés plafonnaient vers 51 à 22 ans et ne
// remplaçaient jamais la génération de départ. Désormais : maturation jusqu'à 24 ans puis éclosion possible

  const club = p.club ? state.clubs[p.club] : null;
  const envBonus = club ? (club.tier - 3) * 0.04 : -0.1; // meilleur encadrement dans un grand club ; sans club, on stagne
  const mult = clamp(1 + formBonus + moraleBonus + envBonus, 0.3, 1.8);
  if (p.age <= 24 && gap > 0) {
    // jusqu'à 19 ans, le centre de formation fait progresser même sans temps de jeu en équipe première ; après,
    // le temps de jeu redevient décisif, avec une pente douce plutôt qu'un couperet à 15 matchs.
    const playFactor = playedEnough ? 1 : (p.age <= 19 ? 0.8 : clamp(0.35 + apps / 30, 0.35, 0.85));
    const base = gap * (0.12 + p.consistency * 0.16);
    const step = Math.round(base * playFactor * (0.6 + Math.random() * 0.8) * mult);
    p.ovr = clamp(p.ovr + Math.max(playedEnough || p.age <= 19 ? 1 : 0, step), p.ovr, p.pot);
  } else if (p.age <= 27 && gap > 0 && (playedEnough || apps >= 8)) {
    // éclosion tardive : encore une vraie marge entre 25 et 27 ans pour qui joue
    const step = Math.round(gap * (0.10 + p.consistency * 0.10) * (playedEnough ? 1 : 0.5) * (0.6 + Math.random() * 0.8) * mult);
    p.ovr = clamp(p.ovr + Math.max(1, step), p.ovr, p.pot);
  } else if (p.age <= 29) {
    if (gap > 0 && playedEnough && Math.random() < clamp(0.35 + formBonus, 0.1, 0.75)) {
      p.ovr = clamp(p.ovr + randInt(1, 2), p.ovr, p.pot);
    } else if (!playedEnough && Math.random() < 0.15) {

    }

    const declineBase = p.age >= 33 ? rand(1.5, 4) : rand(0.3, 1.8);

    p.ovr = clamp(Math.round(p.ovr - declineBase - extra), 28, 99);

}

// ---------- Récompenses individuelles de fin de saison (Ballon d'Or, Soulier d'Or...) ----------
// Statut de carrière (V8, priorité 4) : une trajectoire lisible plutôt qu'un simple nombre d'OVR qui monte —
// Prospect → Espoir → Joueur de rotation → Titulaire → Star → Superstar → Légende vivante. Calculé à la volée
// (jamais sauvegardé comme tel : seul le dernier statut connu l'est, pour détecter les vraies bascules).
const CAREER_STATUS_ORDER = ['Prospect', 'Espoir', 'Joueur de rotation', 'Titulaire', 'Star', 'Superstar', 'Légende vivante'];
function computeCareerStatus(p) {
  if (p.retired) return 'Retraité';

  const notable = (p.collectiveTitles || 0) + (p.individualAwards || 0) * 2;

  if (p.ovr >= 80 || notable >= 8) return 'Superstar';
  if (p.ovr >= 73 || notable >= 4) return 'Star';
  if (p.ovr >= 60) return 'Titulaire';
  if (p.age <= 21) return 'Prospect';
  if (p.age <= 25) return 'Espoir';

}
// Détecte les vraies bascules de trajectoire en fin de saison et leur donne une vraie conséquence (V8) : une

// écho médiatique — pas seulement dans un OVR qui a gagné deux points en silence.

  for (const p of Object.values(state.players)) {

    const status = computeCareerStatus(p);
    const prev = p.lastStatus;
    p.lastStatus = status;
    if (!prev || prev === status) continue;
    const prevRank = CAREER_STATUS_ORDER.indexOf(prev);
    const rank = CAREER_STATUS_ORDER.indexOf(status);
    if (prevRank < 0 || rank < 0) continue; // statut 'Retraité' ou transition non suivie : pas de réaction
    // seules les bascules touchant les tiers établis (Titulaire et au-delà) sont de vraies nouvelles : passer
    // d'Espoir à Joueur de rotation en vieillissant sans progresser n'est ni une promotion ni un vrai décrochage.
    if (rank > prevRank && rank >= 3) {

      p.value = Math.round(p.value * 1.05);
      if (p.agentId === 'player') gainReputation(state, 1.5);

    } else if (rank < prevRank && prevRank >= 3 && isNewsworthy(state, p)) {
      // décrochage net (blessures répétées, banc prolongé...) : ça laisse une trace dans les médias aussi
      news.push({ text: `${p.name} décroche : son statut retombe à ${status.toLowerCase()} après une saison compliquée.`, tag: 'carriere', playerId: p.id });
    }
  }
}
function computeSeasonAwards(state, news) {

  if (!pool.length) return;

    }
    news.push({ text: `${title} ${seasonLabel(state)} : ${p.name} !`, tag: 'ballondor', playerId: p.id });
  }
  const poty = pool.slice().sort((a, b) => scorePOTY(b) - scorePOTY(a))[0];

  const scorers = pool.filter(p => p.pos !== 'GK').sort((a, b) => (b.seasonStats.goals || 0) - (a.seasonStats.goals || 0));
  if (scorers[0] && (scorers[0].seasonStats.goals || 0) > 0) crown(scorers[0], "Soulier d'Or");

  if (keepers[0]) crown(keepers[0], "Gant d'Or");

}

function applyPromotionRelegation(state, news) {

    const topRanked = [...topLg.clubIds].sort((a, b) => rankCompare(state.clubs[a].table, state.clubs[b].table));
    const botRanked = [...botLg.clubIds].sort((a, b) => rankCompare(state.clubs[a].table, state.clubs[b].table));
    const relegated = topRanked.slice(-pair.n);
    const promoted = botRanked.slice(0, pair.n);
    topLg.clubIds = topRanked.slice(0, topRanked.length - pair.n).concat(promoted);
    botLg.clubIds = botRanked.slice(pair.n).concat(relegated);
    for (const id of relegated) {
      state.clubs[id].league = pair.bottom;
      news.push({ text: `${state.clubs[id].name} relégué en ${botLg.name}.`, tag: 'relegation', clubId: id });
    }

      state.clubs[id].league = pair.top;
      news.push({ text: `${state.clubs[id].name} monte en ${topLg.name} !`, tag: 'promotion', clubId: id });
    }
  }
}

const EURO_QUALIFY_SLOTS = { PL: 7, LIGA: 7, SA: 6, BL: 6, L1: 6 }; // 32 places, réparties selon le prestige des championnats
function qualifyForEurope(state) {

  const sorted = qualified.map(id => state.clubs[id]).sort((a, b) => b.tier - a.tier || Math.random() - 0.5);
  const groups = Array.from({ length: 8 }, () => []);
  sorted.forEach((c, i) => {
    const round = Math.floor(i / 8);

  // des clubs/championnats en fin de saison, avant que la campagne suivante n'écrase ces données) ;

    p.careerMinutes = (p.careerMinutes || 0) + mins;
    p.monthsSinceLastMatch = 0;
    const ratingBase = 6.0 + (goalsFor - goalsAgainst) * 0.15 + (Math.random() - 0.5) * 1.2 + (p.form - 50) / 120;
    p.seasonStats.ratingSum += clamp(ratingBase, 3, 10);
  }
  if (outfield.length) {
    const scorers = weightedPickMany(outfield, goalsFor, p => (p.posLine === 'FW' ? 3 : p.posLine === 'MF' ? 1.4 : 0.3) * (p.ovr / 70));
    for (const scorer of scorers) {
      scorer.seasonStats.goals = (scorer.seasonStats.goals || 0) + 1;
      scorer.careerGoals++;
      checkRecord(state, 'topScorer', scorer, scorer.careerGoals);
      const passer = weightedPickOne(outfield.filter(p => p !== scorer), p => (p.posLine === 'MF' ? 2 : p.posLine === 'FW' ? 1.2 : 0.5) * (p.ovr / 70));
      if (passer && Math.random() < 0.72) {
        passer.seasonStats.assists = (passer.seasonStats.assists || 0) + 1;
        passer.careerAssists++;
        checkRecord(state, 'topAssists', passer, passer.careerAssists);
      }
    }
  }
  if (gk) {
    gk.seasonStats.saves = (gk.seasonStats.saves || 0) + Math.max(0, Math.round(goalsAgainst * 1.3 + rand(0, 3)));
    gk.seasonStats.ga = (gk.seasonStats.ga || 0) + goalsAgainst;
    if (goalsAgainst === 0) { gk.seasonStats.cs = (gk.seasonStats.cs || 0) + 1; gk.careerCS = (gk.careerCS || 0) + 1; checkRecord(state, 'topCleanSheets', gk, gk.careerCS); }
  }
}
function simulateEuroMatch(state, homeId, awayId) {
  const home = state.clubs[homeId], away = state.clubs[awayId];
  if (!home || !away) return null;
  const H = squadStrength(state, home), A = squadStrength(state, away);
  const xgHome = clamp(1.2 + (H.attack - A.defense) / 16 + 0.1, 0.15, 4.2);
  const xgAway = clamp(1.15 + (A.attack - H.defense) / 16, 0.1, 4.0);
  const goalsHome = poissonSample(xgHome), goalsAway = poissonSample(xgAway);
  applyEuroStatsOnly(state, H.xi, goalsHome, goalsAway);
  applyEuroStatsOnly(state, A.xi, goalsAway, goalsHome);
  return { goalsHome, goalsAway };
}
function advanceEuropeMonth(state, news, month) {
  const eu = state.europe;
  if (!eu || eu.stage === 'none' || eu.stage === 'done') return;
  if (eu.stage === 'groups') {
    const due = eu.fixtures.filter(f => f.month === month && !f.played);
    for (const f of due) {
      const res = simulateEuroMatch(state, f.home, f.away);
      if (!res) continue;
      f.played = true; f.scoreHome = res.goalsHome; f.scoreAway = res.goalsAway;
      const th = eu.table[f.home], ta = eu.table[f.away];
      th.mj++; ta.mj++; th.bp += res.goalsHome; th.bc += res.goalsAway; ta.bp += res.goalsAway; ta.bc += res.goalsHome;
      if (res.goalsHome > res.goalsAway) { th.v++; th.pts += 3; ta.d++; }
      else if (res.goalsHome < res.goalsAway) { ta.v++; ta.pts += 3; th.d++; }
      else { th.n++; ta.n++; th.pts++; ta.pts++; }
    }
    if (month === 11 && due.length >= 0) {
      const qualifiers = [];
      eu.groups.forEach(g => {
        const ranked = [...g].sort((a, b) => rankCompare(eu.table[a], eu.table[b]));
        qualifiers.push(ranked[0], ranked[1]);
        ranked.slice(2).forEach(id => { eu.eliminatedAt[id] = 'groupes'; });
      });
      eu.stage = 'r16';
      eu.bracket = { round: 'r16', ties: seedKnockout(qualifiers, eu.groups) };
      news.push({ text: `Phase de groupes de la Ligue des Champions terminée : 16 clubs qualifiés pour les 8es de finale.`, tag: 'trophee' });
    }
  } else {
    const roundMonth = { r16: 2, qf: 3, sf: 4, final: 5 }[eu.stage];
    if (month !== roundMonth || !eu.bracket) return;
    const winners = [];
    let finalLoser = null;
    for (const tie of eu.bracket.ties) {
      const res = simulateEuroMatch(state, tie[0], tie[1]);
      if (!res) continue;
      let winner, loser;
      if (res.goalsHome === res.goalsAway) { winner = Math.random() < 0.5 ? tie[0] : tie[1]; }
      else winner = res.goalsHome > res.goalsAway ? tie[0] : tie[1];
      loser = winner === tie[0] ? tie[1] : tie[0];
      winners.push(winner);
      finalLoser = loser;
      eu.eliminatedAt[loser] = eu.stage; // le stade où ce club vient de sortir (r16/qf/sf), ou 'sf' pour le finaliste malheureux ci-dessous
      // une vraie surprise mérite d'être racontée à part (V8, "gros matchs et surprises") plutôt que de se noyer
      // dans une ligne générique de qualification — un cador tombe, ça se sait.
      const wc = state.clubs[winner], lc = state.clubs[loser];
      if (wc && lc && (lc.tier - wc.tier) >= 2) {
        news.push({ text: `Sensation en Ligue des Champions : ${wc.name} élimine ${lc.name} !`, tag: 'trophee', clubId: wc.id });
      }
    }
    if (eu.stage === 'final') {
      const championId = winners[0];
      const champ = state.clubs[championId];
      if (champ) {
        champ.euroTitlesWon = (champ.euroTitlesWon || 0) + 1;
        champ.budget += dampedClubIncome(champ, 35000000);
        for (const pid of champ.squad) {
          const p = state.players[pid]; if (!p) continue;
          p.trophies.push({ season: seasonLabel(state), title: 'Vainqueur Ligue des Champions' });
          p.collectiveTitles = (p.collectiveTitles || 0) + 1;
          checkRecord(state, 'mostTitles', p, p.collectiveTitles);
          if (p.agentId === 'player') { state.agent.careerStats.titlesWonAsAgent = (state.agent.careerStats.titlesWonAsAgent || 0) + 1; gainReputation(state, 3); }
        }
        news.push({ text: `${champ.name} remporte la Ligue des Champions !`, tag: 'trophee', clubId: champ.id });
        if (finalLoser && state.clubs[finalLoser]) { const fl = state.clubs[finalLoser]; fl.budget += dampedClubIncome(fl, 18000000); }
      }
      // l'Europe comme accélérateur de carrière (V8) : un jeune qui brille en finale devient une cible de choix
      // pour les grands clubs — pas seulement un chiffre de plus dans ses statistiques de saison.
      const finalistIds = [championId, finalLoser].filter(Boolean);
      const breakoutCandidates = [];
      for (const cid of finalistIds) {
        const c = state.clubs[cid]; if (!c) continue;
        for (const pid of c.squad) {
          const p = state.players[pid];
          if (p && !p.retired && p.age <= 23 && p.ovr >= 68) breakoutCandidates.push(p);
        }
      }
      if (breakoutCandidates.length) {
        const breakout = weightedChoice(breakoutCandidates, p => p.ovr);
        breakout.value = Math.round(breakout.value * 1.12);
        if (breakout.agentId === 'player') gainReputation(state, 2);
        news.push({ text: `${breakout.name} explose aux yeux du monde entier après cette finale de Ligue des Champions.`, tag: 'carriere', playerId: breakout.id });
        if (breakout.agentId === 'player' && Math.random() < 0.5) {
          const suitors = Object.values(state.clubs).filter(c => c.tier === 5 && !c.squad.includes(breakout.id));
          if (suitors.length) {
            const suitor = weightedChoice(suitors, c => c.reputation || 50);
            const fee = Math.max(200000, Math.round(breakout.value * (0.9 + Math.random() * 0.5) / 5000) * 5000);
            if (fee <= suitor.budget * 1.3) {
              state.incomingOffers = state.incomingOffers || [];
              state.incomingOffers.push({ id: nextId(state, 'off'), playerId: breakout.id, clubId: suitor.id, fee, wage: breakout.wage, expires: state.date.absMonth + 3 });
              news.push({ text: `${suitor.name} passe à l'attaque pour ${breakout.name} après sa performance européenne.`, tag: 'mercato', playerId: breakout.id });
            }
          }
        }
      }
      eu.stage = 'done'; eu.champion = championId;
    } else {
      const nextStage = { r16: 'qf', qf: 'sf', sf: 'final' }[eu.stage];
      eu.bracket = { round: nextStage, ties: pairUp(winners) };
      eu.stage = nextStage;
      news.push({ text: `${winners.length} clubs qualifiés pour ${roundLabel(nextStage)} de la Ligue des Champions.`, tag: 'trophee' });
    }
  }
}

// Réputation de fin de saison : cette fonction DOIT être appelée avant que les tableaux de championnat ne soient
// remis à zéro et avant qu'initEuropeSeason() n'écrase state.europe (elle lit encore le parcours européen qui
// vient de s'achever). Elle ne remplace pas le tier (gabarit de génération initiale, jamais modifié) : elle
// ajoute une couche vivante par-dessus, qui elle peut monter ou descendre saison après saison.
function updateClubAndLeagueReputation(state, news) {
  // moyenne mondiale de valeur d'effectif, utilisée comme référence (l'éventail des valeurs reste volontairement
  // resserré dans le moteur économique, donc ce signal sert de modificateur fin, pas de base : voir tierBase ci-dessous)
  let totalValue = 0, totalClubs = 0;
  for (const c of Object.values(state.clubs)) {
    totalValue += c.squad.reduce((s, pid) => s + (state.players[pid] ? state.players[pid].value : 0), 0);
    totalClubs++;
  }
  const globalAvgValue = totalClubs ? totalValue / totalClubs : 1;
  const euro = state.europe || {};
  const euroBonusFor = (clubId) => {
    if (euro.champion === clubId) return 16;
    const st = euro.eliminatedAt && euro.eliminatedAt[clubId];
    return { final: 10, sf: 6, qf: 3, r16: 1.5, groupes: 0.5 }[st] || 0;
  };
  const bigDrops = []; // pour signaler en actu les chutes de réputation marquantes (grand club qui décline)
  for (const c of Object.values(state.clubs)) {
    if (c.reputation === undefined) initClubEconomy(c);
    const prevRep = c.reputation;
    const clubIds = state.leagues[c.league] ? state.leagues[c.league].clubIds : [c.id];
    const ranked = [...clubIds].sort((a, b) => rankCompare(state.clubs[a].table, state.clubs[b].table));
    const rank = ranked.indexOf(c.id);
    const n = clubIds.length;
    const posScore = n > 1 ? (1 - rank / (n - 1)) : 1; // 1 = champion de sa division, 0 = lanterne rouge
    const squadValue = c.squad.reduce((s, pid) => s + (state.players[pid] ? state.players[pid].value : 0), 0);
    const relValue = clamp(squadValue / (globalAvgValue || 1), 0.1, 3);
    const valueScore = clamp((relValue - 0.1) / 2.9, 0, 1);
    // le tier reste l'ancre de prestige historique (stable, jamais réécrit) : la réputation oscille AUTOUR de cette
    // ancre selon la forme sportive et financière du moment, plutôt que d'être recalculée de zéro chaque saison.
    // Ça évite qu'un promu de tier 1 qui termine 1er de sa (faible) division dépasse artificiellement un tier 5
    // qui vient de vivre une saison moyenne dans un championnat autrement plus relevé — tout en laissant une vraie
    // trajectoire multi-décennies possible : un déclin ou une ascension durables finissent par déplacer l'ancre elle-même.
    const tierBase = 15 + c.tier * 15; // 30 (tier1) .. 90 (tier5)
    const perfModifier = (posScore - 0.5) * 24; // ±12 selon la position dans SA division
    const valueModifier = (valueScore - 0.5) * 16; // ±8 selon la valeur d'effectif face à la moyenne mondiale
    const target = clamp(tierBase + perfModifier + valueModifier + euroBonusFor(c.id), 4, 99);
    // lissage lent (12% de la cible par saison) : la réputation dérive progressivement, jamais par à-coups,
    // et un déclin ou une ascension réels prennent des dizaines de saisons à s'installer — comme dans la réalité.
    c.reputation = clamp(Math.round((prevRep * 0.88 + target * 0.12) * 10) / 10, 4, 99);
    if (prevRep - c.reputation >= 6 && prevRep >= 55) bigDrops.push(c);
    c.history = c.history || [];
    c.history.push({ s: seasonLabel(state), v: Math.round(squadValue), b: Math.round(c.budget), r: c.reputation, pos: rank + 1 });
    if (c.history.length > 30) c.history.shift(); // fenêtre glissante : garde le monde infini sans gonfler la sauvegarde
  }
  for (const lg of Object.values(state.leagues)) recomputeLeagueReputation(state, lg);
  // les places européennes des 5 grands championnats suivent désormais leur réputation, comme un vrai coefficient :
  // un championnat qui monte en puissance gagne des places l'année suivante, un championnat qui décline en perd.
  const bigFive = ['PL', 'LIGA', 'SA', 'BL', 'L1'].filter(id => state.leagues[id]);
  if (bigFive.length) {
    const total = 32, minSlots = 4;
    const reps = bigFive.map(id => Math.max(1, state.leagues[id].reputation));
    const sumRep = reps.reduce((a, b) => a + b, 0);
    const slots = bigFive.map((id, i) => Math.max(minSlots, Math.round(total * reps[i] / sumRep)));
    let diff = total - slots.reduce((a, b) => a + b, 0);
    for (let idx = 0; diff !== 0 && idx < 200; idx++) {
      const i = idx % slots.length;
      if (diff > 0) { slots[i]++; diff--; }
      else if (slots[i] > minSlots) { slots[i]--; diff++; }
    }
    state.euroSlots = {};
    bigFive.forEach((id, i) => { state.euroSlots[id] = slots[i]; });
  }
  for (const c of bigDrops.slice(0, 2)) {
    news.push({ text: `${c.name} inquiète ses supporters : sa réputation s'effrite après une saison décevante.`, tag: 'finance', clubId: c.id });
  }
}

function processEndOfSeason(state, news) {
  const summary = { label: seasonLabel(state), champions: {}, retiredCount: 0, newYouth: 0 };
  const seasonStart = state.agent.seasonStartStats || { commissions: 0, transfersDone: 0 };
  summary.seasonCommissions = (state.agent.careerStats.totalCommissions || 0) - seasonStart.commissions;
  summary.seasonTransfers = (state.agent.careerStats.transfersDone || 0) - seasonStart.transfersDone;
  for (const lg of Object.values(state.leagues)) {
    const ranked = [...lg.clubIds].sort((a, b) => rankCompare(state.clubs[a].table, state.clubs[b].table));
    const championId = ranked[0];
    const champ = state.clubs[championId];
    if (champ) {
      champ.titlesWon = (champ.titlesWon || 0) + 1;
      summary.champions[lg.id] = { clubId: championId, clubName: champ.name };
      news.push({ text: `${champ.name} sacré champion de ${lg.name} !`, tag: 'trophee', clubId: champ.id });
      for (const pid of champ.squad) {
        const p = state.players[pid]; if (!p) continue;
        p.trophies.push({ season: seasonLabel(state), title: `Champion ${lg.name}` });
        p.collectiveTitles = (p.collectiveTitles || 0) + 1;
        checkRecord(state, 'mostTitles', p, p.collectiveTitles);
        if (p.agentId === 'player') state.agent.careerStats.titlesWonAsAgent = (state.agent.careerStats.titlesWonAsAgent || 0) + 1;
      }
    }
  }
  updateClubAndLeagueReputation(state, news);
  decayRivalries(state);
  computeSeasonAwards(state, news);
  applyPromotionRelegation(state, news);
  initEuropeSeason(state, news);
  for (const c of Object.values(state.clubs)) c.table = emptyTableRow();
  summary.portfolioReport = [];
  for (const p of Object.values(state.players)) {
    if (p.retired) continue;
    const appsThisSeason = p.seasonStats.apps || 0; // capturé avant archivage (qui réinitialise les stats de saison)
    const isMine = p.agentId === 'player';
    const ovrBefore = p.ovr;
    archiveSeason(state, p);
    p.age++;
    growOrDecline(state, p, appsThisSeason);
    const justRetired = maybeRetire(state, p);
    if (justRetired) summary.retiredCount++;
    // le bilan de fin de saison (V9.0, immersion) porte sur les joueurs de l'agence : ce que chacun a montré
    // cette saison, sans avoir à rouvrir chaque fiche une par une.
    if (isMine) {
      summary.portfolioReport.push({
        playerId: p.id, name: p.name, pos: p.pos, posLine: p.posLine, club: p.club,
        ovrBefore, ovrAfter: p.ovr, entry: p.career[p.career.length - 1] || null, retired: !!justRetired,
      });
    }
  }
  // appelé APRÈS croissance/déclin (growOrDecline) : la valeur vient d'y être recalculée à partir du nouvel OVR,
  // et le petit bonus de promotion ci-dessous doit s'appliquer par-dessus cette valeur fraîche, pas être écrasé
  // par elle — placé avant, il n'avait strictement aucun effet, la valeur étant réécrite juste après.
  checkCareerStatusChanges(state, news);
  const targetPop = Object.keys(state.clubs).length * 23;
  const clubPop = Object.values(state.clubs).reduce((s, c) => s + c.squad.length, 0);
  let toGenerate = clamp(targetPop - clubPop, 0, 400);
  for (let i = 0; i < toGenerate; i++) {
    const club = pickClubNeedingYouth(state);
    const p = generatePlayer(state, { club, isYouth: true, forcedPos: neededPositionForClub(state, club) });
    // la date n'a pas encore basculé sur la nouvelle saison : sans ce décalage, certains jeunes arrivaient avec un
    // contrat déjà échu (V8.3)
    p.contractUntil = seasonStartYear(state) + 1 + randInt(1, 3);
    state.players[p.id] = p;
    club.squad.push(p.id);
    summary.newYouth++;
  }
  runAgencyAcademy(state, news);
  // garde-fou : plafonne le vivier de joueurs libres non représentés (scoutés mais jamais signés),
  // pour que le monde reste borné même après des décennies de scouting intensif
  const FREE_AGENT_CAP = 150;
  state.freeAgents = state.freeAgents || [];
  if (state.freeAgents.length > FREE_AGENT_CAP) {
    const sorted = state.freeAgents.map(id => state.players[id]).filter(Boolean).sort((a, b) => b.pot - a.pot);
    const keepIds = new Set(sorted.slice(0, FREE_AGENT_CAP).map(p => p.id));
    // V8.3 : un libre qui ne trouve plus preneur raccroche proprement (portefeuilles des rivaux, légendes...)
    for (const id of state.freeAgents) if (!keepIds.has(id) && state.players[id]) retirePlayer(state, state.players[id]);
    state.freeAgents = state.freeAgents.filter(id => keepIds.has(id));
  }
  evaluateAgentLegendScores(state);
  checkAgentCashRecord(state);
  checkSeasonGoals(state, news);
  for (const lg of Object.values(state.leagues)) lg.fixtures = generateSeasonFixtures(lg.clubIds);
  state.meta.totalSeasonsPlayed = (state.meta.totalSeasonsPlayed || 0) + 1;
  state.agent.seasonStartStats = { commissions: state.agent.careerStats.totalCommissions || 0, transfersDone: state.agent.careerStats.transfersDone || 0 };
  return summary;
}

// Réaction après match (V9.3, suite) : transforme un candidat collecté pendant la boucle de matchs (note réelle,
// pas la moyenne de saison) en pendingEvent, avec exactement le même mécanisme que les autres messages —
// resolveEvent n'a besoin d'aucune modification puisque le texte est déjà résolu ici et que l'effet ne lit que
// (state, joueur, news), comme pour tous les événements liés à un joueur.
function maybeTriggerMatchReaction(state, candidates) {
  if (state.pendingEvent || !candidates.length || Math.random() > 0.5) return false;
  candidates.sort((a, b) => Math.abs(b.rating - 6.5) - Math.abs(a.rating - 6.5)); // le plus extrême d'abord
  const c = candidates[0];
  const ev = EVENTS.find(e => e.id === (c.kind === 'great' ? 'match_great_performance' : 'match_poor_performance'));
  state.pendingEvent = {
    id: ev.id, playerId: c.playerId, rivalId: null,
    text: c.kind === 'great'
      ? `${c.playerName} vous écrit après le match : « ${c.rating}/10 ce soir, enfin un vrai match plein ! »`
      : `${c.playerName} vous écrit après le match : « ${c.rating}/10... une vraie sortie ratée ce soir. »`,
    choiceLabels: ev.choices.map(ch => ch.label),
  };
  return true;
}
// Réaction après blessure (V9.3, suite) : même principe que maybeTriggerMatchReaction, mais nourri par
// updateFormMoraleInjuries plutôt que par la boucle de matchs. Fréquence plus haute que les réactions de match
// (80% au lieu de 50%) car l'événement source est déjà naturellement rare (~1 à 5% de risque par joueur et par
// mois selon la blessure) : pas besoin d'un second filtre pour éviter la saturation.
function maybeTriggerInjuryReaction(state, candidates) {
  if (state.pendingEvent || !candidates.length || Math.random() > 0.8) return false;
  const c = candidates[Math.floor(Math.random() * candidates.length)];
  const ev = EVENTS.find(e => e.id === 'injury_contact');
  state.pendingEvent = {
    id: ev.id, playerId: c.playerId, rivalId: null,
    text: `${c.playerName} vous écrit : « ${c.injuryType}... ${c.duration} mois d'arrêt, ça fait mal. »`,
    choiceLabels: ev.choices.map(ch => ch.label),
  };
  return true;
}
// Retour de blessure (V9.3, réponse différée) : contrairement aux autres réactions, celle-ci ne nait pas d'un
// nouvel événement mais de la RÉSOLUTION d'un état posé plusieurs mois plus tôt (injuredUntil atteint) — c'est
// exactement le principe demandé par le plan : la conversation reprend, elle ne se limite pas à un aller simple.
function maybeTriggerRecoveryReaction(state, candidates) {
  if (state.pendingEvent || !candidates.length) return false;
  const idx = Math.floor(Math.random() * candidates.length);
  const c = candidates[idx];
  candidates.splice(idx, 1); // consommé : ne repasse pas en boucle les mois suivants ; les autres candidats restent en file
  const ev = EVENTS.find(e => e.id === 'recovery_contact');
  state.pendingEvent = {
    id: ev.id, playerId: c.playerId, rivalId: null,
    text: `${c.playerName} vous écrit : « Bonne nouvelle, ${c.injuryType ? (c.injuryType.toLowerCase() + ' ') : ''}c'est derrière moi, je suis de retour à l'entraînement ! »`,
    choiceLabels: ev.choices.map(ch => ch.label),
  };
  return true;
}
// Changement de statut (V9.3, suite) : même famille que les réactions match/blessure — un vrai franchissement de
// seuil (voir squadStrength) plutôt qu'un tirage au hasard sans rapport avec ce qui se passe sur le terrain.
function maybeTriggerStatusReaction(state, candidates) {
  if (state.pendingEvent) return false;
  const fresh = candidates.filter(c => { const p = state.players[c.playerId]; return p && (state.date.absMonth - (p.lastStatusMsgAt ?? -99)) >= STATUS_MSG_COOLDOWN; });
  if (!fresh.length || Math.random() > 0.65) return false;
  const c = fresh[Math.floor(Math.random() * fresh.length)];
  state.players[c.playerId].lastStatusMsgAt = state.date.absMonth;
  const evId = c.kind === 'breakthrough' ? 'status_breakthrough' : 'status_benched';
  const ev = EVENTS.find(e => e.id === evId);
  state.pendingEvent = {
    id: ev.id, playerId: c.playerId, rivalId: null,
    text: c.kind === 'breakthrough'
      ? `${c.playerName} vous écrit : « Coach m'a enfin titularisé, je veux pas lâcher ma place ! »`
      : `${c.playerName} vous écrit : « Encore sur le banc... je commence à me poser des questions. »`,
    choiceLabels: ev.choices.map(ch => ch.label),
  };
  return true;
}
// Objectif personnel atteint (V9.3, suite) : file persistante en FIFO, comme le retour de blessure — un jalon
// de carrière ne doit jamais être perdu silencieusement parce qu'un autre événement a gagné la priorité ce mois-là.
function maybeTriggerGoalReaction(state, candidates) {
  if (state.pendingEvent || !candidates.length) return false;
  const c = candidates.shift();
  const ev = EVENTS.find(e => e.id === 'goal_achieved');
  state.pendingEvent = {
    id: ev.id, playerId: c.playerId, rivalId: null,
    text: `${c.playerName} vous écrit : « Objectif atteint : ${c.goalLabel.toLowerCase()} ! Merci pour votre accompagnement. »`,
    choiceLabels: ev.choices.map(ch => ch.label),
  };
  return true;
}
function applicableEvents(state) {
  return EVENTS.filter(e => {
    if (e.cond && !e.cond(state)) return false;
    // strictTarget (bug trouvé au test navigateur V9.4) : le repli « n'importe quel joueur du portefeuille » de
    // maybeTriggerEvent convient aux événements dont le texte reste plausible pour tous, mais pas à ceux qui
    // DÉPENDENT de la condition (dirigeant_contact lisait le premier club intéressé... qui n'existait pas → crash
    // du passage de mois). Ceux-là ne sont applicables que si au moins un joueur remplit vraiment la condition.
    if (e.scope === 'represented' && e.strictTarget) return state.agent.portfolio.some(id => { const p = state.players[id]; return p && !p.retired && e.targetCond(p, state); });
    if (e.scope === 'represented') return state.agent.portfolio.some(id => state.players[id] && !state.players[id].retired);
    if (e.scope === 'rival') return (state.rivalAgents || []).length > 0;
    if (e.scope === 'match') return false; // jamais tiré au hasard : uniquement via maybeTriggerMatchReaction, avec un vrai contexte de match
    if (e.scope === 'injury') return false; // idem, via maybeTriggerInjuryReaction
    if (e.scope === 'recovery') return false; // idem, via maybeTriggerRecoveryReaction
    if (e.scope === 'status') return false; // idem, via maybeTriggerStatusReaction
    if (e.scope === 'goal') return false; // idem, via maybeTriggerGoalReaction
    return true;
  });
}
function maybeTriggerEvent(state) {
  if (state.pendingEvent) return;
  if (Math.random() > 0.35) return;
  const applicable = applicableEvents(state);
  if (!applicable.length) return;
  const ev = weightedChoice(applicable, e => e.weight);
  let target = null;
  if (ev.scope === 'represented') {
    let pool = state.agent.portfolio.map(id => state.players[id]).filter(p => p && !p.retired);
    // certains événements ne concernent vraiment qu'un profil précis (banc prolongé, jeune en forme...) : on
    // restreint le tirage à ces joueurs quand c'est précisé, plutôt que de piocher n'importe qui au hasard dans
    // le portefeuille et de lui prêter un texte qui ne correspond pas à sa situation réelle.
    if (ev.targetCond) { const eligible = pool.filter(p => ev.targetCond(p, state)); if (eligible.length) pool = eligible; else if (ev.strictTarget) return; }
    if (!pool.length) return;
    target = choice(pool);
  } else if (ev.scope === 'rival') {
    target = choice(state.rivalAgents);
  }
  state.pendingEvent = {
    id: ev.id,
    playerId: (ev.scope === 'represented' && target) ? target.id : null,
    rivalId: (ev.scope === 'rival' && target) ? target.id : null,
    text: ev.text(target, state),
    choiceLabels: ev.choices.map(c => c.label),
  };
}
function resolveEvent(state, choiceIndex) {
  if (!state.pendingEvent) return [];
  const ev = EVENTS.find(e => e.id === state.pendingEvent.id);
  const p = state.pendingEvent.playerId ? state.players[state.pendingEvent.playerId] : null;
  const rival = state.pendingEvent.rivalId ? (state.rivalAgents || []).find(r => r.id === state.pendingEvent.rivalId) : null;
  const news = [];
  // garde-fou : si le joueur ciblé n'existe plus (retraite entre-temps), on annule l'événement proprement
  if (state.pendingEvent.playerId && !p) { state.pendingEvent = null; return news; }
  if (state.pendingEvent.rivalId && !rival) { state.pendingEvent = null; return news; }
  const situation = state.pendingEvent.text;
  const choiceLabel = ev.choices[choiceIndex].label;
  ev.choices[choiceIndex].effect(state, p || rival, news);
  state.pendingEvent = null;
  // V9.1, immersion : pour un événement personnel à un joueur, la situation et le choix fait ne sont
  // conservés jusqu'ici que le temps de la popup — une fois refermée, seule la conséquence isolée
  // (ex. "Vous calmez le jeu autour de Lucas") survit dans le fil, sans plus jamais dire de quoi il
  // retournait. On garde maintenant les trois ensemble dans une seule entrée, pour que le fil d'actus
  // devienne une vraie mémoire consultable de ce qui s'est passé avec chaque joueur.
  if (p) {
    const outcomeText = news.map(n => n.text).join(' ') || 'Rien de particulier n\u2019en ressort.';
    pushNews(state, [{ text: outcomeText, tag: 'message', playerId: p.id, situation, choice: choiceLabel }]);
  } else if (rival) {
    const outcomeText = news.map(n => n.text).join(' ') || 'Rien de particulier n\u2019en ressort.';
    pushNews(state, [{ text: outcomeText, tag: 'message', rivalId: rival.id, situation, choice: choiceLabel }]);
  } else {
    pushNews(state, news);
  }
  return news;
}

// ---------- Boucle mensuelle ----------
function advanceMonth(state) {
  const news = [];
  // le compte part de la clôture du mois précédent, pas du début de la simulation : les transferts acceptés, le
  // scouting ou les embauches se font ENTRE deux passages de mois, et sans ça ils n'apparaissaient dans aucun compte
  const prevLedger = (state.agent.financeHistory || []).slice(-1)[0];
  const commNow = (state.agent.careerStats && state.agent.careerStats.totalCommissions) || 0;
  const ledgerCash0 = prevLedger ? prevLedger.cash : state.agent.cash;
  const ledgerComm0 = prevLedger && prevLedger.commTotal !== undefined ? prevLedger.commTotal : commNow;
  const month = calMonth(state);
  const tickSeason = seasonLabel(state); // capturé avant tout changement de date, pour un étiquetage correct des actus
  const matchReactionCandidates = []; // V9.3 : « réactions après match » — alimenté ci-dessous, consommé avant maybeTriggerEvent
  const statusReactionCandidates = []; // V9.3 : « changement de statut » — alimenté par squadStrength() via simulateMatch()
  if (MATCH_MONTHS.includes(month)) {
    for (const lg of Object.values(state.leagues)) {
      const due = lg.fixtures.filter(f => f.month === month && !f.played);
      for (const f of due) {
        const home = state.clubs[f.home], away = state.clubs[f.away];
        if (!home || !away) continue;
        const r = simulateMatch(state, home, away, statusReactionCandidates);
        f.played = true; f.scoreHome = r.goalsHome; f.scoreAway = r.goalsAway;
        // notes individuelles des joueurs représentés : une prestation qui sort du lot mérite un appel, pas
        // seulement une ligne noyée dans les stats de saison (V8, chasse aux exploits, gardait déjà un oeil sur
        // les buteurs représentés dans pushMatchdayNews ; ici on va jusqu'à la vraie note du match, pas la
        // moyenne cumulée, et jusqu'à la performance ratée, pas seulement la bonne).
        for (const rt of [...r.ratingsHome, ...r.ratingsAway]) {
          if (!state.agent.portfolio.includes(rt.id)) continue;
          if (rt.rating >= 7.9) matchReactionCandidates.push({ playerId: rt.id, playerName: rt.name, rating: rt.rating, kind: 'great' });
          else if (rt.rating <= 5.3) matchReactionCandidates.push({ playerId: rt.id, playerName: rt.name, rating: rt.rating, kind: 'poor' });
        }
        // détail complet (buteurs/cartons/homme du match) réservé aux rencontres pertinentes :
        // sur ~3700 matchs/saison tous championnats confondus, tout détailler ferait exploser la sauvegarde pour rien.
        const relevant = home.tier >= 3 || away.tier >= 3 || state.agent.portfolio.some(pid => {
          const p = state.players[pid]; return p && (p.club === home.id || p.club === away.id);
        });
        if (relevant) {
          f.scorersHome = r.scorersHome; f.scorersAway = r.scorersAway;
          f.cardsY = r.cardsY; f.cardsR = r.cardsR; f.motm = r.motm;
        }
      }
    }
    pushMatchdayNews(state, news);
  }
  advanceEuropeMonth(state, news, month);
  const injuryReactionCandidates = []; // V9.3 : « réactions après blessure », même principe que matchReactionCandidates
  state.pendingRecoveryQueue = state.pendingRecoveryQueue || []; // V9.3 : réponse différée — persiste tant qu'elle n'a pas été consommée (voir maybeTriggerRecoveryReaction), contrairement aux candidats de match/blessure qui sont des réactions instantanées, pas des suites promises
  // bornée (V8.3) : un seul retour par joueur, et au plus 10 en attente — la file grossissait sans fin dans la sauvegarde
  state.pendingRecoveryQueue = state.pendingRecoveryQueue.filter((c, i, arr) => state.players[c.playerId] && arr.findIndex(x => x.playerId === c.playerId) === i).slice(-10);
  const recoveryReactionCandidates = state.pendingRecoveryQueue;
  updateFormMoraleInjuries(state, news, injuryReactionCandidates, recoveryReactionCandidates);
  state.pendingGoalQueue = state.pendingGoalQueue || []; // V9.3 : un objectif atteint est un jalon unique, pas une chance mensuelle — la file persiste comme pour les retours de blessure
  checkPersonalGoals(state, state.pendingGoalQueue);
  updateContractsAndListings(state, news);
  checkRolePromises(state, news);
  const isMercato = (month === 1 || month === 7);
  runAIClubSquadManagement(state, news, isMercato);
  runAIClubTransfers(state, news, isMercato);
  maybeGenerateRumor(state, news, isMercato);
  maybeGenerateReferral(state, news);
  runAIClubFreeAgentSignings(state, news, isMercato);
  if (isMercato) {
    // le mercato se referme : les joueurs non vendus restent finalement à leur club plutôt que de rester
    // éternellement "en vente" saison après saison (sauf les clients de l'agent, qui gèrent leur propre listing).
    state.transferListed = state.transferListed.filter(id => {
      const p = state.players[id];
      return p && (p.agentId === 'player' || Math.random() < 0.55);
    });
  }
  runRivalAgentsAI(state, isMercato, news);
  generateIncomingOffers(state, news);
  checkReleaseClauses(state, news);
  checkLoanReturns(state, news);
  runAIClubLoans(state, news, isMercato);
  progressScoutMissions(state, news);
  monthlyAgencyIncomeExpense(state, news);
  monthlyClubFinances(state);
  const wasLastMonthOfSeason = (month === 7);
  let seasonSummary = null;
  // traité AVANT l'avancée de la date : les trophées/records/actus de fin de saison portent ainsi le bon millésime
  if (wasLastMonthOfSeason) seasonSummary = processEndOfSeason(state, news);
  advanceDate(state);
  // déclenché après une éventuelle transition de saison : la cible existe forcément encore à ce stade
  // priorité : blessure (rare, mérite le plus d'attention) > retour de blessure (réponse différée) > objectif atteint (jalon unique) > changement de statut > réaction post-match > tirage mensuel générique
  if (!maybeTriggerInjuryReaction(state, injuryReactionCandidates) && !maybeTriggerRecoveryReaction(state, recoveryReactionCandidates) && !maybeTriggerGoalReaction(state, state.pendingGoalQueue) && !maybeTriggerStatusReaction(state, statusReactionCandidates) && !maybeTriggerMatchReaction(state, matchReactionCandidates)) maybeTriggerEvent(state);
  const newAch = checkAchievements(state);
  for (const a of newAch) news.push({ text: `Haut fait débloqué : ${a.label} (+${fmtMoneyShort(a.cash || 0)}).`, tag: 'haut_fait' });
  checkCareerTier(state, news);
  pushNews(state, news, { month, season: tickSeason });
  // compte du mois (V9.4, audit « finances ») : ce qui est entré et sorti, gardé 12 mois pour l'historique
  const L = state.agent.monthLedger || { sponsor: 0, staff: 0, rent: 0, invest: 0 };
  L.invest = L.invest || 0;
  const commTotal = (state.agent.careerStats && state.agent.careerStats.totalCommissions) || 0;
  const commissions = commTotal - ledgerComm0;
  const result = state.agent.cash - ledgerCash0;
  state.agent.financeHistory = state.agent.financeHistory || [];
  state.agent.financeHistory.push({ month, season: tickSeason, commissions, sponsor: L.sponsor, staff: L.staff, rent: L.rent, invest: L.invest,
    other: Math.round(result - commissions - L.sponsor + L.staff + L.rent + L.invest), result: Math.round(result), cash: state.agent.cash, commTotal });
  if (state.agent.financeHistory.length > 12) state.agent.financeHistory.shift();
  return { news, seasonSummary };
}

// ---------- Nouvelle partie ----------
function createNewGame({ agentName, agency, nationality, specialty }) {
  const state = {
    version: 2, startYear: 2026, date: { absMonth: 0 },
    agent: {
      id: 'player', name: agentName, agency, nationality, specialty,
      reputation: specialty === 'reseau' ? 13 : 5,
      cash: 150000 + (specialty === 'business' ? 50000 : 0),
      officeLevel: 1, careerTier: 0, investments: {},
      staff: { scouts: 0, avocats: 0, negociateurs: 0, analystes: 0, communicants: 0 },
      portfolio: [], clubRelations: {},

// chaque saison de chaque joueur coûtent plus cher que les données elles-mêmes). On les aplatit à leur tour en
// tableaux positionnels, uniquement à l'écriture/lecture de la sauvegarde : le reste du moteur continue de

    if (!Array.isArray(entry)) return entry;

// (JSON brut) reste lu, et reste le repli si le navigateur ne sait pas compresser.
const SAVE_KEY = 'football_agent_save_v2';     // JSON brut (ancien format, et repli)

async function gzipToBase64(str) {

  const seq = ++saveSeq;

    pendingSaveJSON = json;

    if (seq !== saveSeq) return true; // une sauvegarde plus récente est en cours : elle écrira à notre place
    pendingSaveJSON = null;
    localStorage.setItem(SAVE_KEY_GZ, packed);
    localStorage.removeItem(SAVE_KEY); // libère l'ancien format (et un éventuel secours de fermeture)
    return true;

  const found = [];

    if (gz && canCompressSave()) found.push(deserializeState(await base64ToGunzip(gz)));

    const raw = localStorage.getItem(SAVE_KEY);

function meterHTML(value, max, color) {
  const pct = clamp(Math.round((value / max) * 100), 0, 100);
  return `<div class="meter"><i style="width:${pct}%;background:${color}"></i></div>`;
}
// mini-graphique d'évolution (SVG inline, sans dépendance externe) pour l'historique de club (valeur, budget, réputation)
function sparklineHTML(history, key, opts) {
  opts = opts || {};
  if (!history || history.length < 2) return '<p class="small">Historique pas encore disponible (revenez après quelques saisons).</p>';
  const vals = history.map(h => h[key] || 0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const w = 300, h = 46, pad = 3;
  const range = (max - min) || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (vals.length > 1 ? (i / (vals.length - 1)) : 0.5) * (w - pad * 2);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = opts.color || 'var(--blue)';
  const fmtVal = opts.fmt || (v => Math.round(v));
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <div class="row-between small" style="margin-top:2px"><span>${esc(history[0].s)} · ${fmtVal(vals[0])}</span><span>${esc(history[history.length - 1].s)} · ${fmtVal(vals[vals.length - 1])}</span></div>`;
}

function toast(msg) {
  const root = document.getElementById('toastRoot');
  if (!root) return;

function saveGame() {
  if (!G) return Promise.resolve(true);

// Échec d'écriture (V8.3, audit P0-3) : un toast de 2,6 s ne suffisait pas — la progression cessait d'être
// enregistrée sans que le joueur le sache. Le bandeau reste affiché tant que les sauvegardes échouent.
function setSaveWarning(on) {
  const el = document.getElementById('saveWarning');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  const div = document.createElement('div');
  div.id = 'saveWarning'; div.className = 'save-warning';
  div.innerHTML = `⚠️ La sauvegarde automatique a échoué (espace du navigateur insuffisant) : votre progression n'est plus enregistrée. <button class="btn btn-sm" onclick="handleExport()">Exporter la partie</button>`;
  document.body.appendChild(div);
}

/* ---------- Amorçage ---------- */
async function boot() {
  window.addEventListener('pagehide', flushPendingSaveOnUnload);
  const loaded = await loadFromLocalStorage();
  if (loaded && loaded.clubs && loaded.players && loaded.agent) {
    migrateOldSave(loaded);
    G = loaded; renderApp();
  }
  else renderOnboarding();
}
// filet de compatibilité V7 : une sauvegarde plus ancienne n'a pas encore réputation/stade/historique de club,
// ni réputation de championnat. On les initialise une fois au chargement plutôt que d'attendre le premier mois
// joué, pour que la fiche club affiche tout de suite des valeurs correctes.
function migrateOldSave(state) {
  let needsLeagueRecalc = false;
  // V8.3 : un joueur sans club n'a pas de contrat (reliquat de l'ancienne renégociation sans club, audit P0-1)
  for (const p of Object.values(state.players || {})) if (!p.club && p.contractUntil) p.contractUntil = null;
  for (const c of Object.values(state.clubs)) {
    if (c.reputation === undefined) { initClubEconomy(c); needsLeagueRecalc = true; }
  }
  if (needsLeagueRecalc) {
    for (const lg of Object.values(state.leagues)) recomputeLeagueReputation(state, lg);
  }
}

/* ---------- Tableau de bord ---------- */
// Guide de démarrage (addictivité) : jamais bloquant, jamais un tutoriel qui force la main — juste une carte en
// haut du tableau de bord qui indique la prochaine étape, dérivée de l'état réel du joueur vedette. Se ferme
// définitivement dès que l'utilisateur clique "Passer" ou une fois la boucle complète vécue une fois.
function onboardingCardHTML() {
  const step = computeOnboardingStep(G);
  if (!step) return '';
  const p = G.players[G.onboarding.starterPlayerId];
  if (!p) return '';
  let title, body, cta;
  if (step === 'find_club') {
    title = '👋 Premiers pas';
    body = `Un contact vous recommande <b>${esc(p.name)}</b> (${posLabel(p.pos)}, ${p.age} ans) : il rejoint votre agence. À vous de lui trouver un club.`;
    cta = `<button class="btn btn-primary btn-block" style="margin-top:8px" onclick="openTransferSearch('${p.id}')">Chercher un club pour ${esc(p.name)}</button>`;
  } else if (step === 'first_match') {
    title = '👋 Encore une étape';
    body = `${esc(p.name)} a signé son contrat. Avancez d'un mois pour le voir disputer son premier match.`;
    cta = '';

// computeAgentActions() : plutôt que de laisser l'utilisateur retrouver lui-même une offre, un joueur
// mécontent, un contrat qui expire, une blessure ou une piste dans les différents onglets, on fait remonter
// ces signaux ici, triés par urgence, et on ne garde que les 3 à 5 plus importants pour que l'accueil reste
// un centre de décision plutôt qu'un nouvel empilement d'informations.
function computeAgentActions(state) {
  const actions = [];
  const curAbs = state.date.absMonth;
  for (const o of (state.incomingOffers || [])) {
    const p = state.players[o.playerId], c = state.clubs[o.clubId];
    if (!p || !c) continue;
    actions.push({ urgency: 95 - Math.max(0, o.expires - curAbs) * 15, icon: 'mail', tone: 'blue', offerId: o.id,
      title: `Offre pour ${p.name}`, text: `${c.name} propose ${o.fee ? fmtMoneyShort(o.fee) : 'un contrat (joueur libre)'} · ${fmtMoneyShort(o.wage)}/mois`,
      cta: `openPlayerDetail('${p.id}','dashboard')` });
  }
  for (const pid of (state.agent.portfolio || [])) {
    const p = state.players[pid];
    if (!p || p.retired) continue;
    // (le joueur offert au départ a déjà sa carte « Premiers pas » tant qu'il n'a jamais eu de club)
    if (!p.club && !(computeOnboardingStep(state) === 'find_club' && state.onboarding.starterPlayerId === pid)) actions.push({ urgency: 70, icon: 'search', tone: 'gold',
      title: `${p.name} est sans club`, text: `Trouvez-lui un club : pas d'indemnité de transfert, mais des frais d'agent versés par le club qui le recrute.`,
      cta: `openTransferSearch('${pid}')` });
    if ((p.morale ?? 50) < 35) actions.push({ urgency: 75 - (p.morale ?? 50), icon: 'chat', tone: 'red',
      title: `${p.name} est mécontent`, text: `Moral au plus bas (${Math.round(p.morale)}/100) : un geste ou une explication s'impose.`,
      cta: `openPlayerDetail('${pid}','dashboard')` });
    if (p.injuredUntil && p.injuredUntil > curAbs) actions.push({ urgency: 60, icon: 'refresh', tone: 'red',
      title: `${p.name} blessé`, text: `${p.injuryType || 'Blessure'} — retour dans ${p.injuredUntil - curAbs} mois.`,
      cta: `openPlayerDetail('${pid}','dashboard')` });
    if (p.contractUntil && (p.contractUntil - seasonStartYear(state)) <= 1) actions.push({ urgency: 55, icon: 'pen', tone: 'gold',
      title: `Contrat de ${p.name} à négocier`, text: `Fin de contrat proche : renégociez avant qu'un club ne s'en mêle.`,
      cta: `openPlayerDetail('${pid}','dashboard')` });
  }
  for (const n of (state.news || []).slice(0, 6)) {
    if (n.referral) actions.push({ urgency: 50, icon: 'star', tone: 'gold',
      title: 'Piste exclusive à explorer', text: n.text,
      cta: n.playerId ? `openPlayerDetail('${n.playerId}','dashboard')` : `navigate('scouting')` });
  }
  const monthlyFixed = officeRent(state) + Object.values(state.agent.staff).reduce((x, y) => x + y, 0) * 3500 + investmentsUpkeep(state);
  if (monthlyFixed > 0 && state.agent.cash < monthlyFixed * 3) actions.push({ urgency: state.agent.cash < 0 ? 90 : 65, icon: 'bank', tone: 'red',
    title: state.agent.cash < 0 ? 'Trésorerie dans le rouge' : 'Trésorerie tendue',
    text: `Moins de 3 mois de charges fixes (${fmtMoneyShort(monthlyFixed)}/mois). Un transfert ou une prolongation renflouerait les caisses.`,
    cta: `navigate('finances')` });
  actions.sort((x, y) => y.urgency - x.urgency);
  return actions.slice(0, 5);
}

// ---------- Fiche joueur enrichie (V7) ----------
// Profil détaillé façon rapport de scouting : dérivé du niveau global et du poste, avec une variation stable par
// joueur (même id = toujours le même profil affiché au fil des visites). Purement présentation, n'affecte jamais
// la simulation — le moteur continue de tout calculer à partir du seul ovr, comme avant.
function strSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ATTR_LABELS = { atk: 'Attaque', def: 'Défense', tech: 'Technique', mental: 'Mental', phys: 'Physique', pace: 'Vitesse' };
const ATTR_WEIGHTS_BY_POSLINE = {
  GK: { atk: -9, def: 6, tech: 1, mental: 3, phys: 3, pace: -3 },
  DF: { atk: -4, def: 7, tech: 0, mental: 2, phys: 3, pace: 0 },
  MF: { atk: 1, def: 1, tech: 5, mental: 3, phys: 0, pace: 1 },
  FW: { atk: 7, def: -6, tech: 3, mental: 0, phys: 1, pace: 4 },
};
function derivedAttributes(p) {
  const rnd = mulberry32(strSeed(p.id + 'attr'));
  const weights = ATTR_WEIGHTS_BY_POSLINE[p.posLine] || ATTR_WEIGHTS_BY_POSLINE.MF;
  const base = p.ovr / 4.2;
  const out = {};
  for (const k of Object.keys(ATTR_LABELS)) out[k] = clamp(Math.round(base + weights[k] + (rnd() - 0.5) * 8), 1, 30);
  return out;
}
function derivedPhysique(p) {
  const rnd = mulberry32(strSeed(p.id + 'phys'));
  const baseHeight = { GK: 189, DF: 183, MF: 177, FW: 179 }[p.posLine] || 178;
  const height = Math.round(baseHeight + (rnd() - 0.5) * 16);
  const weight = Math.round(height * 0.42 + (rnd() - 0.5) * 6);
  return { height, weight };
}

function handleRepresent(id) {

/* ---------- Scouting ---------- */
function renderScouting() {
  const missions = G.scoutMissions || [];
  const pending = missions.filter(m => !m.ready);
  const ready = missions.filter(m => m.ready);
  const tier = SCOUT_BUDGET_TIERS.find(t => t.id === ui.scoutTier) || SCOUT_BUDGET_TIERS[1];
  return `<div class="page-title">Scouting</div>
    <div class="card"><div class="card-title">Budget de la mission</div>
      <div class="region-grid">${SCOUT_BUDGET_TIERS.map(t => `<div class="region-card ${t.id === ui.scoutTier ? 'active' : ''}" onclick="setScoutTier('${t.id}')"><b class="num">${fmtMoneyShort(t.cost)}</b><div class="small">${t.label}</div></div>`).join('')}</div>
      <p class="small" style="margin-top:8px">${tier.playersMin}–${tier.playersMax} profils repérés${tier.accuracyBonus > 0 ? ', rapport plus précis dès réception' : (tier.accuracyBonus < 0 ? ', rapport plus flou (fourchette large)' : '')}.</p>
    </div>
    <div class="card"><div class="card-title">Envoyer un recruteur</div>
      <div class="region-grid">${SCOUT_REGIONS.map(r => `<div class="region-card" onclick="handleStartScout('${r.id}')"><span class="flag">${flagFor(r.nats[0])}</span>${r.label}</div>`).join('')}</div>
      <p class="small" style="margin-top:10px">Coût : ${fmtMoneyShort(tier.cost)} pour cette mission. La précision du rapport dépend de votre réputation, de votre spécialité et de vos recruteurs.</p>
    </div>
    ${pending.length ? `<div class="card"><div class="card-title">Missions en cours</div>${pending.map(m => `<div class="row-between small" style="padding:6px 0"><span>${flagFor((SCOUT_REGIONS.find(r => r.id === m.regionId) || {}).nats[0])} ${(SCOUT_REGIONS.find(r => r.id === m.regionId) || {}).label || m.regionId} <span class="small">(${(SCOUT_BUDGET_TIERS.find(t => t.id === m.tierId) || SCOUT_BUDGET_TIERS[1]).label})</span></span><span>${m.monthsLeft} mois restant(s)</span></div>`).join('')}</div>` : ''}
    ${ready.map(scoutResultCardHTML).join('')}
    ${(!pending.length && !ready.length) ? emptyStateHTML('search', 'Aucun rapport pour le moment.', 'Envoyez un recruteur dans une région pour découvrir de jeunes talents.') : ''}
  `;
}
function scoutResultCardHTML(m) {
  const region = SCOUT_REGIONS.find(r => r.id === m.regionId) || {};
  const rows = m.results.map(r => {
    const p = G.players[r.playerId];
    if (!p) return '';
    return `<div class="list-row" style="align-items:flex-start">
      <div class="ovr" style="cursor:pointer" onclick="openPlayerDetail('${p.id}','scouting')">${flagFor(p.nat)}</div>
      <div style="cursor:pointer" onclick="openPlayerDetail('${p.id}','scouting')"><div class="name">${esc(p.name)}</div><div class="sub"><span class="pos-tag ${p.posLine}">${p.pos}</span> ${p.age} ans</div></div>
      <div class="right">
        <div class="small">Potentiel estimé</div><b class="num">${r.shownRange[0]}–${r.shownRange[1]}</b>
        <div><button class="btn btn-sm" style="margin-top:6px" onclick="handleDeepenScouting('${p.id}')">${icon('search',14)} Observer + (${fmtMoneyShort(DEEP_SCOUT_COST)})</button></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="row-between"><div class="card-title" style="margin-bottom:0">Rapport — ${esc(region.label || '')}</div><button class="btn btn-sm" onclick="handleDismissMission('${m.id}')">Archiver</button></div>
    ${rows}
  </div>`;
}
function handleDeepenScouting(playerId) {
  const r = deepenScouting(G, playerId);
  saveGame();
  toast(r.ok ? 'Fourchette de potentiel affinée.' : (r.reason || 'Impossible.'));
  renderPage();
}
function setScoutTier(tierId) { ui.scoutTier = tierId; renderPage(); }
function handleStartScout(regionId) {
  const r = startScoutMission(G, regionId, ui.scoutTier);
  saveGame();
  toast(r.ok ? 'Recruteur envoyé sur le terrain.' : (r.reason || 'Impossible.'));
  renderPage();
}
function handleDismissMission(id) { dismissScoutMission(G, id); saveGame(); renderPage(); }

function openClubDetail(id, returnTo) { ui.selectedClubId = id; ui.returnTo = returnTo || ui.page; navigate('clubdetail'); }
function renderClubDetail() {
  const c = G.clubs[ui.selectedClubId];
  if (!c) return `<p>Club introuvable.</p><button class="btn" onclick="navigate('${ui.returnTo}')">← Retour</button>`;

  const attendanceRate = clamp(0.35 + c.reputation / 160, 0.25, 0.97);

  return `
    <button class="btn btn-sm" onclick="navigate('${ui.returnTo}')" style="margin-bottom:12px">← Retour</button>
    <div class="card row-between">
      <div><h2>${esc(c.name)}</h2><div class="small">${esc(c.city)} · ${(LEAGUES.find(l => l.id === c.league) || {}).name || ''}</div></div>
      ${clubBadgeHTML(c, 'lg')}
    </div>
    <div class="grid-3">
      <div class="kpi"><b class="num">${c.table.pts}</b><span>Points</span></div>
      <div class="kpi"><b class="num">${fmtMoneyShort(c.budget)}</b><span>Budget</span></div>
      <div class="kpi"><b class="num">${c.titlesWon || 0}</b><span>Titres</span></div>
    </div>
    ${c.euroTitlesWon ? `<p class="small">${icon('trophy',13)} ${c.euroTitlesWon}× vainqueur de la Ligue des Champions</p>` : ''}
    <div class="card">
      <div class="row-between small"><span>Réputation${lg ? ` (championnat : ${(lg.reputation || 0).toFixed ? Math.round(lg.reputation) : lg.reputation}/100)` : ''}</span><span class="num">${Math.round(c.reputation)}/100</span></div>
      ${meterHTML(c.reputation, 100, 'var(--blue)')}
    </div>
    <div class="card"><div class="card-title">Stade</div>
      <div class="row-between small"><span>Capacité</span><span class="num">${c.stadiumCapacity.toLocaleString('fr-FR')} places</span></div>
      <div class="row-between small"><span>Niveau des infrastructures</span><span class="num">${'★'.repeat(c.stadiumLevel)}${'☆'.repeat(5 - c.stadiumLevel)}</span></div>
      <div class="row-between small"><span>Taux de remplissage estimé</span><span class="num">${Math.round(attendanceRate * 100)}%</span></div>
    </div>
    ${(() => {
      const inSquad = squad.filter(p => p.homegrownClub === c.id).length;
      const abroad = Object.values(G.players).filter(p => !p.retired && p.homegrownClub === c.id && p.club !== c.id).length;
      if (!inSquad && !abroad) return '';
      return `<div class="card"><div class="card-title">Centre de formation</div>
        <div class="row-between small"><span>Formés au club, encore présents</span><span class="num">${inSquad}</span></div>
        <div class="row-between small"><span>Formés au club, partis ailleurs</span><span class="num">${abroad}</span></div>
      </div>`;
    })()}
    ${c.history && c.history.length >= 2 ? `<div class="card"><div class="card-title">Évolution (valeur d'effectif)</div>${sparklineHTML(c.history, 'v', { color: 'var(--emerald)', fmt: fmtMoneyShort })}</div>
    <div class="card"><div class="card-title">Évolution (réputation)</div>${sparklineHTML(c.history, 'r', { color: 'var(--blue)', fmt: v => Math.round(v) + '/100' })}</div>` : ''}
    <div class="card"><div class="row-between small"><span>Vos relations avec ce club</span><span class="num">${rel}/100</span></div>${meterHTML(rel, 100, rel >= 50 ? 'var(--emerald)' : 'var(--red)')}
      ${(() => {
        const log = (G.agent.clubRelationLog && G.agent.clubRelationLog[c.id]) || [];

    </div>
    <div class="card"><div class="card-title">Calendrier</div><div style="max-height:340px;overflow-y:auto">${clubFixturesHTML(c)}</div></div>
    <div class="card"><div class="card-title">Meilleurs buteurs (saison)</div>${scorers.length ? scorers.map(p => playerRowHTML(p, { returnTo: 'clubdetail' })).join('') : '<p class="small">Pas encore de but marqué cette saison.</p>'}</div>
    <div class="card"><div class="card-title">Effectif (${squad.length})</div>${squad.map(p => playerRowHTML(p, { returnTo: 'clubdetail' })).join('')}</div>
